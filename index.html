<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#fff1f5">

<title>해치 크리스마스 — 오래된 별의 자리</title>

<style>

:root{

  --bg:#fff1f5;--soft:#fce7f3;--pink:#f472b6;--deep:#db2777;

  --red:#dc2626;--green:#15803d;--dark:#14532d;--ink:#31202d;

}

*{box-sizing:border-box}

body{

  margin:0;background:var(--bg);color:var(--ink);

  font-family:"DungGeunMo","Courier New",monospace,sans-serif;

  display:flex;justify-content:center;

}

button,input,select{font:inherit}

button{cursor:pointer;touch-action:manipulation}

button:disabled{opacity:.5;cursor:default}

button:focus-visible,input:focus-visible,select:focus-visible{

  outline:3px solid #0284c7;outline-offset:2px;

}

[hidden]{display:none!important}

#app{

  width:min(100%,440px);height:100vh;height:min(100dvh,750px);

  position:relative;display:flex;flex-direction:column;

  overflow:hidden;border:4px solid var(--deep);

  border-radius:0 0 12px 12px;background:var(--bg);

  box-shadow:4px 4px #831843,8px 8px #db277733;

}

.bar{

  flex:none;min-height:45px;background:white;padding:6px 8px;

  border-bottom:3px solid var(--deep);

  display:flex;align-items:center;justify-content:space-between;gap:5px;

}

.badge{

  padding:4px 6px;border:2px solid var(--dark);border-radius:4px;

  font-size:11px;font-weight:bold;background:var(--green);color:white;

  white-space:nowrap;

}

.tools{display:flex;gap:4px}

.small{

  padding:6px;border:2px solid var(--pink);background:#fff5f8;

  color:var(--deep);font-size:10px;border-radius:5px;

}

#screen{

  flex:1;min-height:0;padding:9px;display:flex;flex-direction:column;

  overflow:hidden;

}

.card{

  flex:1;min-height:0;border:3px solid var(--deep);border-radius:8px;

  background:white;display:flex;flex-direction:column;overflow:hidden;

  box-shadow:3px 3px #db277733;

}

.chapter{

  flex:none;margin:0;padding:9px;background:var(--green);color:white;

  text-align:center;font-size:14px;line-height:1.45;

  border-bottom:3px dashed #86efac;

}

.scene{

  flex:1;min-height:0;position:relative;overflow:hidden;

  background:linear-gradient(#ffedd5,#fce7f3);

  display:flex;align-items:center;justify-content:center;

}

.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.fallback{text-align:center;padding:15px;line-height:1.8;color:#9d174d}

.fallback .emoji{display:block;font-size:76px}

.fallback strong{font-size:13px}

.fallback small{display:block;font-size:11px}

.chat-layout{

  flex:none;height:clamp(155px,26dvh,195px);

  display:grid;grid-template-columns:3fr 7fr;border-top:3px solid var(--deep);

}

.avatar{

  position:relative;display:flex;justify-content:center;align-items:center;

  overflow:hidden;background:#fdf2f8;border-right:3px solid var(--deep);

}

.avatar span{font-size:42px}

.avatar img{position:absolute;width:100%;height:100%;object-fit:contain}

.chat{

  display:flex;flex-direction:column;gap:5px;min-width:0;

  min-height:0;padding:10px;background:var(--bg);

}

.sender{font-size:12px;color:var(--deep);font-weight:bold}

.message{

  flex:1;min-height:0;overflow-y:auto;font-size:13px;line-height:1.7;

  white-space:pre-wrap;word-break:keep-all;

}

.message.note{color:#64748b;font-style:italic}

.next{

  align-self:flex-end;padding:6px 8px;background:#ffe4e6;

  border:0;border-radius:4px;color:var(--deep);font-size:12px;

  min-height:32px;font-weight:bold;

}

.route{

  padding:10px;background:#fdf2f8;border-top:2px dashed var(--pink);

  font-size:12px;line-height:1.7;

}

.route strong{display:block;color:var(--deep)}

.action{

  width:100%;min-height:44px;padding:11px;border:3px solid #7f1d1d;

  border-radius:6px;box-shadow:0 4px #7f1d1d;

  color:white;background:var(--red);font-size:15px;font-weight:bold;

}

.action:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px #7f1d1d}

.green{background:var(--green);border-color:var(--dark);box-shadow:0 4px var(--dark)}

.outline{

  padding:8px;border:2px solid var(--pink);border-radius:6px;

  background:white;color:var(--deep);font-size:12px;min-height:38px;

}

.puzzle{

  flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;

  align-items:center;gap:13px;padding:13px;

}

.instructions{

  margin:0;width:100%;font-size:13px;line-height:1.7;

  text-align:center;font-weight:bold;color:var(--deep);

}

.clue{

  width:100%;padding:10px;border:2px dashed var(--pink);

  border-radius:6px;background:#fff5f8;line-height:1.7;

  font-size:13px;text-align:center;

}

.status{

  margin:0;min-height:24px;width:100%;font-size:12px;

  text-align:center;color:var(--green);line-height:1.6;font-weight:bold;

}

.hints{

  padding:7px;display:flex;align-items:center;gap:8px;

  border-top:2px dashed var(--pink);background:#f0fdf4;flex:none;

}

.hints p{margin:0;flex:1;font-size:11px;line-height:1.5;color:var(--dark)}

.debug{

  flex:none;display:flex;align-items:center;gap:5px;margin:5px 8px;

  padding:5px;background:#fef9c3;border:1px dashed #ca8a04;border-radius:4px;

}

.debug label,.debug button,.debug select{font-size:10px}

.debug select{flex:1;min-width:0;padding:4px}

.debug button{padding:5px;border:1px solid #ca8a04;background:white;border-radius:3px}

.cover{padding:0!important;position:relative;justify-content:flex-end}

.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.cover-base{

  position:absolute;inset:0;background:linear-gradient(#ffedd5,#fce7f3);

  display:flex;justify-content:center;align-items:center;font-size:110px;

}

.cover-panel{

  position:relative;padding:40px 18px 23px;text-align:center;

  background:linear-gradient(transparent,var(--bg) 20%);

}

.cover h1{font-size:27px;color:var(--deep);line-height:1.5;text-shadow:2px 2px white}

.cover p{font-size:13px;line-height:1.8}

.board{

  position:relative;width:100%;max-width:330px;flex:none;

  border:2px solid var(--pink);border-radius:10px;overflow:hidden;

}

.drag-board{

  height:300px;background:repeating-linear-gradient(0deg,#fff7ed 0 59px,#fed7aa 60px);

  touch-action:pan-y;

}

.hidden-box{

  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);

  width:90px;height:86px;border:3px solid #9d174d;border-radius:8px;

  background:#fbcfe8;font-size:39px;z-index:1;

}

.hidden-box.locked{pointer-events:none}

.prop{

  position:absolute;width:100px;height:88px;z-index:3;

  display:flex;align-items:center;justify-content:center;

  border:3px solid #9d174d;border-radius:9px;font-size:43px;

  background:#fecdd3;box-shadow:3px 4px #83184344;

  touch-action:none;user-select:none;

}

.prop:nth-of-type(2){background:#dcfce7;border-color:var(--dark)}

.prop:nth-of-type(3){background:#fef3c7;border-color:#a16207}

.prop.dragging{z-index:8;box-shadow:6px 8px #83184344}

.board-label{

  position:absolute;bottom:7px;left:5px;right:5px;text-align:center;

  font-size:10px;color:#9a3412;pointer-events:none;

}

.thread-board{aspect-ratio:1;background:#fff7ed;touch-action:none}

.thread-board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.hole{

  position:absolute;width:52px;height:52px;transform:translate(-50%,-50%);

  border:3px solid var(--deep);border-radius:50%;background:white;font-size:25px;

  touch-action:none;user-select:none;

}

.hole.done{background:#fef08a;box-shadow:0 0 14px #fde047}

.hole.start{box-shadow:0 0 0 5px #fbcfe8}

.lens-board{height:275px;background:#dbeafe;touch-action:none}

.city-svg{position:absolute;width:100%;height:100%;inset:0}

.lens{

  width:122px;height:122px;position:absolute;left:12%;top:15%;

  border:6px solid #db2777;border-radius:50%;background:#fff8;

  box-shadow:0 0 0 3px white,3px 5px 10px #83184344;

  touch-action:none;cursor:grab;

}

.lens::after{

  content:"";position:absolute;right:-21px;bottom:-27px;

  width:15px;height:44px;background:#db2777;border:2px solid white;

  border-radius:8px;transform:rotate(-38deg);

}

.lens svg{width:100%;height:100%;overflow:hidden;border-radius:50%}

.lens.locked{border-color:#ca8a04;box-shadow:0 0 24px #fde047}

.range-row{width:100%;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--deep)}

.range-row input{flex:1;min-width:0;accent-color:var(--deep)}

.book{

  width:100%;position:relative;height:110px;border:3px solid #9d174d;

  border-radius:6px;background:#fff7ed;overflow:hidden;

}

.book-under{

  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;

  text-align:center;font-size:14px;line-height:1.8;padding:8px;

}

.book canvas{position:absolute;width:100%;height:100%;inset:0;touch-action:none}

.dials{display:flex;gap:7px;width:100%;justify-content:center}

.dial{

  flex:1;max-width:66px;border:2px solid var(--deep);background:#fff5f8;

  border-radius:6px;padding:5px;text-align:center;

}

.dial button{

  width:100%;min-height:31px;background:white;color:var(--deep);

  border:1px solid var(--pink);border-radius:3px;font-size:12px;

}

.drum{

  position:relative;height:88px;overflow:hidden;margin:5px 0;

  background:var(--deep);color:white;border-radius:5px;touch-action:none;

  user-select:none;cursor:ns-resize;

}

.drum .prev,.drum .after{font-size:12px;opacity:.5;height:20px;line-height:20px}

.drum .value{height:48px;line-height:48px;font-size:27px;font-weight:bold}

.drum.moving{filter:brightness(1.2)}

.music-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:100%}

.music-key{

  position:relative;min-height:132px;border:3px solid var(--deep);border-radius:7px;

  background:linear-gradient(white,#fff1f5);color:var(--deep);

  font-size:21px;font-weight:bold;box-shadow:0 5px var(--pink);

}

.music-key.active{background:#fef08a;transform:translateY(4px);box-shadow:0 1px var(--pink)}

.music-key.active::before{content:"♪";position:absolute;left:35%;top:-27px;color:#db2777;animation:float .5s both}

.layers{display:flex;width:100%;justify-content:center;gap:8px;font-size:22px}

.layers span{opacity:.25}

.layers span.on{opacity:1;filter:drop-shadow(0 0 4px #f9a8d4)}

.memory-board{height:285px;background:#fff7ed}

.memory-under{

  position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;

  justify-content:center;align-items:center;gap:12px;

  background:linear-gradient(#fef3c7,#fff1f5);

}

.wish{

  padding:9px 12px;border:1px solid #f9a8d4;border-radius:5px;

  background:white;font-size:12px;line-height:1.6;transform:rotate(-3deg);

  box-shadow:2px 3px #db277722;max-width:95%;

}

.wish:nth-child(2){transform:rotate(3deg);background:#f0fdf4}

.wish:nth-child(3){transform:rotate(-1deg);background:#fff7ed}

.memory-board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

.memory-spark{

  position:absolute;right:12px;top:8px;font-size:28px;pointer-events:none;

  animation:twinkle 1.4s infinite;

}

.circuit{

  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;

  width:100%;max-width:285px;padding:7px;background:#fff1f5;

  border:2px solid var(--pink);border-radius:8px;

}

.pipe{

  min-width:0;aspect-ratio:1;padding:5px;border:2px solid #94a3b8;

  border-radius:7px;background:#f8fafc;

}

.pipe svg{width:100%;height:100%;display:block}

.pipe.lit{background:#fef9c3;border-color:#ca8a04;box-shadow:0 0 8px #facc1533}

.circuit-label{font-size:12px;color:var(--deep);font-weight:bold;margin:0}

.star-finish{

  position:absolute;inset:0;z-index:8;pointer-events:none;

  display:flex;align-items:center;justify-content:center;

  background:#fff7edcc;

}

.star-finish span{font-size:90px;animation:ascend 1.8s ease-in forwards}

.particle{

  position:absolute;pointer-events:none;z-index:20;

  color:#f59e0b;font-size:22px;animation:particle .9s ease-out forwards;

}

.modal{

  position:absolute;inset:0;z-index:50;background:#0008;

  backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:center;

  padding:20px;

}

.modal-card{

  width:100%;max-height:90%;overflow:auto;background:white;

  border:3px solid var(--deep);border-radius:12px;

  padding:20px 16px;text-align:center;box-shadow:5px 5px #db277766;

}

.modal h2{font-size:19px;color:var(--deep)}

.modal p{font-size:13px;line-height:1.8;white-space:pre-wrap}

@keyframes float{to{transform:translateY(-22px);opacity:0}}

@keyframes twinkle{50%{transform:scale(1.16);opacity:.55}}

@keyframes ascend{25%{transform:scale(1.2)}to{transform:translateY(-250px) scale(.25);opacity:0}}

@keyframes particle{to{transform:translate(var(--dx),var(--dy)) rotate(100deg);opacity:0}}

@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.shake{animation:shake .25s}

@media(max-width:360px){

  .puzzle{padding:10px;gap:11px}

  .message{font-size:12px}

  .chapter{font-size:12px}

  .small{padding:5px;font-size:9px}

}

@media(prefers-reduced-motion:reduce){

  *,*::before,*::after{animation:none!important}

}

</style>

</head>

<body>

<div id="app">

  <header class="bar">

    <span class="badge" id="progress">해치 크리스마스</span>

    <div class="tools">

      <button class="small" id="music-toggle" aria-pressed="false">♫ 음악 OFF</button>

      <button class="small" id="sound-toggle" aria-pressed="false">효과음 OFF</button>

      <button class="small" id="home">처음으로</button>

    </div>

  </header>

  <main id="screen"></main>

  <div class="debug" id="debug">

    <label for="jump">테스트</label>

    <select id="jump" aria-label="문제 바로 이동"></select>

    <button id="jump-go">이동</button>

    <button id="pass">문제 패스</button>

  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true"

       aria-labelledby="modal-title" hidden>

    <div class="modal-card">

      <div id="modal-icon" style="font-size:38px">✨</div>

      <h2 id="modal-title"></h2>

      <p id="modal-text"></p>

      <button class="action" id="modal-ok">확인</button>

      <button class="outline" id="modal-cancel"

              style="width:100%;margin-top:12px" hidden>취소</button>

    </div>

  </div>

</div>

<script>

"use strict";

/*

────────────────────────────────────────────────────────

설정 / 이미지

────────────────────────────────────────────────────────

외부 라이브러리·음원 파일 없이 실행합니다.

효과음과 배경음악은 Web Audio API로 합성합니다.

아래 이미지가 없으면 대체 그림이 표시됩니다.

HTML과 같은 폴더에 넣으세요.

intro.gif / outro.gif

image_01.png ~ image_08.png : 이야기 이미지

route_01.png ~ route_07.png : 현장 이동 안내 사진

haechi.gif / ju.png / baekho.png

cheongryong.png / hyeonmu.png / star.png

현재 퍼즐의 그림·암호는 테스트용입니다.

현장에 맞게 바꿀 때는 문제 단서·정답·힌트를 함께 수정하세요.

TEST_MODE=false : 테스트 메뉴 숨기기

*/

const TEST_MODE=true;

const SAVE_KEY="seoul-star-bright-v5";

const $=id=>document.getElementById(id);

const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const say=(name,text)=>({name,text});

const note=text=>({name:"",text,kind:"note"});

const CHAR={

  "해치":{file:"haechi.gif",emoji:"🩷"},

  "주작":{file:"ju.png",emoji:"🔴"},

  "백호":{file:"baekho.png",emoji:"🐯"},

  "청룡":{file:"cheongryong.png",emoji:"🔵"},

  "현무":{file:"hyeonmu.png",emoji:"🟢"},

  "별":{file:"star.png",emoji:"⭐"}

};

const TITLES=[

  "상자 속에 뭐가 들었지?",

  "별아, 일어날 시간이야!",

  "이 풍경, 본 적 있어!",

  "책 사이에 숨은 기억",

  "어디서 들어본 노래인데?",

  "아직 읽을 게 많아!",

  "별이 가고 싶은 곳"

];

const ROUTES=[

  {

    place:"장식 상자 체험 지점",

    info:"운영자가 지정한 장식 상자 체험 지점으로 이동해 주세요.",

    line:"장식 상자부터 찾으러 가자! 이번에는 분명 잘 보이는 곳에 뒀는데……."

  },

  {

    place:"대형 트리",

    info:"크리스마스 대형 트리가 있는 공간으로 이동해 주세요.",

    line:"별도 찾았으니 트리로 출발! 끈만 고치면 아주 근사할 거야."

  },

  {

    place:"내친구서울 1관",

    info:"내친구서울 1관의 서울 전경 관람 지점으로 이동해 주세요.",

    line:"서울이 한눈에 보이는 곳으로 가보자. 별이 아는 풍경이 있을지도 몰라!"

  },

  {

    place:"서울책방",

    info:"서울책방의 지정 체험 지점으로 이동해 주세요.",

    line:"책이 나왔으니 다음은 서울책방! 기억도 책갈피처럼 쏙 나오면 좋겠다."

  },

  {

    place:"공연장",

    info:"공연장 관람 구역의 지정 체험 지점으로 이동해 주세요. 공연 중에는 현장 안내를 따라 주세요.",

    line:"이번에는 소리를 찾아보자. 공연장에서는 우리도 잠깐 연주자가 되는 거야!"

  },

  {

    place:"소망나무",

    info:"소망나무 앞으로 이동해 주세요. 걸린 소망 종이는 떼지 않고 살펴봐 주세요.",

    line:"하루 이야기, 하고 싶은 일…… 그런 이야기가 잔뜩 있는 곳을 알아!"

  },

  {

    place:"대형 트리 옆 크리스마스 공간",

    info:"대형 트리 옆 크리스마스 체험 지점으로 돌아와 주세요.",

    line:"다시 트리로! 이번에는 별이 가고 싶은 곳이 생겼대. 같이 가보자!"

  }

];

const BEFORE=[

  [

    say("해치","안녕! 잘 왔어. 나랑 크리스마스 트리 좀 꾸며줄래?"),

    say("해치","장식 상자를 찾고 있는데…… 이상하다. 아까까진 분명 여기 있었거든."),

    say("해치","다른 상자 밑에 깔렸나? 위에 있는 것부터 살짝 옮겨보자!")

  ],

  [

    say("해치","찾았다! 먼지만 털면 다시 반짝이겠는데?"),

    say("주작","잠깐! 그 끈으로 걸면 떨어져!"),

    say("해치","아직 안 걸었거든! 새 끈부터 달아줄 거야."),

    say("주작","그럼 난 별 잡고 있을게. 끈은 부탁해. 이번엔 튼튼하게!")

const esc=s=>String(s).replace(/[&<>"']/g,c=>({

function later(fn,ms){

  const version=screenVersion;

  const id=setTimeout(()=>{if(version===screenVersion) fn()},ms);

  screenTimers.push(id);

  return id;

}

function cleanup(){

  clearInterval(typing);typing=null;typeFinish=null;

  screenTimers.forEach(clearTimeout);screenTimers=[];

  cleanups.forEach(fn=>fn());cleanups=[];

  screenVersion++;

  $("screen").className="";

  $("screen").replaceChildren();

  stopGameVoices();

}

function persist(){

  if(!saveAllowed) return;

  try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}

  catch(e){saveAllowed=false}

}

function getSaved(){

  try{

    const p=JSON.parse(localStorage.getItem(SAVE_KEY));

    if(p && Number.isInteger(p.stage) && p.stage>=0 && p.stage<7 &&

      ["before","guide","puzzle","after","epilogue","outro"].includes(p.phase)) return p;

  }catch(e){}

  return null;

}

function picture(file,label,emoji="⭐",caption=""){

  return `<div class="scene">

      ${caption?`<small>${esc(caption)}</small>`:""}

    </div>

    <img src="${esc(file)}" alt="${esc(label)}" onerror="this.hidden=true">

  </div>`;

}

function navigate(phase,stage=state.stage){

  cleanup();

  state={phase,stage};locked=false;persist();

  $("progress").textContent=

    phase==="intro"?"해치 크리스마스":

    phase==="epilogue"?"에필로그":

    phase==="outro"?"탐험 완료!":`미션 ${stage+1}/7`;

  $("jump").value=stage;

  $("pass").disabled=!["before","guide","puzzle"].includes(phase);

  if(phase==="intro") intro();

  if(phase==="before") dialogue(BEFORE[stage],()=>navigate("guide"),TITLES[stage],`image_0${stage+1}.png`);

  if(phase==="guide") guide();

  if(phase==="puzzle") puzzle();

  if(phase==="after") dialogue(AFTER[stage],()=>{

    stage===6?navigate("epilogue"):navigate("before",stage+1);

  },"다음 이야기는?",`image_0${stage+1}.png`);

  if(phase==="epilogue") dialogue(EPILOGUE,()=>navigate("outro"),"아직 읽을 이야기가 많아!","image_08.png");

  if(phase==="outro") outro();

}

function dialogue(lines,done,title,image){

  let index=0;

  $("screen").innerHTML=`

    <section class="card">

      <h1 class="chapter">${esc(title)}</h1>

      ${picture(image,title,"🎄")}

      <div class="chat-layout">

        <div class="avatar"><span id="avatar-emoji"></span>

          <img id="avatar-img" alt="" onerror="this.hidden=true">

        </div>

        <div class="chat">

          <div class="sender" id="sender"></div>

          <div class="message" id="message"></div>

          <button class="next" id="next" hidden>다음 ▶</button>

        </div>

      </div>

    </section>`;

  function line(){

    const item=lines[index],character=CHAR[item.name];

    $("sender").textContent=item.kind==="note"?"이야기":item.name;

    $("message").classList.toggle("note",item.kind==="note");

    $("avatar-img").hidden=true;

    $("avatar-emoji").textContent=character?.emoji||"✨";

    if(character){

      $("avatar-img").src=character.file;

      $("avatar-img").alt=item.name;$("avatar-img").hidden=false;

    }

    $("next").textContent=index===lines.length-1?

      (state.phase==="before"?"어디로 갈까? ▶":"계속하기 ▶"):"다음 ▶";

    typeText($("message"),item.kind==="note"?`(${item.text})`:item.text,$("next"));

  }

  $("message").onclick=()=>typeFinish?.();

  $("next").onclick=()=>{

    if(typeFinish){typeFinish();return}

    if(index<lines.length-1){index++;line()}else done();

  };

  line();

}

function typeText(element,text,button){

  clearInterval(typing);

  element.textContent="";element.scrollTop=0;button.hidden=true;

  let i=0;const letters=Array.from(text);

  typeFinish=()=>{

    clearInterval(typing);typing=null;element.textContent=text;

    button.hidden=false;typeFinish=null;

  };

  if(reduced()){typeFinish();return}

  typing=setInterval(()=>{

    element.textContent+=letters[i++];

    if(i%4===0) sfx(850,.016,.006);

    if(i>=letters.length) typeFinish?.();

  },25);

}

      <button class="hidden-box locked" id="hidden-box" aria-label="별 장식 상자">📦</button>

      <span class="board-label">물건은 이 안에서 자유롭게 옮길 수 있어요.</span>

    <p class="status" id="status">별 상자 위에 뭐가 이렇게 많지?</p>

    <button class="outline" id="boxes-reset">다시 쌓기</button>

    <p style="font-size:10px;color:#64748b;margin:0;text-align:center">

      키보드: 물건 선택 후 방향키로 이동

    </p>`;

  const board=$("drag-board"),target=$("hidden-box");

  const props=[];

  const W=board.clientWidth;

  const positions=[

    {x:W*.5-75,y:95,icon:"🎀",label:"리본 상자"},

    {x:W*.5-15,y:142,icon:"🎁",label:"선물 상자"},

    {x:W*.5-72,y:162,icon:"🎄",label:"장식 상자"}

  ];

  function overlap(a,b){

    return Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*

           Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));

  }

  function check(){

    const rect=target.getBoundingClientRect();

    const count=props.filter(p=>overlap(p.getBoundingClientRect(),rect)<100).length;

    target.classList.toggle("locked",count<3);

    status(count===3?"찾았다! 가운데 별 상자를 열어봐!":`가려진 물건 옮기기 ${count}/3`);

    if(count===3) target.textContent="⭐";

  positions.forEach((p,i)=>{

    const b=document.createElement("button");

    b.className="prop";b.textContent=p.icon;b.setAttribute("aria-label",p.label+" 끌어서 옮기기");

    b.style.left=p.x+"px";b.style.top=p.y+"px";

    board.append(b);props.push(b);

    let drag=null;

    b.onpointerdown=e=>{

      if(locked) return;

      const r=b.getBoundingClientRect();

      drag={dx:e.clientX-r.left,dy:e.clientY-r.top};

      b.setPointerCapture(e.pointerId);b.classList.add("dragging");

    };

    b.onpointermove=e=>{

      if(!drag) return;

      const r=board.getBoundingClientRect();

      b.style.left=clamp(e.clientX-r.left-drag.dx,0,board.clientWidth-b.offsetWidth)+"px";

      b.style.top=clamp(e.clientY-r.top-drag.dy,0,board.clientHeight-b.offsetHeight)+"px";

      check();

    };

    const end=()=>{drag=null;b.classList.remove("dragging");check()};

    b.onpointerup=end;b.onpointercancel=end;

    b.onkeydown=e=>{

      const moves={ArrowLeft:[-15,0],ArrowRight:[15,0],ArrowUp:[0,-15],ArrowDown:[0,15]};

      if(!moves[e.key]) return;

      e.preventDefault();

      b.style.left=clamp(parseFloat(b.style.left)+moves[e.key][0],0,board.clientWidth-b.offsetWidth)+"px";

      b.style.top=clamp(parseFloat(b.style.top)+moves[e.key][1],0,board.clientHeight-b.offsetHeight)+"px";

      check();

    };

  });

  target.onclick=()=>{

    if(target.classList.contains("locked")||locked) return;

    target.textContent="🌟";

    solve("데굴! 상자 속에서 낡은 별 하나가 굴러 나왔어요.");

  };

  $("boxes-reset").onclick=()=>props.forEach((b,i)=>{

    b.style.left=positions[i].x+"px";b.style.top=positions[i].y+"px";check();

  });

  check();

}

function thread(){

  const points=[

    {x:22,y:23,icon:"☀️"},

    {x:78,y:23,icon:"🌙"},

    {x:22,y:77,icon:"⭐"},

    {x:78,y:77,icon:"❤️"}

  ];

  const target=[0,3,1,2];

  let input=[],dragging=false,cursor=null,tapMode=false;

  $("puzzle").innerHTML=`

    <p class="instructions">해에서 끈을 잡고 출발!<br>손을 떼지 않고 아래 순서대로 지나가세요.</p>

    <div class="clue" style="font-size:23px">☀️ → ❤️ → 🌙 → ⭐</div>

    <div class="board thread-board" id="thread-board">

      <svg viewBox="0 0 100 100">

        <path d="M18 50 L50 14 L82 50 L50 88 Z"

          fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>

        <polyline id="thread-fixed" fill="none" stroke="#dc2626" stroke-width="2.2"

          stroke-linecap="round" stroke-linejoin="round"/>

        <line id="thread-live" stroke="#f472b6" stroke-width="1.7" stroke-dasharray="3 2"/>

      </svg>

    </div>

    <p class="status" id="status">☀️ 해 그림에서 시작해 주세요.</p>

    <button class="outline" id="thread-mode">끌기가 어려워요 · 누르기로 꿰기</button>`;

  const board=$("thread-board");

  function draw(){

    $("thread-fixed").setAttribute("points",input.map(i=>`${points[i].x},${points[i].y}`).join(" "));

    const last=points[input.at(-1)];

    const line=$("thread-live");

    line.setAttribute("x1",last?.x??0);line.setAttribute("y1",last?.y??0);

    line.setAttribute("x2",cursor?.x??last?.x??0);line.setAttribute("y2",cursor?.y??last?.y??0);

    board.querySelectorAll(".hole").forEach((b,i)=>b.classList.toggle("done",input.includes(i)));

  }

  function reset(message){

    input=[];cursor=null;dragging=false;draw();

    status(message||"해에서 다시 출발!");

  }

  function take(index){

    if(input.includes(index)) return;

    if(target[input.length]!==index){

      reset("앗, 끈이 꼬였어! 해부터 다시 이어보자.");return;

    }

    input.push(index);sfx(450+input.length*90,.08,.025);

    status(`끈 꿰기 ${input.length}/4`);

    draw();

    if(tapMode&&input.length===4) solve("새 끈 완성! 이번에는 튼튼하게 걸 수 있겠어요.");

  }

  points.forEach((p,i)=>{

    const b=document.createElement("button");

    b.className="hole"+(i===0?" start":"");

    b.style.left=p.x+"%";b.style.top=p.y+"%";b.textContent=p.icon;

    b.setAttribute("aria-label",p.icon+" 끈 구멍");

    b.onclick=()=>{if(tapMode&&!locked) take(i)};

    board.append(b);

  });

  const pos=e=>{

    const r=board.getBoundingClientRect();

    return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};

  };

  board.onpointerdown=e=>{

    if(tapMode||locked) return;

    const p=pos(e);

    if(Math.hypot(p.x-points[0].x,p.y-points[0].y)>13){

      status("해 그림을 잡고 시작해 주세요.");return;

    }

    input=[];cursor=p;dragging=true;

    board.setPointerCapture(e.pointerId);take(0);

  };

  board.onpointermove=e=>{

    if(!dragging||tapMode||locked) return;

    cursor=pos(e);

    const index=points.findIndex(p=>Math.hypot(cursor.x-p.x,cursor.y-p.y)<11);

    if(index>=0) take(index);

    if(dragging) draw();

  };

  board.onpointerup=()=>{

    if(!dragging) return;

    dragging=false;cursor=null;draw();

    if(input.length===4) solve("새 끈 완성! 별을 트리에 걸어볼까요?");

    else reset("중간에 손을 놓았네! 다시 해에서 출발해 보자.");

  };

  board.onpointercancel=()=>reset();

  $("thread-mode").onclick=()=>{

    tapMode=!tapMode;reset(tapMode?"같은 순서대로 그림을 눌러주세요.":"해를 잡고 끌어주세요.");

    $("thread-mode").textContent=tapMode?"다시 끌어서 꿰기":"끌기가 어려워요 · 누르기로 꿰기";

  };

}

   공용 스크래치

─────────────────────── */

function setupScratch(canvas,{threshold=.5,kind="dust",onDone,onProgress}){

  const r=canvas.getBoundingClientRect();

  canvas.width=Math.max(1,Math.round(r.width));

  canvas.height=Math.max(1,Math.round(r.height));

  const ctx=canvas.getContext("2d",{willReadFrequently:true});

  const gradient=ctx.createLinearGradient(0,0,canvas.width,canvas.height);

  gradient.addColorStop(0,kind==="fog"?"#cedee9":"#ccb6aa");

  gradient.addColorStop(1,kind==="fog"?"#aebdce":"#a58d86");

  ctx.fillStyle=gradient;ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){

    ctx.fillStyle=i%2?"#ffffff25":"#ffffff45";

    ctx.beginPath();

    ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,Math.random()*8+1,0,Math.PI*2);

    ctx.fill();

  }

  ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 14px sans-serif";

  ctx.fillText(kind==="fog"?"손가락으로 뿌연 곳을 닦아주세요":"먼지를 슥슥 닦아보세요",canvas.width/2,canvas.height/2);

  let dragging=false,last=null,moves=0,finished=false;

  function reveal(){

    if(finished) return;

    finished=true;canvas.hidden=true;onDone();

  }

  function estimate(){

    if(finished) return;

    const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;

    let clear=0,total=0;

    for(let i=3;i<data.length;i+=80){total++;if(data[i]<60) clear++}

    const percent=clear/total;

    onProgress?.(Math.round(percent*100));

    if(percent>=threshold) reveal();

  }

  function erase(e){

    if(!dragging||finished) return;

    const rect=canvas.getBoundingClientRect();

    const p={

      x:(e.clientX-rect.left)*canvas.width/rect.width,

      y:(e.clientY-rect.top)*canvas.height/rect.height

    };

    ctx.globalCompositeOperation="destination-out";

    ctx.lineCap="round";ctx.lineWidth=kind==="fog"?44:32;

    ctx.beginPath();ctx.moveTo(last?.x??p.x,last?.y??p.y);

    ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke();last=p;

    if(++moves%5===0) estimate();

  }

  canvas.onpointerdown=e=>{

    dragging=true;last=null;canvas.setPointerCapture(e.pointerId);erase(e);

  };

  canvas.onpointermove=erase;

  canvas.onpointerup=()=>{dragging=false;last=null;estimate()};

  canvas.onpointercancel=()=>{dragging=false;last=null};

  return reveal;

}

function bookDial(){

  const chars=["별","나","라","무","달","빛","꿈","집"];

  const values=[4,5,6,7];

  const answer=["별","나","라","무"];

  let revealed=false;

  $("puzzle").innerHTML=`

    <p class="instructions">책 위 먼지를 닦아 숨은 표시를 찾고,<br>다이얼을 굴려 그림 상자를 열어주세요.</p>

    <div class="book">

      <div class="book-under">🍬 별사탕 · 🌳 나무<br>📻 라디오 · 🌈 무지개<br><small>이름의 첫 글자를 모아봐!</small></div>

      <canvas id="book-scratch" aria-label="책 위 먼지 닦기"></canvas>

    </div>

    <button class="outline" id="book-reveal">문지르기 대신 책 펼쳐보기</button>

    <div class="dials" id="dials"></div>

    <p class="status" id="status">다이얼은 위아래로 밀면 휙 돌아갑니다.</p>

    <button class="action" id="dial-open">상자 열기</button>`;

  const reveal=setupScratch($("book-scratch"),{

    threshold:.42,onDone:()=>{

      revealed=true;$("book-reveal").hidden=true;

      status("그림 이름의 첫 글자! 이제 다이얼을 맞춰보자.");

      sfx(880,.12,.025);

    }

  });

  $("book-reveal").onclick=reveal;

  values.forEach((_,index)=>{

    const col=document.createElement("div");col.className="dial";

    col.innerHTML=`

      <button aria-label="${index+1}번째 다이얼 이전">▲</button>

      <div class="drum" tabindex="0" role="spinbutton"

        aria-label="${index+1}번째 글자" aria-valuemin="0" aria-valuemax="7">

        <div class="prev"></div><div class="value"></div><div class="after"></div>

      </div>

      <button aria-label="${index+1}번째 다이얼 다음">▼</button>`;

    $("dials").append(col);

    const drum=col.querySelector(".drum");

    let spinToken=0,start=null,lastY=0,lastT=0,velocity=0,carry=0;

    function render(){

      const v=values[index];

      drum.children[0].textContent=chars[(v+7)%8];

      drum.children[1].textContent=chars[v];

      drum.children[2].textContent=chars[(v+1)%8];

      drum.setAttribute("aria-valuenow",v);

      drum.setAttribute("aria-valuetext",chars[v]);

    }

    function step(delta){

      if(locked) return;

      values[index]=(values[index]+delta+8)%8;render();sfx(310,.025,.012);

    }

    function coast(speed,token){

      if(Math.abs(speed)<.12||token!==spinToken||locked){

        drum.classList.remove("moving");return;

      }

      step(speed>0?1:-1);

      later(()=>coast(speed*.65,token),70);

    }

    col.children[0].onclick=()=>{spinToken++;step(-1)};

    col.children[2].onclick=()=>{spinToken++;step(1)};

    drum.onpointerdown=e=>{

      if(locked) return;

      spinToken++;start=e.clientY;lastY=e.clientY;lastT=performance.now();

      velocity=0;carry=0;drum.setPointerCapture(e.pointerId);

      drum.classList.add("moving");

    };

    drum.onpointermove=e=>{

      if(start===null) return;

      const now=performance.now(),dy=lastY-e.clientY;

      velocity=dy/Math.max(now-lastT,1);carry+=dy;

      while(Math.abs(carry)>=24){

        const direction=carry>0?1:-1;step(direction);carry-=direction*24;

      }

      lastY=e.clientY;lastT=now;

    };

    drum.onpointerup=()=>{

      if(start===null) return;

      start=null;

      if(performance.now()-lastT>100) velocity=0;

      coast(clamp(velocity,-2.5,2.5),spinToken);

    };

    drum.onpointercancel=()=>{start=null;spinToken++;drum.classList.remove("moving")};

    drum.onkeydown=e=>{

      if(e.key==="ArrowUp"||e.key==="ArrowDown"){

        e.preventDefault();spinToken++;step(e.key==="ArrowUp"?1:-1);

      }

    };

    drum.addEventListener("wheel",e=>{

      e.preventDefault();spinToken++;step(e.deltaY>0?1:-1);

    },{passive:false});

    cleanups.push(()=>spinToken++);

    render();

  });

  $("dial-open").onclick=()=>{

    if(!revealed){status("책 위의 숨은 표시부터 찾아보자!");return}

    if(values.every((v,i)=>chars[v]===answer[i])){

      solve("달칵! 상자 안에서 작은 방의 기억을 찾았어요.");

    }else fail("그림 이름의 첫 글자를 왼쪽부터 차례대로 맞춰주세요.");

  };

}

    input=[];heard=false;listening=true;

    const token=++phraseToken;

    $("listen").disabled=true;

    const phrase=phrases[round],beat=.48;

    phrase.forEach((n,i)=>{

      later(()=>{

        if(token!==phraseToken) return;

        flash(n);bell(midi[n],.42,.13,"game");

        accompaniment(round,i,beat);

        status(`${round+1}번째 구절 듣는 중 · ${names[n]}`);

      },i*beat*1000);

    });

    later(()=>{

      if(token!==phraseToken) return;

      listening=false;heard=true;$("listen").disabled=false;

      $("listen").textContent="♫ 이번 구절 다시 듣기";

      status(`이제 따라 쳐보세요! ${round+1}/3 구절`);

    },phrase.length*beat*1000+150);

  }

  names.forEach((name,i)=>{

    const b=document.createElement("button");b.className="music-key";

    b.id=`key-${i}`;b.textContent=name;

    b.onclick=()=>{

      if(listening||locked) return;

      if(!heard){status("먼저 이번 구절을 들어보자!");return}

      unlockAudio();flash(i);bell(midi[i],.38,.13,"game");

      const target=phrases[round];

      if(i!==target[input.length]){

        input=[];sfx(180,.08,.018);

        status("앗, 한 번만 다시! 듣기 버튼으로 다시 들을 수 있어요.");return;

      }

      input.push(i);

      status(`${round+1}/3 구절 · ${input.map(n=>names[n]).join(" → ")}`);

      if(input.length===target.length){

        $(`layer-${round}`).classList.add("on");

        input=[];round++;heard=false;

        if(round===3){finalPerformance();return}

        listening=true;$("listen").disabled=true;

        successSound();

        status("좋아! 반주가 하나 늘었어. 다음 구절로!");

        later(()=>{

          listening=false;$("listen").disabled=false;

          $("listen").textContent=`♫ ${round+1}번째 구절 듣기`;

        },700);

      }

    };

    $("keys").append(b);

  });

  function finalPerformance(){

    listening=true;$("listen").disabled=true;

    status("완성! 이번에는 반주와 함께 들어봐!");

    const full=phrases.flat(),beat=.34;

    full.forEach((n,i)=>{

      later(()=>{

        flash(n,180);bell(midi[n],.4,.13,"game");

        accompaniment(3,i,beat);

      },i*beat*1000);

    });

    later(()=>solve("작은 연주 완성! 별이 신나게 노래를 따라 부르기 시작했어요."),full.length*beat*1000+350);

  }

  $("listen").onclick=playPhrase;

  $("music-clear").onclick=()=>{

    if(listening||locked) return;

    input=[];status("이번 구절 입력을 지웠어요. 처음 음부터 다시!");

  };

  cleanups.push(()=>phraseToken++);

}

function accompaniment(level,index,beat){

  if(!unlockAudio()) return;

  const chord=index%4<2?[60,64,67]:[55,59,62];

  if(level>=1){

    synth(chord[0]-24,beat*.8,.055,"triangle",0,"game");

  }

  if(level>=2){

  }

  if(level>=3 && index%2===0){

    bell(chord[2]+12,.32,.025,"game");

  }

}

/* ───────────────────────

   7. 회전 전선 + 실제 빛의 전파

─────────────────────── */

function rotateMask(m){return ((m<<1)&15)|((m>>3)&1)}

function connected(masks){

  const seen=new Set();

  if(!(masks[0]&8)) return seen;

  const queue=[0];

  while(queue.length){

    const i=queue.shift();if(seen.has(i)) continue;seen.add(i);

    const r=Math.floor(i/3),c=i%3;

    [[1,-3,4,r>0],[2,1,8,c<2],[4,3,1,r<2],[8,-1,2,c>0]].forEach(([bit,d,other,valid])=>{

      if(valid&&(masks[i]&bit)&&(masks[i+d]&other)&&!seen.has(i+d)) queue.push(i+d);

    });

  }

  return seen;

}

function isComplete(masks){

  if(connected(masks).size!==9||!(masks[8]&2)) return false;

  for(let i=0;i<9;i++){

    const r=Math.floor(i/3),c=i%3;

    for(const [bit,d,other,valid] of [[1,-3,4,r>0],[2,1,8,c<2],[4,3,1,r<2],[8,-1,2,c>0]]){

      if(!(masks[i]&bit)) continue;

      if(!valid){

        if(!((i===0&&bit===8)||(i===8&&bit===2))) return false;

      }else if(!(masks[i+d]&other)) return false;

    }

  }

  return true;

}

function circuit(){

  const solution=[10,10,12,6,10,9,3,10,10];

  const turns=[1,1,2,1,1,2,3,1,1];

  const make=()=>solution.map((m,i)=>{

    for(let n=0;n<turns[i];n++) m=rotateMask(m);

    return m;

  });

  let masks=make(),waveToken=0;

  $("puzzle").innerHTML=`

    <p class="instructions">칸을 누르면 전선이 돌아갑니다.<br>아홉 칸을 모두 지나 별까지 빛을 보내주세요!</p>

    <p class="circuit-label">입구 ➜ 첫 번째 줄 왼쪽</p>

    <div class="circuit" id="circuit"></div>

    <p class="circuit-label">마지막 줄 오른쪽 ➜ ⭐</p>

    <p class="status" id="status">빛이 어디까지 가는지 살펴보세요.</p>

    <button class="action" id="send-light">빛 보내기!</button>

    <button class="outline" id="circuit-reset">전선 초기화</button>`;

  function draw(){

    $("circuit").innerHTML="";

    masks.forEach((mask,i)=>{

      const b=document.createElement("button");b.className="pipe";b.id=`pipe-${i}`;

      let lines="",labels=[];

      [[1,50,0,"위"],[2,100,50,"오른쪽"],[4,50,100,"아래"],[8,0,50,"왼쪽"]].forEach(([bit,x,y,label])=>{

        if(mask&bit){lines+=`<path d="M50 50L${x} ${y}"/>`;labels.push(label)}

      });

      b.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true">

        <g fill="none" stroke="#64748b" stroke-width="13" stroke-linecap="round">${lines}</g>

        <circle cx="50" cy="50" r="10" fill="#94a3b8"/>

      </svg>`;

      b.setAttribute("aria-label",`${i+1}번 전선 ${labels.join(", ")}. 누르면 회전`);

      b.onclick=()=>{

        if(locked) return;

        masks[i]=rotateMask(masks[i]);sfx(380,.03,.012);draw();wave(false);

      };

      $("circuit").append(b);

    });

  }

  function light(i){

    const b=$(`pipe-${i}`);if(!b) return;

    b.classList.add("lit");

    b.querySelector("g").setAttribute("stroke","#ca8a04");

    b.querySelector("circle").setAttribute("fill","#facc15");

  }

  function wave(sound){

    const token=++waveToken;

    const cells=Array.from(connected(masks));

    cells.forEach((i,n)=>later(()=>{

      if(token!==waveToken) return;

      light(i);

      if(sound) bell(60+n*2,.2,.035,"game");

    },n*110));

    status(`빛이 닿는 칸 ${cells.length}/9`);

    return cells.length*110;

  }

  $("send-light").onclick=()=>{

    if(locked) return;

    draw();

    const duration=wave(true);

    if(isComplete(masks)){

      locked=true;$("send-light").disabled=true;

      later(()=>{

        const fx=document.createElement("div");fx.className="star-finish";

        fx.innerHTML="<span>🌟</span>";$("screen").append(fx);

        celebrate();successSound();

        later(()=>{

          modal("별이 떠오른다!","이어진 빛이 별에게 모여들기 시작했어요.",

            ()=>navigate("after"),"별을 따라 보기 ▶","🌟");

        },1700);

      },duration+180);

    }else{

      later(()=>fail("빛이 멈춘 곳을 살펴보세요. 모든 칸을 지나 출구까지 이어져야 해요!"),duration+150);

    }

  };

  $("circuit-reset").onclick=()=>{

    if(locked) return;

    masks=make();draw();wave(false);

  };

  cleanups.push(()=>waveToken++);

  draw();wave(false);

}

/* ─────────────────────────────────────────

   Web Audio 음악 엔진

   멜로디 + 화음 + 베이스 + 아르페지오 + 벨 + 셰이커

   외부 음원 없음 / 음악과 효과음 별도 제어

───────────────────────────────────────── */

let audio=null,master=null,reverb=null,noiseBuffer=null;

let musicOn=false,soundOn=false;

let bgmTimer=null,nextBeatTime=0,beatIndex=0;

const voices=new Set();

const frequency=midi=>440*Math.pow(2,(midi-69)/12);

const BPM=112;

const EIGHTH=60/BPM/2;

function unlockAudio(){

  try{

    const Constructor=window.AudioContext||window.webkitAudioContext;

    if(!Constructor) return false;

    if(!audio){

      audio=new Constructor();

      master=audio.createGain();master.gain.value=.7;

      const compressor=audio.createDynamicsCompressor();

      compressor.threshold.value=-18;compressor.knee.value=18;

      compressor.ratio.value=3;compressor.attack.value=.006;compressor.release.value=.2;

      master.connect(compressor);compressor.connect(audio.destination);

      reverb=audio.createConvolver();

      const length=Math.floor(audio.sampleRate*.8);

      const impulse=audio.createBuffer(2,length,audio.sampleRate);

      for(let c=0;c<2;c++){

        const d=impulse.getChannelData(c);

        for(let i=0;i<length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/length,3)*.18;

      }

      reverb.buffer=impulse;

      const wet=audio.createGain();wet.gain.value=.12;

      reverb.connect(wet);wet.connect(master);

      noiseBuffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.12),audio.sampleRate);

      const data=noiseBuffer.getChannelData(0);

      for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;

    }

    if(audio.state==="suspended") audio.resume().catch(()=>{});

    return true;

  }catch(e){return false}

}

function makeVoice(midi,duration,volume,type,when,group,bright=false){

  if(!audio||!master) return;

  const start=Math.max(when,audio.currentTime);

  const oscillator=audio.createOscillator(),gain=audio.createGain();

  const filter=audio.createBiquadFilter();

  filter.type="lowpass";filter.frequency.value=bright?6000:2200;

  oscillator.type=type;oscillator.frequency.value=frequency(midi);

  gain.gain.setValueAtTime(.0001,start);

  gain.gain.exponentialRampToValueAtTime(Math.max(.001,volume),start+.012);

  gain.gain.exponentialRampToValueAtTime(.0001,start+Math.max(.04,duration));

  oscillator.connect(filter);filter.connect(gain);gain.connect(master);

  if(bright) gain.connect(reverb);

  const voice={node:oscillator,group};

  voices.add(voice);

  oscillator.onended=()=>{

    oscillator.disconnect();filter.disconnect();gain.disconnect();voices.delete(voice);

  };

  oscillator.start(start);oscillator.stop(start+duration+.03);

}

function synth(midi,duration=.3,volume=.05,type="triangle",delay=0,group="game"){

  if(!unlockAudio()) return;

  makeVoice(midi,duration,volume,type,audio.currentTime+delay,group);

}

function bell(midi,duration=.6,volume=.06,group="game",when=null){

  if(!unlockAudio()) return;

  const t=when??audio.currentTime;

  makeVoice(midi,duration,volume,"sine",t,group,true);

  makeVoice(midi+12,duration*.45,volume*.23,"sine",t+.004,group,true);

  makeVoice(midi+19,duration*.25,volume*.06,"sine",t+.007,group,true);

}

function noise(when,volume=.006){

  if(!audio) return;

  const source=audio.createBufferSource();source.buffer=noiseBuffer;

  const filter=audio.createBiquadFilter();filter.type="highpass";filter.frequency.value=6500;

  const gain=audio.createGain();

  gain.gain.setValueAtTime(volume,when);

  gain.gain.exponentialRampToValueAtTime(.0001,when+.055);

  source.connect(filter);filter.connect(gain);gain.connect(master);

  const voice={node:source,group:"bgm"};voices.add(voice);

  source.onended=()=>{

    source.disconnect();filter.disconnect();gain.disconnect();voices.delete(voice);

  };

  source.start(when);source.stop(when+.08);

}

function sfx(hz,duration=.06,volume=.025){

  if(!soundOn||!unlockAudio()) return;

  const midi=69+12*Math.log2(hz/440);

  makeVoice(midi,duration,volume,"sine",audio.currentTime,"game");

}

function successSound(){

  if(!soundOn) return;

  [72,76,79,84].forEach((n,i)=>{

    if(unlockAudio()) bell(n,.5,.045,"game",audio.currentTime+i*.09);

  });

}

function stopGroup(group){

  voices.forEach(v=>{

    if(v.group===group){try{v.node.stop()}catch(e){}}

  });

}

function stopGameVoices(){stopGroup("game")}

/*

32개의 8분음표 = 4마디.

4마디마다 화음 진행과 장식을 바꿉니다.

멜로디에는 쉼표와 긴 음을 섞어 기계적인 반복을 줄였습니다.

*/

const melodyA=[

  76,76,76,null,76,76,76,null,

  76,79,72,74,76,null,null,null,

  77,77,77,77,77,76,76,76,

  76,74,74,76,74,null,79,null

];

const melodyB=[

  76,76,76,null,76,76,76,null,

  76,79,72,74,76,null,null,null,

  77,77,77,77,77,76,76,76,

  79,79,77,74,72,null,null,null

];

const chords=[

  [60,64,67],[60,64,67],[65,69,72],[55,59,62],

  [60,64,67],[57,60,64],[65,69,72],[55,59,62]

];

function scheduleBeat(index,time){

  if(state.phase==="puzzle"&&state.stage===4) return;

  const cycle=Math.floor(index/32);

  const step=index%32,bar=Math.floor(index/8);

  const chord=chords[(cycle%2)*4+bar];

  const melody=cycle%2===0?melodyA:melodyB;

  const fade=state.phase==="epilogue"?.75:1;

  // 主旋律：柔らかいベルと三角波

  const note=melody[step];

  if(note!==null){

    bell(note,.4,.035*fade,"bgm",time);

    makeVoice(note-12,.19,.008*fade,"triangle",time,"bgm");

  }

  // ベース：1拍目・3拍目

  if(step%8===0||step%8===4){

    const root=step%8===0?chord[0]-24:chord[2]-24;

    makeVoice(root,.35,.028*fade,"triangle",time,"bgm");

  }

  // 軽い和音：裏拍

  if(step%4===2){

    chord.forEach((n,i)=>{

      makeVoice(n,.16,.012*fade,"sine",time+i*.008,"bgm");

    });

  }

  // アルペジオ：周期ごとに変奏

  if(cycle%2===1&&step%2===1){

    const n=chord[(step+bar)%3]+12;

    makeVoice(n,.2,.012*fade,"sine",time,"bgm",true);

  }

  // 小さな鈴とシェイカー

  noise(time,step%2===0?.0045:.0025);

  if(step%8===7) bell(chord[2]+24,.2,.008*fade,"bgm",time);

  // 最終場面で少し華やかに

  if((state.stage===6||state.phase==="outro")&&step%8===0){

    bell(chord[0]+24,.65,.013,"bgm",time);

  }

}

function musicTick(){

  if(!audio||audio.state!=="running") return;

  if(nextBeatTime<audio.currentTime-.2) nextBeatTime=audio.currentTime+.04;

  while(nextBeatTime<audio.currentTime+.15){

    scheduleBeat(beatIndex++,nextBeatTime);

    nextBeatTime+=EIGHTH;

  }

}

function updateMusic(){

  clearInterval(bgmTimer);bgmTimer=null;

  stopGroup("bgm");

  $("music-toggle").textContent=musicOn?"♫ 음악 ON":"♫ 음악 OFF";

  $("music-toggle").setAttribute("aria-pressed",String(musicOn));

  if(musicOn&&!document.hidden&&unlockAudio()){

    nextBeatTime=audio.currentTime+.05;

    bgmTimer=setInterval(musicTick,30);musicTick();

  }

}

$("music-toggle").onclick=()=>{

  if(!unlockAudio()){

    modal("음악 안내","이 실행 환경에서는 오디오를 사용할 수 없어요.",()=>{});

    return;

  }

  musicOn=!musicOn;updateMusic();

};

$("sound-toggle").onclick=()=>{

  soundOn=!soundOn;unlockAudio();

  $("sound-toggle").textContent=soundOn?"효과음 ON":"효과음 OFF";

  $("sound-toggle").setAttribute("aria-pressed",String(soundOn));

};

document.addEventListener("visibilitychange",()=>{

  if(document.hidden){stopGroup("game");stopGroup("bgm")}

  updateMusic();

});

/* 시작 */

resumePoint=getSaved();

$("pass").disabled=true;

intro();

</script>

</body>

</html>
