<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1f5">
<title>해치 크리스마스 — 오래된 별의 자리</title>

<style>
@import url("https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap");

:root{
  --pink:#f472b6;
  --deep:#bd386f;
  --paper:#fffdf2;
  --ink:#63364c;
  --green:#268652;
  --dark-green:#17643d;
}
*{box-sizing:border-box}
body{
  margin:0;
  display:flex;
  justify-content:center;
  background:#fff1f5;
  color:var(--ink);
  font-family:"Courier New",monospace,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid #0284c7;
  outline-offset:3px;
}
[hidden]{display:none!important}

#app{
  width:min(100%,460px);
  height:100vh;
  height:min(100dvh,820px);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#fff1f5;
  box-shadow:0 0 30px #9d174d18;
}
.topbar{
  flex:none;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:6px 8px;
  background:#fff8f0;
  border-bottom:2px solid white;
  z-index:5;
}
.progress{
  padding:5px 9px;
  border:2px solid var(--dark-green);
  border-radius:14px;
  box-shadow:0 2px var(--dark-green);
  background:var(--green);
  color:white;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}
.tools{display:flex;gap:4px}
.tool{
  padding:5px 6px;
  border:2px solid #f9a8d4;
  border-radius:12px;
  background:white;
  color:var(--deep);
  font-size:10px;
  font-weight:bold;
}
#screen{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}
.debug{
  flex:none;
  display:flex;
  gap:5px;
  align-items:center;
  padding:5px 8px;
  border-top:1px dashed #ca8a04;
  background:#fef9c3;
}
.debug label,.debug select,.debug button{font-size:10px}
.debug select{flex:1;min-width:0;padding:4px}
.debug button{
  padding:5px;
  border:1px solid #ca8a04;
  border-radius:4px;
  background:white;
}

/* 인트로 */
.intro{
  position:absolute;
  inset:0;
  background:#ffe7ec;
  overflow:hidden;
}
.intro-plane{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}
.intro-image{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
}
.intro-title{
  position:absolute;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:0;
  color:white;
  text-align:center;
  line-height:1.23;
  font-family:"Gaegu",sans-serif;
  font-weight:bold;
  text-shadow:
    2px 2px #b91c66,
    -1px -1px #b91c66,
    0 3px #85184d;
  pointer-events:none;
}
.intro-title small{
  display:block;
  margin-top:.15em;
  font-size:.52em;
}
.intro-start{
  position:absolute;
  padding:0;
  border:0;
  background:transparent;
  color:transparent;
  appearance:none;
}
.intro-fallback{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
  background:linear-gradient(#ffe4e6,#fff7ed);
}
.intro-fallback span{font-size:95px}
.intro-fallback small{font-size:13px}
.intro-fallback-button{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid white;
  border-radius:18px;
  background:#ef526f;
  color:white;
  font-weight:bold;
  pointer-events:none;
}

/* 전체 배경 */
.scene{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:linear-gradient(#ffe4e9,#fff1da);
}
.background{
  position:absolute;
  inset:0;
}
.background img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
.background-fallback{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:60px 20px 150px;
  background:
    radial-gradient(circle at 20% 20%,#fff9,transparent 50%),
    linear-gradient(#ffe4e9,#fff0d7);
  text-align:center;
}
.background-fallback span{font-size:90px}
.background-fallback small{
  padding:8px 12px;
  border:2px solid white;
  border-radius:14px;
  background:#fff9;
  font-size:12px;
}
.chapter{
  position:absolute;
  z-index:4;
  top:15px;
  left:14px;
  max-width:calc(100% - 28px);
  margin:0;
  padding:7px 12px;
  border:3px solid white;
  outline:1.5px solid #d875a0;
  border-radius:5px 15px 6px 14px;
  box-shadow:2px 4px #8f456526;
  background:#fffaf0ed;
  color:#a23d69;
  font-family:"Gaegu",sans-serif;
  font-size:21px;
  line-height:1.3;
  transform:rotate(-2deg);
}
.chapter::before{
  content:"✦";
  margin-right:7px;
  color:#e6ab36;
}

/* 分離した別画像 */
.scene-star{
  position:absolute;
  z-index:2;
  width:23%;
  height:26%;
  object-fit:contain;
  pointer-events:none;
  filter:drop-shadow(0 3px 2px #9d174d22);
}
.scene-star.sleeping{
  left:59%;
  top:49%;
  transform:rotate(8deg);
}
.scene-star.hanging{
  left:55%;
  top:29%;
}
.scene-star.rising{
  left:62%;
  top:23%;
  animation:star-drift 3s ease-in-out infinite;
}
.scene-star.epilogue{
  left:61%;
  top:14%;
  width:24%;
  animation:star-drift 3s ease-in-out infinite;
}

/* 紙の会話窓 */
.dialogue{
  position:absolute;
  z-index:8;
  left:12px;
  right:12px;
  bottom:16px;
  height:122px;
  border:3px solid white;
  outline:1.5px solid #d7c8b8;
  border-radius:7px 12px 7px 12px;
  background-color:var(--paper);
  background-image:
    linear-gradient(#d9cfb633 1px,transparent 1px),
    linear-gradient(90deg,#d9cfb633 1px,transparent 1px);
  background-size:18px 18px;
  box-shadow:0 7px 15px #62344622;
  animation:dialog-in .25s ease-out both;
}
.dialogue::before{
  content:"";
  position:absolute;
  top:-8px;
  left:92px;
  right:15px;
  height:14px;
  background:
    radial-gradient(circle at 8px 7px,#d3bd8d 0 4px,transparent 4.6px)
    0 0/27px 14px repeat-x;
  pointer-events:none;
}
.portrait{
  position:absolute;
  left:-8px;
  bottom:21px;
  width:100px;
  height:132px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  pointer-events:none;
}
.portrait::before{
  content:"";
  position:absolute;
  left:9px;
  bottom:7px;
  width:77px;
  height:81px;
  border:4px solid white;
  border-radius:16px 9px 18px 8px;
  background:#f8d8e7;
  transform:rotate(-9deg);
  box-shadow:2px 4px #88536a22;
}
.portrait span{
  position:relative;
  font-size:55px;
  padding-bottom:15px;
}
.portrait img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
  filter:drop-shadow(0 3px 1px #693c4c22);
}
.copy{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:9px 11px 6px 92px;
}
.sender{
  flex:none;
  align-self:flex-start;
  padding:1px 7px;
  border-radius:8px;
  background:#fce7f3;
  color:#b03569;
  font-size:12px;
  font-weight:bold;
}
.message{
  flex:1;
  min-height:0;
  overflow:auto;
  white-space:pre-wrap;
  word-break:keep-all;
  font-size:15px;
  line-height:1.55;
  color:var(--ink);
}
.next{
  flex:none;
  align-self:flex-end;
  min-height:24px;
  padding:0 4px;
  border:0;
  background:transparent;
  color:#a83d6b;
  font-size:12px;
  font-weight:bold;
}
.next::after{
  content:"›";
  display:inline-block;
  margin-left:7px;
  font-size:25px;
  line-height:1;
  vertical-align:middle;
  animation:arrow-right .85s ease-in-out infinite;
}
.dialogue.narration{height:100px}
.dialogue.narration .portrait,
.dialogue.narration .sender{display:none}
.dialogue.narration .copy{padding:12px 15px 7px}
.dialogue.narration .message{color:#7b8290;font-style:italic}
.dialogue.narration::before{left:16px}

/* 案内 */
.route-note{
  position:absolute;
  z-index:3;
  top:76px;
  left:16px;
  right:16px;
  padding:11px 13px;
  border:3px solid white;
  border-radius:5px 13px 7px 12px;
  background:#fffdf2ed;
  box-shadow:2px 4px #7443541a;
  color:#785865;
  font-size:12px;
  line-height:1.7;
  transform:rotate(1deg);
}
.route-note strong{color:#bb4679}

/* ボタン */
.primary{
  width:100%;
  min-height:43px;
  padding:9px 12px;
  border:3px solid white;
  outline:2px solid #b91c4d;
  border-radius:17px;
  box-shadow:0 4px #9f164a;
  background:linear-gradient(#ff7d87,#ed4059);
  color:white;
  font-size:14px;
  font-weight:bold;
  transition:transform .12s,filter .12s;
}
.primary:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:0 1px #9f164a;
}
.primary.green{
  background:linear-gradient(#56bb7f,#268652);
  outline-color:#17643d;
  box-shadow:0 4px #17643d;
}
.round{
  padding:7px 10px;
  min-height:34px;
  border:2px solid #f9a8d4;
  border-radius:13px;
  background:white;
  color:var(--deep);
  font-size:11px;
  font-weight:bold;
}

/* 準備メモ */
.memo-screen{
  position:absolute;
  inset:0;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:27px;
  background:
    linear-gradient(#d4c7a52b 1px,transparent 1px),
    linear-gradient(90deg,#d4c7a52b 1px,transparent 1px),
    #fff7e7;
  background-size:25px 25px;
}
.memo-screen::before{
  content:"☆";
  position:absolute;
  left:4%;
  top:7%;
  color:#edc272;
  font-size:70px;
  transform:rotate(-15deg);
}
.memo{
  position:relative;
  width:100%;
  padding:28px 20px 22px;
  border:3px solid white;
  border-radius:3px 12px 4px 9px;
  background:
    repeating-linear-gradient(transparent 0 31px,#d3c5aa44 32px,transparent 33px),
    var(--paper);
  box-shadow:5px 10px #dca4b326,0 15px 30px #79525c18;
  transform:rotate(-3deg);
  animation:memo-in .5s ease-out both;
}
.memo::before,.memo::after{
  content:"";
  position:absolute;
  top:-13px;
  width:72px;
  height:25px;
  background:#f4d5b4bb;
  border:1px solid #ffffff77;
}
.memo::before{left:13px;transform:rotate(-12deg)}
.memo::after{right:10px;transform:rotate(14deg)}
.memo h1{
  margin:0 0 17px;
  color:#b74676;
  font-family:"Gaegu",sans-serif;
  font-size:28px;
}
.memo ul{
  margin:0;
  padding:0;
  list-style:none;
  color:#795264;
  font-family:"Gaegu",sans-serif;
  font-size:23px;
  line-height:1.8;
}
.memo .scribble{
  margin:17px 0;
  color:#df7d9c;
  font-family:"Gaegu",sans-serif;
  font-size:22px;
}
.difficulty-title{
  margin:13px 0;
  color:#a54a72;
  text-align:center;
  font-family:"Gaegu",sans-serif;
  font-size:23px;
}
.difficulty-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.difficulty{
  min-height:84px;
  padding:12px 7px;
  border:3px solid white;
  outline:2px solid #ce769d;
  border-radius:18px 8px 17px 9px;
  box-shadow:0 5px #c569963d;
  background:linear-gradient(#ffd6e6,#f7adcb);
  color:#9b355f;
  transform:rotate(-2deg);
}
.difficulty.adult{
  outline-color:#7cae94;
  background:linear-gradient(#def4df,#b8dfc4);
  box-shadow:0 5px #538a6840;
  color:#396f50;
  transform:rotate(2deg);
}
.difficulty strong{
  display:block;
  font-family:"Gaegu",sans-serif;
  font-size:26px;
}
.difficulty span{font-size:10px}

/* 移動演出 */
.transition{
  position:absolute;
  inset:0;
  z-index:30;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  background:#e6f5fa;
}
.transition::before,.transition::after{
  content:"";
  position:absolute;
  left:-30%;
  width:160%;
  height:50%;
  border-radius:50%;
  background:white;
  transform:rotate(-23deg);
}
.transition::before{top:-18%;animation:cloud-a 2s ease-in-out both}
.transition::after{bottom:-18%;background:#fff9;animation:cloud-b 2s ease-in-out both}
.transition-label{
  position:relative;
  z-index:2;
  color:#8cab75;
  font-size:12px;
}
.transition h1{
  position:relative;
  z-index:2;
  margin:0 22px;
  padding:13px 22px;
  border:3px solid white;
  outline:2px solid #b8c892;
  border-radius:28% 18% 24% 14%;
  background:#e7edc9;
  color:#775367;
  font-family:"Gaegu",sans-serif;
  font-size:29px;
  text-align:center;
  line-height:1.4;
}
.travel{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  gap:15px;
  animation:travel 1.8s ease-in-out both;
}
.travel-character{
  position:relative;
  width:116px;
  height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:step .42s ease-in-out infinite;
}
.travel-character span{font-size:65px}
.travel-character img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
}
.travel-star{
  width:68px;
  height:90px;
  object-fit:contain;
  animation:star-drift .8s ease-in-out infinite;
}
.skip{
  position:absolute;
  z-index:3;
  bottom:20px;
  right:15px;
  padding:7px 12px;
  border:2px solid white;
  border-radius:18px;
  background:#fff9;
  color:#8c7583;
  font-size:11px;
}

/* パズル */
.play-area{
  position:absolute;
  z-index:3;
  inset:76px 13px 146px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:11px;
}
.play-dock{
  position:absolute;
  z-index:10;
  left:11px;
  right:11px;
  bottom:11px;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.status{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  margin:0;
  padding:7px 10px;
  border:2px solid white;
  border-radius:14px;
  background:#fffdf2f0;
  color:#a54974;
  text-align:center;
  font-size:12px;
  line-height:1.5;
}
.action-row{display:flex;gap:8px}
.utility-row{display:flex;gap:6px}
.hint-text{
  margin:0;
  padding:8px;
  border:2px solid #fcd34d;
  border-radius:12px;
  background:#fffef4;
  font-size:11px;
  line-height:1.6;
}
.clue{
  flex:none;
  width:96%;
  padding:8px 11px;
  border:3px solid white;
  outline:1px solid #e8bd86;
  border-radius:5px 12px 5px 11px;
  background:#fffdf1;
  color:#925366;
  text-align:center;
  font-size:12px;
  line-height:1.6;
  transform:rotate(-2deg);
}
.small-guide{
  margin:0;
  padding:4px 8px;
  border-radius:8px;
  background:#fff9;
  text-align:center;
  font-size:10px;
}

/* 入体錠 */
.storage-lock{
  position:relative;
  isolation:isolate;
  flex:none;
  width:min(100%,350px);
  padding-top:85px;
  filter:drop-shadow(0 9px #85436622);
}
.shackle{
  position:absolute;
  z-index:-1;
  top:0;
  left:24%;
  width:52%;
  height:130px;
  border:18px solid #f5df9c;
  border-bottom-width:12px;
  outline:3px solid #aa753c;
  border-radius:90px 90px 14px 14px;
  box-shadow:inset 0 0 0 3px #fff9d7,0 0 0 3px white;
  transform-origin:18% 85%;
  transition:transform .65s,top .65s;
}
.storage-body{
  position:relative;
  z-index:2;
  padding:13px 10px 12px;
  border:4px solid white;
  outline:3px solid #b25a83;
  border-radius:25px 25px 19px 19px;
  background:linear-gradient(135deg,#ffd8e6,#ed9abe);
  box-shadow:inset 0 4px #fff5,inset 0 -9px #b6608c22,0 7px #b56c8a55;
}
.storage-label{
  width:max-content;
  margin:0 auto 10px;
  padding:3px 11px;
  border:2px solid white;
  outline:1px solid #d2a56c;
  border-radius:12px;
  background:#fff4d8;
  color:#976039;
  text-align:center;
  font-size:11px;
}
.dials{display:flex;justify-content:center;gap:5px;width:100%}
.dial{flex:1;max-width:65px;min-width:0;text-align:center}
.storage-lock .dial{max-width:49px}
.dial button{
  width:100%;
  min-height:23px;
  padding:1px;
  border:1px solid white;
  border-radius:6px;
  background:#fff8;
  color:#a04671;
  font-size:11px;
}
.drum{
  height:75px;
  margin:4px 0;
  overflow:hidden;
  border:2px solid #a96385;
  border-radius:8px;
  background:linear-gradient(#d5bdc9,#faf5f7 24%,white 42%,white 59%,#faf5f7 76%,#d5bdc9);
  box-shadow:inset 0 3px 5px #75435a33,0 2px #fff7;
  color:#9d3766;
  touch-action:none;
  user-select:none;
}
.drum .adjacent{height:18px;line-height:18px;font-size:11px;opacity:.45}
.drum .value{height:35px;line-height:35px;font-size:23px;font-weight:bold}
.drum.moving{filter:brightness(1.1)}
.keyhole{
  position:relative;
  width:14px;
  height:14px;
  margin:12px auto 5px;
  border-radius:50%;
  background:#b7678d;
}
.keyhole::after{
  content:"";
  position:absolute;
  top:8px;
  left:4px;
  width:6px;
  height:11px;
  border-radius:0 0 3px 3px;
  background:#b7678d;
}
.storage-lock.open .shackle{top:-15px;transform:rotate(-23deg)}
.storage-lock.open .storage-body{background:linear-gradient(#fff2bd,#f4cb73)}

/* 糸通し */
.thread-board{
  position:relative;
  width:min(100%,300px);
  aspect-ratio:1;
  touch-action:none;
  filter:drop-shadow(0 5px 3px #7b3b5c22);
}
.thread-board>img,
.thread-board>svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}
.hole{
  position:absolute;
  width:46px;
  height:46px;
  transform:translate(-50%,-50%);
  border:3px solid #b77b35;
  outline:3px solid white;
  border-radius:50%;
  box-shadow:0 3px #b77b3533;
  background:#fff9e3;
  color:#a16a22;
  font-size:21px;
  touch-action:none;
}
.hole.done{background:#fff0a7;box-shadow:0 0 20px #fde047}

/* 記憶レンズ */
.city-board{
  position:relative;
  flex:1;
  width:100%;
  min-height:180px;
  max-height:300px;
  overflow:hidden;
  border:5px solid white;
  outline:2px solid #6aaed6;
  border-radius:24px 9px 24px 9px;
  background:#dbeafe;
}
.city-svg{position:absolute;inset:0;width:100%;height:100%}
.lens{
  position:absolute;
  width:112px;
  height:112px;
  border:7px solid #f277a1;
  outline:3px solid white;
  border-radius:50%;
  box-shadow:4px 6px #9d174d33;
  background:#fff8;
  touch-action:none;
}
.lens::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-37px;
  width:17px;
  height:53px;
  border:3px solid white;
  border-radius:9px;
  background:#f277a1;
  transform:rotate(-36deg);
}
.lens svg{width:100%;height:100%;border-radius:50%;overflow:hidden}
.lens.matched{border-color:#eab308;box-shadow:0 0 25px #fde047}
.range-row{
  display:flex;
  align-items:center;
  gap:7px;
  width:100%;
  padding:8px;
  border:2px solid white;
  border-radius:13px;
  background:#fff9;
  font-size:11px;
}
.range-row input{flex:1;min-width:0;accent-color:#e879a6}

/* 本 */
.book{
  position:relative;
  flex:none;
  width:95%;
  height:115px;
  overflow:hidden;
  border:4px solid white;
  outline:3px solid #b86c78;
  border-radius:15px 6px 6px 15px;
  box-shadow:0 7px #e4b5ab;
  background:#fff8dc;
  transform:rotate(-2deg);
}
.book-inside{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px;
  text-align:center;
  font-size:13px;
  line-height:1.8;
}
.scratch{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}
.book-lock{
  width:100%;
  padding:12px;
  border:4px solid white;
  outline:2px solid #b75d84;
  border-radius:20px;
  box-shadow:0 8px #b75d8444;
  background:#f7b4d0;
}

/* 楽器 */
.layers{display:flex;justify-content:center;gap:12px;font-size:25px}
.layers span{
  padding:5px;
  border:2px solid white;
  border-radius:50%;
  background:white;
  opacity:.25;
}
.layers span.on{opacity:1;box-shadow:0 0 15px #fde68a}
.instrument{
  width:100%;
  padding:20px 10px;
  border:5px solid white;
  outline:3px solid #ba4a76;
  border-radius:30px 30px 20px 20px;
  box-shadow:0 10px #b96c8b66;
  background:#f89ebc;
  transform:rotate(-2deg);
}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.key{
  position:relative;
  height:130px;
  padding-top:50px;
  border:3px solid #b46184;
  border-radius:10px;
  box-shadow:0 5px #c77699;
  background:linear-gradient(white,#fff0df);
  color:#8f345d;
  font-size:20px;
  font-weight:bold;
}
.key:nth-child(2){height:119px;background:linear-gradient(#fff9c6,#ffed99)}
.key:nth-child(3){height:108px;background:linear-gradient(#d8f6e8,#a9e0ca)}
.key:nth-child(4){height:97px;background:linear-gradient(#ddecff,#b3d1f9)}
.key::before{
  content:"";
  position:absolute;
  left:50%;
  top:16px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#b46184;
  transform:translateX(-50%);
}
.key.active{transform:translateY(5px);box-shadow:none;filter:brightness(1.13)}
.key.active::after{
  content:"♪";
  position:absolute;
  top:-35px;
  left:30%;
  color:#e54a88;
  animation:float-note .5s both;
}

/* 願い */
.memory{
  position:relative;
  flex:1;
  width:100%;
  min-height:210px;
  max-height:330px;
  overflow:hidden;
  border:5px solid white;
  outline:2px solid #79b399;
  border-radius:25px 9px 25px 9px;
  background:linear-gradient(#bce6d3,#fff6da);
}
.memory-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:14px;
}
.wish{
  padding:9px 12px;
  max-width:96%;
  border:2px solid white;
  outline:1px solid #efacb9;
  border-radius:3px;
  box-shadow:2px 4px #17643d22;
  background:#fff9ed;
  font-size:12px;
  line-height:1.6;
  transform:rotate(-5deg);
}
.wish:nth-child(2){transform:rotate(5deg);background:#ffe7ef}
.wish:nth-child(3){transform:rotate(-2deg);background:#fff3b6}
.memory-caption{
  position:absolute;
  left:5px;
  right:5px;
  bottom:5px;
  padding:9px;
  border:2px solid white;
  border-radius:10px;
  background:#fffde9;
  text-align:center;
  font-size:12px;
  line-height:1.6;
}

/* 回路 */
.circuit-wrap{
  width:min(95%,290px);
  padding:12px;
  border:5px solid white;
  outline:2px solid #b7648a;
  border-radius:24px;
  box-shadow:0 8px #b7648a44;
  background:#f8d1df;
}
.circuit{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pipe{
  aspect-ratio:1;
  min-width:0;
  padding:5px;
  border:2px solid #c597b0;
  border-radius:12px;
  box-shadow:0 3px #c597b0;
  background:linear-gradient(white,#f6e9f0);
}
.pipe svg{width:100%;height:100%;display:block}
.pipe.lit{background:#fff5b8;border-color:#d6ac33;box-shadow:0 0 14px #facc1588}
.circuit-label{
  padding:5px 10px;
  border:2px solid white;
  border-radius:12px;
  background:#fff9;
  color:#a8631b;
  font-size:11px;
}
.final-light{
  position:absolute;
  inset:0;
  z-index:25;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff6dcb0;
  pointer-events:none;
}
.final-light img{
  width:180px;
  height:220px;
  object-fit:contain;
  animation:ascend 1.8s ease-in forwards;
}

/* ノート・モーダル */
.overlay{
  position:absolute;
  inset:0;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:#67445a88;
  backdrop-filter:blur(3px);
}
.paper-panel{
  width:100%;
  max-height:90%;
  overflow:auto;
  padding:20px 16px;
  border:4px solid white;
  outline:2px solid #d875a0;
  border-radius:6px 17px 6px 15px;
  box-shadow:0 9px #b65e8533;
  background:
    linear-gradient(#d9cfb633 1px,transparent 1px),
    linear-gradient(90deg,#d9cfb633 1px,transparent 1px),
    var(--paper);
  background-size:20px 20px;
}
.paper-panel h1,.paper-panel h2{
  margin:0 0 12px;
  color:#b24576;
  font-family:"Gaegu",sans-serif;
  font-size:28px;
}
.paper-panel>p{
  font-size:13px;
  line-height:1.8;
  white-space:pre-wrap;
}
.memory-item{
  margin-bottom:12px;
  padding:11px 12px;
  border:2px solid white;
  outline:1px solid #e7bfce;
  border-radius:4px 11px 5px 9px;
  background:#fff5f8;
  transform:rotate(-1deg);
}
.memory-item:nth-child(even){background:#f2f7e7;transform:rotate(1deg)}
.memory-item strong{
  display:block;
  margin-bottom:5px;
  color:#a24771;
  font-family:"Gaegu",sans-serif;
  font-size:20px;
}
.memory-item p{margin:0;font-size:12px;line-height:1.7}
.memory-item.locked{opacity:.45;background:#eeeae4}
.toast{
  position:absolute;
  z-index:15;
  top:16px;
  left:50%;
  width:max-content;
  max-width:90%;
  transform:translateX(-50%);
  padding:9px 13px;
  border:3px solid white;
  border-radius:18px;
  background:#fffde8;
  color:#aa7b32;
  text-align:center;
  font-size:11px;
}
.outro-panel{
  position:absolute;
  z-index:4;
  left:12px;
  right:12px;
  bottom:17px;
  padding:18px;
  border:4px solid white;
  outline:2px solid #e879a6;
  border-radius:22px;
  background:#fff1f5ed;
  text-align:center;
}
.outro-panel h1{color:var(--deep);font-family:"Gaegu",sans-serif;font-size:28px}
.outro-panel p{font-size:13px;line-height:1.8}
.outro-panel small{display:block;font-size:10px;margin-bottom:15px}
.particle{
  position:absolute;
  z-index:60;
  color:#f59e0b;
  font-size:22px;
  pointer-events:none;
  animation:particle .9s ease-out forwards;
}
@keyframes dialog-in{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes arrow-right{50%{transform:translateX(4px)}}
@keyframes memo-in{from{opacity:0;transform:translateY(40px) rotate(-7deg)}to{opacity:1;transform:rotate(-3deg)}}
@keyframes cloud-a{from{transform:translateX(-15%) rotate(-23deg)}to{transform:translateX(15%) rotate(-23deg)}}
@keyframes cloud-b{from{transform:translateX(15%) rotate(-23deg)}to{transform:translateX(-15%) rotate(-23deg)}}
@keyframes travel{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes step{50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes star-drift{50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes float-note{to{transform:translateY(-25px);opacity:0}}
@keyframes ascend{20%{transform:scale(1.2)}to{transform:translateY(-260px) scale(.3);opacity:0}}
@keyframes particle{to{transform:translate(var(--dx),var(--dy)) rotate(110deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .23s}
@media(max-height:650px){
  .dialogue{height:112px;bottom:11px}
  .dialogue.narration{height:92px}
  .portrait{width:91px;height:118px;bottom:23px}
  .copy{padding-left:83px}
  .play-area{inset:66px 10px 135px;gap:8px}
  .chapter{top:10px;font-size:18px}

  .storage-body{padding:9px 8px}
  .drum{height:64px}
  .drum .adjacent{height:15px;line-height:15px}
  .drum .value{height:30px;line-height:30px;font-size:21px}
  .thread-board{width:min(78%,230px)}
  .book{height:84px}
  .book-inside{font-size:11px}
  .book-lock{padding:8px}
  .key{height:100px}
  .key:nth-child(2){height:92px}
  .key:nth-child(3){height:84px}
  .key:nth-child(4){height:76px}
  .circuit-wrap{width:min(78%,230px);padding:8px}
  .memo{padding:22px 16px 17px}
  .memo h1{font-size:25px}
  .memo ul{font-size:21px}
  .memo .scribble{font-size:20px;margin:12px 0}
}
@media(max-width:360px){
  .message{font-size:14px}
  .tool{font-size:9px;padding:5px}
  .storage-lock .dials{gap:3px}
  .storage-lock .value{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
}

let state={phase:"intro",stage:0,difficulty:"child",earned:[]};
let resumePoint=null;
let version=0;
let timers=[];
let cleanups=[];
let typingTimer=null;
let finishTyping=null;
let locked=false;
let transitioning=false;
let modalCallback=null;
let modalCancelCallback=null;
let overlayFocus=null;
let saveAllowed=true;

function later(fn,ms){
  const current=version;
  const id=setTimeout(()=>{if(current===version) fn()},ms);
  timers.push(id);
  return id;
}
function cleanup(){
  clearInterval(typingTimer);
  typingTimer=null;
  finishTyping=null;
  timers.forEach(clearTimeout);
  timers=[];
  cleanups.forEach(fn=>fn());
  cleanups=[];
  version++;
  stopGroup("game");
  $("screen").replaceChildren();
}
function save(){
  if(!saveAllowed) return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
  catch(e){saveAllowed=false}
}
function readSave(){
  try{
    const data=JSON.parse(localStorage.getItem(SAVE_KEY));
    const phases=["guide","arrival","puzzle","after","epilogue","outro"];
    if(data&&phases.includes(data.phase)&&
      Number.isInteger(data.stage)&&data.stage>=0&&data.stage<7){
      return {
        phase:data.phase,
        stage:data.stage,
        difficulty:data.difficulty==="adult"?"adult":"child",
        earned:Array.isArray(data.earned)?
          data.earned.filter(n=>Number.isInteger(n)&&n>=0&&n<7):[]
      };
    }
  }catch(e){}
  return null;
}
function updateChrome(){
  const cover=["intro","memo"].includes(state.phase);
  $("topbar").hidden=cover;
  $("debug").hidden=cover||!TEST_MODE;
  $("debug").inert=transitioning;
  $("progress").textContent=
    state.phase==="epilogue"?"에필로그":
    state.phase==="outro"?"탐험 완료!":`미션 ${state.stage+1}/7`;
  $("notebook-button").textContent=`▤ ${state.earned.length}/7`;
  $("jump").value=state.stage;
  $("pass").disabled=transitioning||
    !["guide","arrival","puzzle"].includes(state.phase);
  $("app").dataset.difficulty=state.difficulty;
}
function go(phase,stage=state.stage){
  cleanup();
  transitioning=false;
  locked=false;
  state.phase=phase;
  state.stage=stage;

  if(phase==="after"&&!state.earned.includes(stage)){
    state.earned.push(stage);
    state.earned.sort((a,b)=>a-b);
  }
  if(!["intro","memo"].includes(phase)) save();
  updateChrome();

  if(phase==="intro") renderIntro();
  if(phase==="memo") renderMemo();
  if(phase==="guide") renderGuide();
  if(phase==="arrival"){
    renderDialogue(ARRIVAL[stage],TITLES[stage],()=>go("puzzle"));
  }
  if(phase==="puzzle") renderPuzzle();
  if(phase==="after"){
    renderDialogue(AFTER[stage],"무슨 일이 생겼지?",()=>{
      stage===6?go("epilogue"):go("guide",stage+1);
    });
    toast(`✦ 기억 노트 · ${MEMORY_NAMES[stage]}`);
  }
  if(phase==="epilogue"){
    renderDialogue(EPILOGUE,"아직 읽을 이야기가 많아!",()=>go("outro"),"image_08.png");
  }
  if(phase==="outro") renderOutro();

  stopGroup("bgm");
}
function newGame(){
  resumePoint=null;
  state={phase:"intro",stage:0,difficulty:"child",earned:[]};
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
  go("memo");
}
function imageFile(stage=state.stage){
  return `image_${String(stage+1).padStart(2,"0")}.png`;
}
function background(file,label,fallbackFile=""){
  return `<div class="background">
    <div class="background-fallback">
      <span>${["📦","🎄","🌆","📚","🎵","🌳","🌟"][state.stage]}</span>
      <small>${esc(label)}</small>
    </div>
    <img src="${esc(file)}" alt="${esc(label)}"
      ${fallbackFile
        ? `onerror="this.onerror=function(){this.hidden=true};this.src='${esc(fallbackFile)}'"`
        : `onerror="this.hidden=true"`}>
  </div>`;
}
function starMarkup(file,className){
  return `<img class="scene-star ${className}" src="${file}"
    alt="별 장식" onerror="this.hidden=true">`;
}
function storyStar(){
  if(state.phase==="epilogue") return starMarkup(STAR.light,"epilogue");
  if(state.stage===0&&state.phase==="after") return starMarkup(STAR.sleep,"sleeping");
  if(state.stage===1){
    return starMarkup(state.phase==="after"?STAR.awake:STAR.sleep,"hanging");
  }
  if(state.stage===6){
    return starMarkup(state.phase==="after"?STAR.light:STAR.awake,
      state.phase==="after"?"rising":"hanging");
  }
  return "";
}

function renderIntro(){
  $("screen").innerHTML=`
    <section class="intro" id="intro-root">
      <div class="intro-plane" id="intro-plane">
        <div class="intro-fallback" id="intro-fallback" hidden>
          <span>🎄⭐</span><small>intro.gif를 같은 폴더에 넣어주세요.</small>
        </div>
        <img id="intro-image" class="intro-image"
             src="${INTRO.file}" alt="해치 크리스마스 인트로">
        <h1 id="intro-title" class="intro-title">
          해치 크리스마스<small>오래된 별의 자리</small>
        </h1>
        <div id="intro-fallback-button" class="intro-fallback-button" hidden>시작하기</div>
        <button id="intro-start" class="intro-start" aria-label="탐험 시작하기"></button>
      </div>
    </section>`;

  let width=INTRO.fallbackWidth;
  let height=INTRO.fallbackHeight;
  let missing=false;

  function place(element,rect,scale){
    Object.assign(element.style,{
      left:rect.x*scale+"px",top:rect.y*scale+"px",
      width:rect.w*scale+"px",height:rect.h*scale+"px"
    });
  }
  function layout(){
    const scale=Math.min(
      $("intro-root").clientWidth/width,
      $("intro-root").clientHeight/height
    );
    $("intro-plane").style.width=width*scale+"px";
    $("intro-plane").style.height=height*scale+"px";
    place($("intro-title"),INTRO.title,scale);
    place($("intro-start"),INTRO.start,scale);
    place($("intro-fallback-button"),INTRO.start,scale);
    $("intro-title").style.fontSize=52*scale+"px";
    $("intro-fallback-button").style.fontSize=31*scale+"px";
    $("intro-fallback-button").hidden=!missing;
  }

  const image=$("intro-image");
  image.onload=()=>{
    width=image.naturalWidth;height=image.naturalHeight;
    missing=false;layout();
  };
  image.onerror=()=>{
    missing=true;image.hidden=true;
    $("intro-fallback").hidden=false;layout();
  };
  const observer=new ResizeObserver(layout);
  observer.observe($("intro-root"));
  cleanups.push(()=>observer.disconnect());
  if(image.complete&&image.naturalWidth){
    width=image.naturalWidth;height=image.naturalHeight;
  }
  layout();

  $("intro-start").onclick=()=>{
    unlockAudio();
    if(resumePoint){
      openModal("이어서 탐험할까요?","이전에 진행한 미션이 남아 있어요.",()=>{
        state={...resumePoint,earned:[...resumePoint.earned]};
        resumePoint=null;go(state.phase,state.stage);
      },"이어서 하기","⭐",newGame,"처음부터 시작");
    }else newGame();
  };
}

/* 관성 다이얼: 1번과 4번에서 공유 */
function mountDials(container,letters,initial){
  const values=[...initial];
  const controls=[];

  values.forEach((_,index)=>{
    const col=document.createElement("div");
    col.className="dial";
    col.innerHTML=`
      <button aria-label="${index+1}번째 다이얼 이전">▲</button>
      <div class="drum" tabindex="0" role="spinbutton"
           aria-label="${index+1}번째 글자"
           aria-valuemin="0" aria-valuemax="${letters.length-1}">
        <div class="adjacent"></div>
        <div class="value"></div>
        <div class="adjacent"></div>
      </div>
      <button aria-label="${index+1}번째 다이얼 다음">▼</button>`;
    container.append(col);
    const drum=col.querySelector(".drum");
    let token=0,dragging=false,lastY=0,lastTime=0,velocity=0,carry=0;

    function render(){
      const v=values[index],n=letters.length;
      drum.children[0].textContent=letters[(v-1+n)%n];
      drum.children[1].textContent=letters[v];
      drum.children[2].textContent=letters[(v+1)%n];
      drum.setAttribute("aria-valuenow",v);
      drum.setAttribute("aria-valuetext",letters[v]);
    }
    function stop(){
      token++;dragging=false;drum.classList.remove("moving");
    }
    function step(delta){
      if(locked) return;
      values[index]=(values[index]+delta+letters.length)%letters.length;
      render();sfx(310,.025,.01);
    }
    function coast(speed,t){
      if(Math.abs(speed)<.14||t!==token||locked){
        drum.classList.remove("moving");return;
      }
      step(speed>0?1:-1);
      later(()=>coast(speed*.62,t),75);
    }

    col.children[0].onclick=()=>{stop();step(-1)};
    col.children[2].onclick=()=>{stop();step(1)};
    drum.onpointerdown=e=>{
      if(locked) return;
      token++;dragging=true;lastY=e.clientY;lastTime=performance.now();
      velocity=0;carry=0;drum.setPointerCapture(e.pointerId);
      drum.classList.add("moving");
    };
    drum.onpointermove=e=>{
      if(!dragging||locked) return;
      const now=performance.now(),dy=lastY-e.clientY;
      velocity=dy/Math.max(now-lastTime,1);carry+=dy;
      while(Math.abs(carry)>=22){
        const d=carry>0?1:-1;step(d);carry-=d*22;
      }
      lastY=e.clientY;lastTime=now;
    };
    drum.onpointerup=()=>{
      if(!dragging) return;
      dragging=false;
      if(performance.now()-lastTime>100) velocity=0;
      coast(clamp(velocity,-2.3,2.3),token);
    };
    drum.onpointercancel=stop;
    drum.onkeydown=e=>{
      if(!["ArrowUp","ArrowDown"].includes(e.key)) return;
      e.preventDefault();stop();step(e.key==="ArrowUp"?1:-1);
    };
    drum.addEventListener("wheel",e=>{
      e.preventDefault();stop();step(e.deltaY>0?1:-1);
    },{passive:false});

    controls.push({stop,render});
    cleanups.push(stop);render();
  });

  return {
    word:()=>values.map(v=>letters[v]).join(""),
    stop:()=>controls.forEach(c=>c.stop()),
    reset:()=>{
      controls.forEach(c=>c.stop());
      initial.forEach((v,i)=>values[i]=v);
      controls.forEach(c=>c.render());
    }
  };
}

/* 2. 끈 꿰기 */
function threadPuzzle(){
  const points=[
    {x:22,y:24,icon:"☀"},
    {x:78,y:24,icon:"☾"},
    {x:22,y:77,icon:"★"},
    {x:78,y:77,icon:"♥"}
  ];
  const target=[0,3,1,2];
  let input=[],dragging=false,cursor=null,tap=false;

  $("play-area").innerHTML=`
    <div class="clue">☀ → ♥ → ☾ → ★</div>

      <img src="${STAR.sleep}" alt="끈을 달아줄 잠든 별" onerror="this.hidden=true">
      <svg viewBox="0 0 100 100">
        <polyline id="fixed-thread" fill="none" stroke="#ed4d78"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line id="live-thread" stroke="#f472b6"
          stroke-width="1.8" stroke-dasharray="3 2"/>
      </svg>
    </div>`;
  const board=$("thread-board");

  function draw(){
    $("fixed-thread").setAttribute("points",
      input.map(i=>`${points[i].x},${points[i].y}`).join(" "));
    const p=points[input.at(-1)];
    const l=$("live-thread");
    l.setAttribute("x1",p?.x??0);l.setAttribute("y1",p?.y??0);
    l.setAttribute("x2",cursor?.x??p?.x??0);l.setAttribute("y2",cursor?.y??p?.y??0);
    board.querySelectorAll(".hole").forEach((b,i)=>b.classList.toggle("done",input.includes(i)));
  }
  function reset(text="해에서 끈을 잡고 출발해 주세요."){
    input=[];dragging=false;cursor=null;draw();status(text);
  }
  function take(index){
    if(input.includes(index)) return;
    if(target[input.length]!==index){
      reset("끈이 꼬였어! 해에서 다시 출발!");return;
    }
    input.push(index);draw();
    sfx(450+input.length*100,.08,.02);
    status(`끈 꿰기 ${input.length}/4`);
    if(tap&&input.length===4) win("새 끈 완성! 별을 트리에 걸어보자.");
  }
  points.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="hole";b.style.left=p.x+"%";b.style.top=p.y+"%";
    b.textContent=p.icon;b.setAttribute("aria-label",p.icon+" 구멍");
    b.onclick=()=>{if(tap&&!locked) take(i)};
    board.append(b);
  });
  function pos(e){
    const r=board.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};
  }
  board.onpointerdown=e=>{
    if(tap||locked) return;
    const p=pos(e);
    if(Math.hypot(p.x-22,p.y-24)>14){
      status("해 그림에서 시작해 주세요.");return;
    }
    input=[];dragging=true;cursor=p;
    board.setPointerCapture(e.pointerId);take(0);
  };
  board.onpointermove=e=>{
    if(!dragging||locked) return;
    cursor=pos(e);
    const i=points.findIndex(p=>Math.hypot(cursor.x-p.x,cursor.y-p.y)<11);
    if(i>=0) take(i);
    if(dragging) draw();
  };
  board.onpointerup=()=>{
    if(!dragging) return;
    dragging=false;cursor=null;draw();
    input.length===4?win("새 끈 완성! 별을 트리에 걸어보자."):
      reset("중간에 손을 놓았네. 다시 해에서 출발해 보자!");
  };
  board.onpointercancel=()=>reset();
  $("assist").hidden=false;
  $("assist").textContent="누르기로 꿰기";
  $("assist").onclick=()=>{
    tap=!tap;
    $("assist").textContent=tap?"끌어서 꿰기":"누르기로 꿰기";
    reset(tap?"그림을 순서대로 눌러주세요.":undefined);
  };
  status("해를 잡고 손을 떼지 않은 채 끈을 이어보세요.");
}

/* 공용 스크래치 */
function scratch(canvas,{fog=false,threshold=.45,onDone,onProgress}){
  const rect=canvas.getBoundingClientRect();
  canvas.width=Math.max(1,Math.round(rect.width));
  canvas.height=Math.max(1,Math.round(rect.height));
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  const gradient=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  gradient.addColorStop(0,fog?"#d8e7ee":"#d5bdb5");
  gradient.addColorStop(1,fog?"#a9c4d1":"#b99792");
  ctx.fillStyle=gradient;ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<90;i++){
    ctx.fillStyle=i%2?"#ffffff25":"#ffffff55";
    ctx.beginPath();ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,
      Math.random()*7+1,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 13px sans-serif";
  ctx.fillText(fog?"슥슥 닦아보세요":"먼지를 슥슥 닦아보세요",canvas.width/2,canvas.height/2);

  let drawing=false,last=null,moves=0,finished=false;
  function reveal(){
    if(finished) return;
    finished=true;canvas.hidden=true;onDone();
  }
  function estimate(){
    if(finished) return;
    const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let clear=0,total=0;
    for(let i=3;i<data.length;i+=80){total++;if(data[i]<60) clear++}
    const ratio=clear/total;onProgress?.(Math.round(ratio*100));
    if(ratio>=threshold) reveal();
  }
  function erase(e){
    if(!drawing||finished) return;
    const r=canvas.getBoundingClientRect();
    const p={x:(e.clientX-r.left)*canvas.width/r.width,
      y:(e.clientY-r.top)*canvas.height/r.height};
    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=fog?43:30;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(last?.x??p.x,last?.y??p.y);
    ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke();last=p;
    if(++moves%5===0) estimate();
  }
  canvas.onpointerdown=e=>{
    drawing=true;last=null;canvas.setPointerCapture(e.pointerId);erase(e);
  };
  canvas.onpointermove=erase;
  canvas.onpointerup=()=>{drawing=false;last=null;estimate()};
  canvas.onpointercancel=()=>{drawing=false;last=null};
  return reveal;
}

      if(i!==phrases[round][input.length]){

      if(input.length===phrases[round].length){
        $(`layer-${round}`).classList.add("on");

        if(round===3){performance();return}
        listening=true;listen.disabled=true;successSound();
        status("좋아! 반주가 하나 늘었어!");
        later(()=>{
          listening=false;listen.disabled=false;
          listen.textContent=`♫ ${round+1}번째 구절 듣기`;
        },650);

    if(listening||locked) return;

/* 7. 전선 */
function rotateMask(m){return ((m<<1)&15)|((m>>3)&1)}
function connections(masks){
  const seen=new Set();
  if(!(masks[0]&8)) return seen;
  const queue=[0];
  while(queue.length){
    const i=queue.shift();if(seen.has(i)) continue;
    seen.add(i);
    const r=Math.floor(i/3),c=i%3;
    [[1,-3,4,r>0],[2,1,8,c<2],[4,3,1,r<2],[8,-1,2,c>0]]
      .forEach(([bit,d,other,valid])=>{
        if(valid&&(masks[i]&bit)&&(masks[i+d]&other)&&!seen.has(i+d)) queue.push(i+d);
      });
  }
  return seen;
}
function completeCircuit(masks){
  if(connections(masks).size!==9||!(masks[8]&2)) return false;
  for(let i=0;i<9;i++){
    const r=Math.floor(i/3),c=i%3;
    for(const [bit,d,other,valid] of [
      [1,-3,4,r>0],[2,1,8,c<2],[4,3,1,r<2],[8,-1,2,c>0]
    ]){
      if(!(masks[i]&bit)) continue;
      if(!valid){
        if(!((i===0&&bit===8)||(i===8&&bit===2))) return false;
      }else if(!(masks[i+d]&other)) return false;
    }
  }
  return true;
}
function circuitPuzzle(){
  const solution=[10,10,12,6,10,9,3,10,10];
  const turns=[1,1,2,1,1,2,3,1,1];
  const make=()=>solution.map((m,i)=>{
    for(let j=0;j<turns[i];j++) m=rotateMask(m);
    return m;
  });
  let masks=make(),waveToken=0,testing=false;

  $("play-area").innerHTML=`
    <div class="circuit-label">입구 ➜ 첫 번째 줄 왼쪽</div>
    <div class="circuit-wrap"><div id="circuit" class="circuit"></div></div>
    <div class="circuit-label">마지막 줄 오른쪽 ➜ ⭐</div>`;

  const send=action("빛 보내기!",()=>{
    if(locked||testing) return;
    testing=true;send.disabled=true;draw();
    const duration=wave(true);
    if(completeCircuit(masks)){
      locked=true;
      later(()=>{
        const fx=document.createElement("div");
        fx.className="final-light";
        fx.innerHTML=`<img src="${STAR.light}" alt="빛나는 별" onerror="this.hidden=true">`;
        $("screen").append(fx);celebrate();successSound();
        later(()=>go("after"),reduced()?300:1800);
      },duration+150);
    }else{
      later(()=>{
        testing=false;send.disabled=false;
        fail("빛이 멈춘 곳을 살펴보세요. 아홉 칸을 모두 지나 출구까지 이어져야 해요!");
      },duration+150);
    }
  });

  function draw(){
    $("circuit").innerHTML="";
    masks.forEach((mask,i)=>{
      const b=document.createElement("button");
      b.className="pipe";b.id=`pipe-${i}`;
      let paths="",labels=[];
      [[1,50,0,"위"],[2,100,50,"오른쪽"],[4,50,100,"아래"],[8,0,50,"왼쪽"]]
        .forEach(([bit,x,y,label])=>{
          if(mask&bit){paths+=`<path d="M50 50L${x} ${y}"/>`;labels.push(label)}
        });
      b.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="#bc91aa" stroke-width="16" stroke-linecap="round">${paths}</g>
        <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity=".7">${paths}</g>
        <circle cx="50" cy="50" r="10" fill="#bc91aa"/>
      </svg>`;
      b.setAttribute("aria-label",`${i+1}번 전선 ${labels.join(", ")}. 누르면 회전`);
      b.onclick=()=>{
        if(locked||testing) return;
        masks[i]=rotateMask(masks[i]);sfx(370,.03,.01);draw();wave(false);
      };
      $("circuit").append(b);
    });
  }
  function wave(sound){
    const token=++waveToken;
    const cells=Array.from(connections(masks));
    cells.forEach((i,n)=>later(()=>{
      if(token!==waveToken) return;
      const b=$(`pipe-${i}`);if(!b) return;
      b.classList.add("lit");
      b.querySelector("g").setAttribute("stroke","#e2a72a");
      b.querySelector("circle").setAttribute("fill","#facc15");
      if(sound) bell(60+n*2,.2,.03,"game");
    },n*115));
    status(`빛이 닿는 칸 ${cells.length}/9`);
    return cells.length*115;
  }
  $("reset").hidden=false;
  $("reset").onclick=()=>{
    if(locked||testing) return;
    masks=make();draw();wave(false);
  };
  cleanups.push(()=>waveToken++);
  draw();wave(false);
}

/* Web Audio: 외부 음원 없이 배경음악 합성 */
let audio=null,master=null,reverb=null,noiseBuffer=null;
let musicOn=false,soundOn=false,musicTimer=null;
let beatIndex=0,nextBeatTime=0;
const voices=new Set();
const EIGHTH=60/112/2;
const hz=midi=>440*Math.pow(2,(midi-69)/12);

function unlockAudio(){
  try{
    const Constructor=window.AudioContext||window.webkitAudioContext;
    if(!Constructor) return false;
    if(!audio){
      audio=new Constructor();
      master=audio.createGain();master.gain.value=.7;
      const compressor=audio.createDynamicsCompressor();
      compressor.threshold.value=-18;compressor.knee.value=18;
      compressor.ratio.value=3;compressor.attack.value=.006;compressor.release.value=.2;
      master.connect(compressor);compressor.connect(audio.destination);

      reverb=audio.createConvolver();
      const length=Math.floor(audio.sampleRate*.8);
      const impulse=audio.createBuffer(2,length,audio.sampleRate);
      for(let c=0;c<2;c++){
        const d=impulse.getChannelData(c);
        for(let i=0;i<length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/length,3)*.18;
      }
      reverb.buffer=impulse;
      const wet=audio.createGain();wet.gain.value=.12;
      reverb.connect(wet);wet.connect(master);

      noiseBuffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.12),audio.sampleRate);
      const d=noiseBuffer.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    if(audio.state==="suspended") audio.resume().catch(()=>{});
    return true;
  }catch(e){return false}
}
function voice(midi,duration,volume,type,time,group,bright=false){
  if(!audio) return;
  const t=Math.max(time,audio.currentTime);
  const oscillator=audio.createOscillator(),gain=audio.createGain();
  const filter=audio.createBiquadFilter();
  oscillator.type=type;oscillator.frequency.value=hz(midi);
  filter.type="lowpass";filter.frequency.value=bright?6000:2200;
  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(Math.max(.001,volume),t+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.04,duration));
  oscillator.connect(filter);filter.connect(gain);gain.connect(master);
  if(bright) gain.connect(reverb);
  const item={node:oscillator,group};voices.add(item);
  oscillator.onended=()=>{
    oscillator.disconnect();filter.disconnect();gain.disconnect();voices.delete(item);
  };
  oscillator.start(t);oscillator.stop(t+duration+.03);
}
function synth(midi,duration=.3,volume=.04,type="triangle",delay=0){
  if(unlockAudio()) voice(midi,duration,volume,type,audio.currentTime+delay,"game");
}
function bell(midi,duration=.6,volume=.05,group="game",time=null){
  if(!unlockAudio()) return;
  const t=time??audio.currentTime;
  voice(midi,duration,volume,"sine",t,group,true);
  voice(midi+12,duration*.45,volume*.23,"sine",t+.004,group,true);
  voice(midi+19,duration*.25,volume*.06,"sine",t+.007,group,true);
}
function shaker(time,volume=.004){
  if(!audio) return;
  const source=audio.createBufferSource(),gain=audio.createGain();
  const filter=audio.createBiquadFilter();
  source.buffer=noiseBuffer;filter.type="highpass";filter.frequency.value=6500;
  gain.gain.setValueAtTime(volume,time);
  gain.gain.exponentialRampToValueAtTime(.0001,time+.055);
  source.connect(filter);filter.connect(gain);gain.connect(master);
  const item={node:source,group:"bgm"};voices.add(item);
  source.onended=()=>{
    source.disconnect();filter.disconnect();gain.disconnect();voices.delete(item);
  };
  source.start(time);source.stop(time+.08);
}
function stopGroup(group){
  voices.forEach(v=>{if(v.group===group){try{v.node.stop()}catch(e){}}});
}
function sfx(frequency,duration=.06,volume=.02){
  if(soundOn&&unlockAudio()){
    voice(69+12*Math.log2(frequency/440),duration,volume,"sine",audio.currentTime,"game");
  }
}
function successSound(){
  if(!soundOn||!unlockAudio()) return;
  [72,76,79,84].forEach((n,i)=>bell(n,.5,.04,"game",audio.currentTime+i*.09));
}
const melodyA=[
  76,76,76,null,76,76,76,null,
  76,79,72,74,76,null,null,null,
  77,77,77,77,77,76,76,76,
  76,74,74,76,74,null,79,null
];
const melodyB=[
  76,76,76,null,76,76,76,null,
  76,79,72,74,76,null,null,null,
  77,77,77,77,77,76,76,76,
  79,79,77,74,72,null,null,null
];
const chords=[
  [60,64,67],[60,64,67],[65,69,72],[55,59,62],
  [60,64,67],[57,60,64],[65,69,72],[55,59,62]
];
function scheduleBeat(index,time){
  if(state.phase==="puzzle"&&state.stage===4) return;
  const cycle=Math.floor(index/32),step=index%32,bar=Math.floor(index/8);
  const chord=chords[(cycle%2)*4+bar];
  const melody=cycle%2===0?melodyA:melodyB;
  const scale=state.phase==="epilogue"?.75:1;
  const n=melody[step];
  if(n!==null){
    bell(n,.4,.032*scale,"bgm",time);
    voice(n-12,.19,.007*scale,"triangle",time,"bgm");
  }
  if(step%8===0||step%8===4){
    voice(step%8===0?chord[0]-24:chord[2]-24,.35,.025*scale,"triangle",time,"bgm");
  }
  if(step%4===2){
    chord.forEach((value,i)=>voice(value,.16,.011*scale,"sine",time+i*.008,"bgm"));
  }
  if(cycle%2===1&&step%2===1){
    voice(chord[(step+bar)%3]+12,.2,.011*scale,"sine",time,"bgm",true);
  }
  shaker(time,step%2===0?.004:.002);
  if(step%8===7) bell(chord[2]+24,.2,.007*scale,"bgm",time);
  if((state.stage===6||state.phase==="outro")&&step%8===0){
    bell(chord[0]+24,.65,.012,"bgm",time);
  }
}
function musicTick(){
  if(!audio||audio.state!=="running") return;
  if(nextBeatTime<audio.currentTime-.2) nextBeatTime=audio.currentTime+.04;
  while(nextBeatTime<audio.currentTime+.15){
    scheduleBeat(beatIndex++,nextBeatTime);nextBeatTime+=EIGHTH;
  }
}
function updateMusic(){
  clearInterval(musicTimer);musicTimer=null;stopGroup("bgm");
  $("music-toggle").textContent=musicOn?"♫ ON":"♫ OFF";
  $("music-toggle").setAttribute("aria-pressed",String(musicOn));
  if(musicOn&&!document.hidden&&unlockAudio()){
    nextBeatTime=audio.currentTime+.05;
    musicTimer=setInterval(musicTick,30);musicTick();
  }
}
$("music-toggle").onclick=()=>{
  if(!unlockAudio()){
    openModal("音楽 안내".replace("音楽","음악"),"이 환경에서는 오디오를 사용할 수 없어요.",()=>{});
    return;
  }
  musicOn=!musicOn;updateMusic();
};
$("sound-toggle").onclick=()=>{
  soundOn=!soundOn;unlockAudio();
  $("sound-toggle").textContent=soundOn?"효과음 ON":"효과음 OFF";
  $("sound-toggle").setAttribute("aria-pressed",String(soundOn));
};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){stopGroup("game");stopGroup("bgm")}
  updateMusic();
});

/* 시작 */
resumePoint=readSave();
updateChrome();
renderIntro();
</script>
