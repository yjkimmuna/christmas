<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해치 크리스마스 — 오래된 별의 자리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --pink:#fff0f4;
  --paper:#fffdf6;
  --ink:#663c49;
  --muted:#857581;
  --rose:#d85c82;
  --line:#e5a9bc;
  --green:#65876d;
  --gold:#eeb75d;
  --shadow:0 5px 15px #75414a18;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  display:flex;
  justify-content:center;
  background:#f2dfe7;
  color:var(--ink);
  font-family:"Gaegu",system-ui,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.5}
button:focus-visible,select:focus-visible{
  outline:3px solid #779ab7;
  outline-offset:3px;
}
[hidden]{display:none!important}
#app{
  position:relative;
  width:min(100%,460px);
  height:100vh;
  height:100dvh;
  max-height:840px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--pink);
  box-shadow:0 0 35px #704c5420;
}
#topbar{
  position:relative;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  min-height:46px;
  padding:7px 9px;
  padding-top:max(7px,env(safe-area-inset-top));
  background:#fffaf2;
  border-bottom:1px solid #e2cabb;
}
#progress{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}
.tools{display:flex;gap:4px;align-items:center}
.small-btn{
  border:1px solid #d6b8bd;
  border-radius:9px;
  padding:5px 7px;
  background:#fffdf8;
  color:var(--ink);
  font-size:12px;
  white-space:nowrap;
}
.small-btn.on{background:#f9dce6;color:#a94165}
#screen{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
}
#debug{
  position:relative;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  padding:5px 8px max(5px,env(safe-area-inset-bottom));
  background:#f9e2e9;
  border-top:1px dashed #dba8b8;
  font-size:12px;
}
#debug select{
  min-width:0;
  max-width:135px;
  border:1px solid #d6b8bd;
  border-radius:6px;
  background:white;
  color:var(--ink);
  padding:3px;
}
#debug button{
  border:1px solid #d6b8bd;
  background:#fffaf4;
  border-radius:6px;
  padding:3px 7px;
  color:var(--ink);
}
.scene{position:absolute;inset:0;overflow:hidden;background:#f9e9e9}
.background{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
.background-fallback{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
  text-align:center;
  color:#a48085;
  background:
    radial-gradient(ellipse at 20% 20%,#fff8e4,transparent 60%),
    linear-gradient(#f9e7e9,#f4d7e2);
  font-size:18px;
}
.scene-shade{
  position:absolute;
  inset:45% 0 0;
  pointer-events:none;
  background:linear-gradient(transparent,#92515d14);
}
.chapter{
  position:absolute;
  z-index:3;
  top:15px;
  left:13px;
  max-width:calc(100% - 26px);
  padding:8px 15px;
  border:2px solid #fffaf0;
  border-radius:12px 9px 13px 8px;
  box-shadow:2px 3px 0 #795d481b;
  background:#fffaf0ee;
  transform:rotate(-1deg);
  font-size:18px;
  font-weight:700;
}
.chapter small{
  display:block;
  color:var(--rose);
  font-size:11px;
  letter-spacing:1px;
}
.primary,.secondary{
  border:2px solid #c97280;
  border-radius:15px;
  padding:10px 18px;
  background:linear-gradient(#ffc7b6,#f49c99);
  box-shadow:0 4px 0 #bc727d;
  color:#703d49;
  font-weight:700;
  font-size:18px;
}
.primary:active,.secondary:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #bc727d;
}
.secondary{
  background:#fffaf0;
  border-color:#cbb7a3;
  box-shadow:0 4px 0 #cbb7a3;
}
.arrow{
  display:inline-block;
  margin-left:5px;
  font-family:system-ui,sans-serif;
  font-weight:700;
  animation:arrowMove 1s ease-in-out infinite;
}
@keyframes arrowMove{
  50%{transform:translateX(4px)}
}

/* 인트로: 이미지 원본 좌표를 기준으로 배치 */
.intro-scene{background:#f8e7e9}
.intro-plane{position:absolute}
.intro-plane>.intro-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
.intro-title{
  position:absolute;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff9e9;
  text-shadow:2px 3px 0 #a84f70,0 2px 8px #8b4558;
  line-height:1.12;
  pointer-events:none;
}
.intro-title strong{font-size:clamp(24px,7vw,34px)}
.intro-title span{font-size:clamp(12px,3.5vw,17px)}
.intro-start{
  position:absolute;
  background:transparent;
  border:0;
  border-radius:18px;
}
.intro-start:focus-visible{outline:3px dashed white}
.intro-start.fallback{
  background:#fff5dbe8;
  border:2px solid #c37a7b;
  color:#914d64;
  font-size:23px;
  font-weight:700;
}

/* 메모 */
.memo-wrap{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:linear-gradient(#ffffff20,#dca6b02b);
}
.memo{
  position:relative;
  width:100%;
  max-height:95%;
  overflow:auto;
  padding:30px 23px 25px;
  border:1px solid #eadbc6;
  border-radius:4px 7px 10px 5px;
  background-color:#fffdf2;
  background-image:
    linear-gradient(#d8c9ad25 1px,transparent 1px),
    linear-gradient(90deg,#d8c9ad25 1px,transparent 1px);
  background-size:22px 22px;
  box-shadow:6px 9px 0 #a5767a22,0 12px 35px #663c4920;
  transform:rotate(-1deg);
}
.memo:before{
  content:"";
  position:absolute;
  width:96px;
  height:24px;
  top:0;
  left:calc(50% - 48px);
  transform:rotate(4deg);
  background:#e9bfcebb;
}
.memo h1{
  text-align:center;
  margin:0 0 15px;
  color:#c45f7f;
  font-size:30px;
}
.memo p{font-size:19px;line-height:1.55;margin:12px 0}
.memo small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
.difficulty-options{display:grid;gap:12px;margin-top:23px}
.difficulty-options button{width:100%}
.difficulty-options span{display:block;font-size:13px;margin-top:3px}

/* 대화창: 캐릭터와 본문 사이 여백 확보 */
.dialogue{
  position:absolute;
  z-index:8;
  left:12px;
  right:12px;
  bottom:16px;
  height:124px;
  border:2px solid #dfc7b5;
  border-radius:17px 12px 18px 13px;
  background:#fffdf5f5;
  box-shadow:var(--shadow);
}
.dialogue:before{
  content:"";
  position:absolute;
  inset:7px;
  pointer-events:none;
  border:1px dashed #e9d7c8;
  border-radius:11px;
}
.portrait{
  position:absolute;
  left:7px;
  bottom:14px;
  width:86px;
  height:125px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  pointer-events:none;
  isolation:isolate;
}
.portrait img{
  position:relative;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 3px 0 #936d6915);
}
/* 별 뒤에 배지·이모지·장식 레이어를 생성하지 않습니다. */
.portrait::before,.portrait::after{content:none!important}
.dialogue-copy{
  position:absolute;
  top:10px;
  bottom:30px;
  left:112px;
  right:13px;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.speaker{
  flex-shrink:0;
  margin-bottom:3px;
  color:#bf5978;
  font-size:13px;
  font-weight:700;
}
.message{
  overflow:auto;
  overscroll-behavior:contain;
  font-size:17px;
  line-height:1.4;
  overflow-wrap:anywhere;
  scrollbar-width:thin;
}
.dialogue-next{
  position:absolute;
  right:13px;
  bottom:7px;
  border:0;
  background:transparent;
  color:#a5516c;
  padding:2px 5px;
  font-size:14px;
  font-weight:700;
}
.dialogue.narration{height:101px;background:#fffaf3f0}
.dialogue.narration .portrait{display:none}
.dialogue.narration .dialogue-copy{left:17px;top:13px}
.dialogue.narration .speaker{display:none}
.dialogue.narration .message{color:#7d7680;font-style:italic}

/* 장면에 배치하는 별: PNG 한 장만 사용 */
.scene-star{
  position:absolute;
  z-index:4;
  width:24%;
  height:auto;
  object-fit:contain;
  pointer-events:none;
}
.scene-star.glow{filter:drop-shadow(0 0 14px #ffe3a3)}
.scene-star.rising{animation:starRise 3s ease-in-out forwards}
@keyframes starRise{
  to{transform:translateY(-160px) scale(.63);opacity:.25}
}
.route-note{
  position:absolute;
  z-index:4;
  left:20px;
  right:20px;
  top:88px;
  padding:14px 17px;
  background:#fffaf0ed;
  border:1px solid #e4c6b1;
  border-radius:5px 13px 7px 12px;
  box-shadow:var(--shadow);
}
.route-note strong{display:block;font-size:22px;color:#af5873}
.route-note p{margin:7px 0 0;font-size:16px;line-height:1.45}
.route-note small{display:block;margin-top:8px;color:#96838a;font-size:12px}

/* 전환: 이모지 없이 구름과 이미지로만 표현 */
.travel{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:linear-gradient(#f7e9ed,#fff5df);
}
.travel:before,.travel:after{
  content:"";
  position:absolute;
  width:150%;
  height:50%;
  left:-25%;
  background:#fffaf4;
  border-radius:45%;
  opacity:.9;
}
.travel:before{top:-20%;animation:cloudTop 1.6s ease-in-out both}
.travel:after{bottom:-20%;animation:cloudBottom 1.6s ease-in-out both}
@keyframes cloudTop{
  0%{transform:translateY(65%)}
  100%{transform:translateY(-70%)}
}
@keyframes cloudBottom{
  0%{transform:translateY(-65%)}
  100%{transform:translateY(70%)}
}
.travel-caption{
  position:absolute;
  top:25%;
  width:100%;
  padding:0 25px;
  text-align:center;
  font-size:24px;
  color:#a6617b;
}
.travel-character{
  position:absolute;
  width:130px;
  height:160px;
  object-fit:contain;
  left:calc(50% - 65px);
  top:43%;
  animation:travelBob .45s ease-in-out infinite alternate;
}
@keyframes travelBob{
  to{transform:translateY(-7px) rotate(2deg)}
}
.travel-line{
  position:absolute;
  width:180px;
  height:2px;
  left:calc(50% - 90px);
  top:calc(43% + 155px);
  background:#ca9dae;
}
.travel-skip{
  position:absolute;
  bottom:35px;
  left:50%;
  transform:translateX(-50%);
  background:transparent;
  border:0;
  color:#936674;
  font-size:15px;
}

/* 문제 공통 */
.puzzle-scene{background:#f8e7ec}
.puzzle-scene .background{opacity:.32;filter:blur(1px)}
.puzzle-card{
  position:absolute;
  z-index:4;
  top:79px;
  bottom:145px;
  left:13px;
  right:13px;
  padding:17px 13px;
  overflow:auto;
  overscroll-behavior:contain;
  border:2px solid #dfc5b3;
  border-radius:18px 12px 17px 13px;
  background:#fffdf5f5;
  box-shadow:var(--shadow);
}
.puzzle-instruction{
  text-align:center;
  font-size:19px;
  line-height:1.4;
  margin:0 0 12px;
}
.puzzle-sub{
  text-align:center;
  color:#8c7580;
  font-size:14px;
  line-height:1.4;
}
.puzzle-dock{
  position:absolute;
  z-index:6;
  left:15px;
  right:15px;
  bottom:13px;
  display:grid;
  gap:8px;
}
.status{
  padding:8px 12px;
  min-height:35px;
  background:#fffaf0ed;
  border:1px solid #e0c2b5;
  border-radius:10px;
  text-align:center;
  font-size:15px;
  line-height:1.35;
}
.dock-buttons{display:flex;justify-content:center;gap:9px}
.dock-buttons button{
  flex:1;
  min-width:0;
  padding:8px 9px;
  border:1px solid #d2a8ae;
  border-radius:11px;
  color:#855567;
  background:#fff8ef;
  font-size:15px;
}
.paper-clue{
  padding:10px 13px;
  margin:10px 0;
  border:1px dashed #d9bba1;
  border-radius:5px;
  background:#fff3d9;
  text-align:center;
  font-size:18px;
  line-height:1.45;
}
.puzzle-action{
  display:block;
  width:100%;
  margin-top:15px;
}
.shake{animation:shake .35s ease-in-out}
@keyframes shake{
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}

/* 자물쇠 */
.lock-wrap{padding-top:37px;margin:12px auto 0;max-width:350px;position:relative}
.lock-shackle{
  position:absolute;
  top:0;
  width:47%;
  height:88px;
  left:26.5%;
  border:14px solid #9a9eaa;
  border-bottom:0;
  border-radius:65px 65px 0 0;
  box-shadow:inset 3px 2px 0 #e8e9ed,3px 0 0 #727682;
  transition:transform .65s ease;
  transform-origin:15% 100%;
}
.lock-wrap.unlocked .lock-shackle{transform:translateY(-13px) rotate(-22deg)}
.lock-body{
  position:relative;
  padding:16px 10px 12px;
  border:3px solid #b68a48;
  border-radius:15px;
  background:linear-gradient(115deg,#f5dc98,#d9b66d 50%,#f7dfa3);
  box-shadow:inset 0 3px 0 #fff2bc,0 6px 0 #b38c51;
}
.lock-label{
  text-align:center;
  margin:0 0 11px;
  font-size:12px;
  letter-spacing:2px;
  color:#85663d;
}
.dials{display:flex;justify-content:center;gap:5px}
.dial{
  min-width:0;
  flex:1;
  max-width:48px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.dial button{
  width:100%;
  min-height:26px;
  border:0;
  border-radius:5px;
  background:#fff9e299;
  color:#805939;
  font-family:system-ui,sans-serif;
  font-size:13px;
}
.dial-face{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:63px;
  color:#644636;
  background:linear-gradient(#d7d1bd,#fffdf2 35%,#fffdf2 65%,#c9c2ad);
  border:1px solid #958b72;
  border-radius:5px;
  font-family:system-ui,sans-serif;
  font-size:23px;
  font-weight:700;
  touch-action:none;
  cursor:ns-resize;
}
.book-dials .dial-face{
  height:54px;
  color:#a35873;
  border-color:#cda6ac;
  background:linear-gradient(#ead7da,#fffaf5 35%,#fffaf5 65%,#ead7da);
}

/* 실 끼우기 */
.thread-board{
  position:relative;
  width:100%;
  height:260px;
  border:1px dashed #d1b1bc;
  border-radius:15px;
  background:#fff3e8;
  touch-action:none;
}
.thread-board .thread-star{
  position:absolute;
  width:62%;
  left:19%;
  top:12%;
  height:78%;
  object-fit:contain;
}
.thread-board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.thread-node{
  position:absolute;
  width:40px;
  height:40px;
  border:3px solid #d59aad;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#fffdf5;
  color:#9d5470;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
.thread-node.done{background:#f6cbd8;border-color:#b56885}
.thread-board.tap-mode .thread-node{pointer-events:auto;cursor:pointer}

/* 기억 렌즈 */
.city-board{
  position:relative;
  width:100%;
  height:265px;
  background:#e7efdc;
  overflow:hidden;
  border:2px solid #c3ceaf;
  border-radius:15px;
  touch-action:none;
}
.city-board svg{width:100%;height:100%;display:block}
.memory-lens{
  position:absolute;
  width:106px;
  height:106px;
  left:10px;
  top:130px;
  border:7px solid #e3bc80;
  border-radius:50%;
  box-shadow:0 2px 0 #ac825d,0 0 0 3px #fff6dc;
  background:#fff9ec42;
  touch-action:none;
}
.memory-lens:after{
  content:"";
  position:absolute;
  width:15px;
  height:47px;
  left:80px;
  top:81px;
  border-radius:9px;
  background:#c98a80;
  transform:rotate(-40deg);
  border:2px solid #a56c68;
}
.lens-memory{
  position:absolute;
  left:50%;
  top:50%;
  width:27px;
  height:65px;
  transform:translate(-50%,-50%);
  opacity:.55;
  border-bottom:3px solid #b66b87;
  background:linear-gradient(90deg,transparent 43%,#b66b87 43%,#b66b87 57%,transparent 57%);
  pointer-events:none;
}
.lens-memory:before{
  content:"";
  position:absolute;
  width:26px;
  height:15px;
  left:0;
  top:18px;
  border:3px solid #b66b87;
  border-radius:5px;
}
.zoom-control{display:flex;align-items:center;gap:10px;margin:18px 5px 0;font-size:15px}
.zoom-control input{flex:1;min-width:0;accent-color:#bd7992}

/* 스크래치 */
.scratch-area{
  position:relative;
  width:100%;
  height:220px;
  overflow:hidden;
  border:2px solid #d6b9bb;
  border-radius:13px;
  background:#fff4d9;
}
.scratch-under{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:18px;
  font-size:23px;
  color:#956378;
  line-height:1.7;
}
.scratch-under small{font-size:15px;color:#9c858c}
.scratch-area canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}
.assist{
  display:block;
  margin:10px auto;
  padding:5px 10px;
  background:transparent;
  color:#956c7d;
  border:0;
  text-decoration:underline;
  font-size:14px;
}
.book-panel{margin-top:12px}

/* 피아노 */
.music-progress{
  display:flex;
  justify-content:center;
  gap:5px;
  padding:8px 0 15px;
}
.music-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  border:1px solid #d7b5bb;
  background:#f2e6e4;
}
.music-dot.done{background:#d88ea9;border-color:#b96d89}
.piano-case{
  position:relative;
  margin:10px auto 15px;
  padding:17px 10px 12px;
  background:linear-gradient(#58424a,#352b34);
  border:3px solid #382b32;
  border-radius:13px 13px 9px 9px;
  box-shadow:0 7px 0 #c1a2a6;
}
.piano-name{
  text-align:center;
  color:#f2d7b2;
  letter-spacing:3px;
  font-family:system-ui,sans-serif;
  font-size:9px;
  margin-bottom:12px;
}
.piano-keyboard{position:relative;height:167px;touch-action:manipulation}
.white-keys{display:flex;height:100%;gap:2px}
.white-key{
  position:relative;
  flex:1;
  min-width:0;
  padding:0;
  background:linear-gradient(90deg,#e9e4df,#fffdf8 25%,#fffdf8 80%,#e9e4df);
  border:1px solid #b5aaa5;
  border-bottom:6px solid #c8bdb5;
  border-radius:0 0 5px 5px;
  color:#8a7177;
}
.white-key span{
  position:absolute;
  bottom:12px;
  left:0;
  width:100%;
  font-size:16px;
}
.white-key.active{
  background:linear-gradient(#f7dce5,#f5c8d8);
  border-bottom-width:2px;
  transform:translateY(3px);
}

  color:#9d7285;
  text-align:center;
  font-size:17px;
  line-height:1.45;
}

.circuit-board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  width:min(100%,285px);
  margin:16px auto;
}
.circuit-cell{
  position:relative;
  aspect-ratio:1;
  padding:0;
  border:2px solid #cdbca4;
  border-radius:12px;
  background:#f0e7d8;
  overflow:hidden;
}
.circuit-center{
  position:absolute;
  width:20%;
  height:20%;
  border-radius:50%;
  background:#b9a48e;
  left:40%;
  top:40%;
}
.circuit-line{position:absolute;background:#b9a48e}
.circuit-line.up{width:16%;height:50%;left:42%;top:0}
.circuit-line.right{width:50%;height:16%;left:50%;top:42%}
.circuit-line.down{width:16%;height:50%;left:42%;top:50%}
.circuit-line.left{width:50%;height:16%;left:0;top:42%}
.circuit-cell.lit{background:#fff1bf;border-color:#d6ad5d}
.circuit-cell.lit .circuit-line,
.circuit-cell.lit .circuit-center{
  background:#e3a841;
  box-shadow:0 0 9px #ffd46d;
}
.circuit-labels{
  display:flex;
  justify-content:space-between;
  padding:0 10px;
  color:#a37f55;
  font-size:15px;
}
.final-star{
  display:block;
  height:80px;
  width:100px;
  margin:0 auto;
  object-fit:contain;
}
.final-star.fly{animation:finalFly 1.7s ease-in forwards}
@keyframes finalFly{
  to{transform:translateY(-220px) scale(.45);opacity:0}
}

  left:20px;
  right:20px;
  bottom:25px;
  padding:20px;

  background:#fffaf0ed;
  text-align:center;

}
.outro-card h2{font-size:27px;color:#b75e7c;margin:0 0 10px}
.outro-card p{font-size:19px;line-height:1.5;margin:9px 0 17px}

.overlay{

  inset:0;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:center;

}
.overlay-card{
  width:100%;
  max-height:90%;

  padding:24px 21px;

.memory-entry p{margin:5px 0 0;font-size:16px;color:#927b84}
#toast{
  position:absolute;
  z-index:40;
  top:65px;
  left:50%;
  max-width:85%;
  transform:translateX(-50%);
  padding:10px 18px;
  background:#fff7e7f5;
  border:1px solid #d6b49d;
  border-radius:15px;
  color:#9b6277;
  text-align:center;
  font-size:17px;

@media(prefers-reduced-motion:reduce){

  difficulty:"child",
  earned:[]
};

let version = 0;
let timers = new Set();
let cleanups = [];
let typingTimer = null;
let finishTyping = null;
let locked = false;
let transitioning = false;
let hintIndex = 0;
let resetPuzzle = () => {};
let lastFocus = null;

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function later(fn,delay){
  const current = version;
  const id = setTimeout(()=>{
    timers.delete(id);
    if(current===version) fn();
  },delay);
  timers.add(id);
  return id;
}

function cleanup(){
  version++;
  timers.forEach(clearTimeout);
  timers.clear();
  cleanups.splice(0).forEach(fn=>fn());
  if(typingTimer) clearInterval(typingTimer);
  typingTimer = null;
  finishTyping = null;
  stopNotes();
  $("screen").innerHTML = "";
}

function save(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}
}

function readSave(){
  try{
    const value=JSON.parse(localStorage.getItem(SAVE_KEY));
    const phases=["guide","arrival","puzzle","after","epilogue","outro"];
    if(!value || !phases.includes(value.phase)) return null;
    if(!Number.isInteger(value.stage)||value.stage<0||value.stage>6) return null;
    return {
      phase:value.phase,
      stage:value.stage,
      difficulty:value.difficulty==="adult"?"adult":"child",
      earned:Array.isArray(value.earned)
        ? [...new Set(value.earned.filter(n=>Number.isInteger(n)&&n>=0&&n<7))]
        : []
    };
  }catch(e){return null}
}

function imageFile(stage){
  return `image_${String(stage+1).padStart(2,"0")}.png`;
}

function background(file,fallbackFile){
  const box=document.createElement("div");
  box.className="scene";

  const fallback=document.createElement("div");
  fallback.className="background-fallback";
  fallback.textContent="배경 이미지를 준비하고 있어요.";
  box.append(fallback);

  const img=document.createElement("img");
  img.className="background";
  img.alt="";
  let triedFallback=false;
  img.onerror=()=>{
    if(fallbackFile&&!triedFallback){
      triedFallback=true;
      img.src=fallbackFile;
    }else{
      img.hidden=true;
    }
  };
  img.src=file;
  box.append(img);
  return box;
}

function chapter(scene,stage,title=TITLES[stage]){
  const el=document.createElement("div");
  el.className="chapter";
  el.innerHTML=`<small>CHAPTER ${stage+1}</small>${escapeHTML(title)}`;
  scene.append(el);
}

function setStatus(text){
  const el=$("puzzle-status");
  if(el) el.textContent=text;
}

function updateChrome(){
  const hidden=["intro","memo"].includes(state.phase);
  $("topbar").hidden=hidden;
  $("debug").hidden=hidden||!TEST_MODE;
  $("progress").textContent=
    state.phase==="epilogue"||state.phase==="outro"
      ? "마지막 이야기"
      : `${state.stage+1} / 7 · 기억 ${state.earned.length}`;
  $("stage-select").value=String(state.stage);
  $("jump-button").disabled=transitioning;
  $("pass-button").disabled=transitioning;
}

function go(phase,stage=state.stage){
  cleanup();
  locked=false;
  transitioning=false;
  state.phase=phase;
  state.stage=stage;
  hintIndex=0;

  if(phase==="after"&&!state.earned.includes(stage)){
    state.earned.push(stage);
  }

  if(!["intro","memo"].includes(phase)) save();

  updateChrome();

  if(phase==="intro") renderIntro();
  else if(phase==="memo") renderMemo();
  else if(phase==="guide") renderGuide();
  else if(phase==="arrival"){
    renderDialogue(ARRIVAL[stage],()=>go("puzzle"),"문제 시작");
  }
  else if(phase==="puzzle") renderPuzzle();
  else if(phase==="after"){
    renderDialogue(
      AFTER[stage],
      ()=>stage<6?go("guide",stage+1):go("epilogue"),
      stage<6?"다음 장소로":"계속하기"
    );
    toast("기억 한 조각을 찾았어!");
  }
  else if(phase==="epilogue"){
    renderDialogue(EPILOGUE,()=>go("outro"),"마무리");
  }
  else if(phase==="outro") renderOutro();

  syncBGM();
}

function newGame(){
  state={phase:"memo",stage:0,difficulty:"child",earned:[]};
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
  go("memo",0);
}

function resetToIntro(){
  state={phase:"intro",stage:0,difficulty:"child",earned:[]};
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
  go("intro",0);
}

const bgm=$("bgm");
bgm.volume=.3;

let musicOn=false;
let soundOn=false;
let bgmRequest=0;
let bgmErrorShown=false;

function shouldPlayBGM(){
  return musicOn &&
    !document.hidden &&
    !["intro","memo"].includes(state.phase) &&
    !(state.phase==="puzzle"&&state.stage===4);
}

async function syncBGM(){
  const request=++bgmRequest;

  $("bgm-button").textContent=musicOn?"음악 ON":"음악 OFF";
  $("bgm-button").classList.toggle("on",musicOn);

  if(!shouldPlayBGM()){
    bgm.pause();
    return;
  }

  try{
    await bgm.play();
    if(request!==bgmRequest&&!shouldPlayBGM()) bgm.pause();
  }catch(e){
    if(request!==bgmRequest||!shouldPlayBGM()) return;
    musicOn=false;
    $("bgm-button").textContent="음악 OFF";
    $("bgm-button").classList.remove("on");

    if(!bgmErrorShown){
      bgmErrorShown=true;
      openModal(
        "배경음악 안내",
        "음악을 재생하지 못했어요.\nindex.html과 같은 폴더에 bgm.mp3가 있는지 확인해 주세요."
      );
    }
  }
}

$("bgm-button").onclick=()=>{
  musicOn=!musicOn;
  syncBGM();
};

$("sfx-button").onclick=()=>{
  soundOn=!soundOn;
  $("sfx-button").textContent=soundOn?"효과음 ON":"효과음 OFF";
  $("sfx-button").classList.toggle("on",soundOn);

/* =========================
   건반·효과음
========================= */
let audioCtx=null;
let audioMaster=null;
const activeNotes=new Set();

function initAudio(){
  try{
    if(!audioCtx){
      const AudioAPI=window.AudioContext||window.webkitAudioContext;
      if(!AudioAPI) return null;
      audioCtx=new AudioAPI();
      audioMaster=audioCtx.createGain();
      audioMaster.gain.value=.65;
      audioMaster.connect(audioCtx.destination);
    }
    if(audioCtx.state==="suspended") audioCtx.resume().catch(()=>{});
    return audioCtx;
  }catch(e){return null}
}

function stopNotes(){
  activeNotes.forEach(osc=>{
    try{osc.stop()}catch(e){}
    try{osc.disconnect()}catch(e){}
  });
  activeNotes.clear();
}

function tone(freq,duration=.18,force=false,piano=false){
  if(!force&&!soundOn) return;
  const ctx=initAudio();
  if(!ctx) return;

  const now=ctx.currentTime;
  const partials=piano
    ? [[1,.2],[2,.065],[3,.025],[4,.012]]
    : [[1,.075]];

  partials.forEach(([multiple,volume])=>{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.type=piano?"sine":"triangle";
    osc.frequency.setValueAtTime(freq*multiple,now);

    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(volume,now+.008);
    gain.gain.exponentialRampToValueAtTime(
      .0001,now+(piano?duration:duration*.95)
    );

    osc.connect(gain);
    gain.connect(audioMaster);
    activeNotes.add(osc);

    osc.onended=()=>{
      activeNotes.delete(osc);
      osc.disconnect();
      gain.disconnect();
    };

    osc.start(now);
    osc.stop(now+duration+.04);
  });
}

function successSound(){
  if(!soundOn) return;
  tone(523,.25);
  later(()=>tone(659,.3),100);
  later(()=>tone(784,.4),210);
}

function win(text,delay=850){
  if(locked) return;
  locked=true;
  stopNotes();
  successSound();
  setStatus(text);
  later(()=>go("after"),reduceMotion?250:delay);
}

function fail(text){
  const card=$("puzzle-card");
  if(card){
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }
  openModal("もう一度".replace("もう一度","もう一度"),text);
  $("modal-title").textContent="다시 한번 해볼까?";
}

function renderIntro(){
  const scene=document.createElement("div");
  scene.className="scene intro-scene";

  const plane=document.createElement("div");
  plane.className="intro-plane";

  const image=document.createElement("img");
  image.className="intro-image";
  image.alt="해치 크리스마스";
  image.src="intro.gif";

  const title=document.createElement("div");
  title.className="intro-title";
  title.innerHTML="<strong>해치 크리스마스</strong><span>오래된 별의 자리</span>";

  const start=document.createElement("button");
  start.className="intro-start";
  start.setAttribute("aria-label","게임 시작");

  plane.append(image,title,start);
  scene.append(plane);
  $("screen").append(scene);

  let naturalW=900,naturalH=1600;

  function layout(){
    const w=scene.clientWidth,h=scene.clientHeight;
    const scale=Math.min(w/naturalW,h/naturalH);
    const pw=naturalW*scale,ph=naturalH*scale;

    Object.assign(plane.style,{
      width:pw+"px",height:ph+"px",
      left:(w-pw)/2+"px",top:(h-ph)/2+"px"
    });

    function rect(el,x,y,width,height){
      Object.assign(el.style,{
        left:x*scale+"px",
        top:y*scale+"px",
        width:width*scale+"px",
        height:height*scale+"px"
      });
    }

    rect(title,220,255,500,140);
    rect(start,280,1390,370,110);
  }

  image.onload=()=>{
    naturalW=image.naturalWidth;
    naturalH=image.naturalHeight;
    layout();
  };

  image.onerror=()=>{
    image.hidden=true;
    start.classList.add("fallback");
    start.textContent="시작하기";
  };

  start.onclick=()=>{
    initAudio();
    const saved=readSave();
    if(saved){
      openModal(
        "이어서 탐험할까?",
        "지난번에 진행하던 이야기가 남아 있어.",
        ()=>{
          state=saved;
          go(state.phase,state.stage);
        },
        "이어서 하기",
        ()=>newGame(),
        "새로 시작"
      );
    }else newGame();
  };

  const observer=new ResizeObserver(layout);
  observer.observe(scene);
  cleanups.push(()=>observer.disconnect());
  layout();
}

function addSceneStar(scene){
  let file=null,x=55,y=30;
  let extra="";

  if(state.phase==="epilogue"){
    file=STAR.light;x=65;y=15;extra="glow";
  }else if(state.stage===0&&state.phase==="after"){
    file=STAR.sleep;x=55;y=48;
  }else if(state.stage===1){
    file=state.phase==="after"?STAR.awake:STAR.sleep;
    x=57;y=30;
  }else if(state.stage===6){
    file=state.phase==="after"?STAR.light:STAR.awake;
    x=55;y=22;
    if(state.phase==="after") extra="glow rising";
  }

  if(!file) return;

  const img=document.createElement("img");
  img.className="scene-star "+extra;
  img.src=file;
  img.alt="";
  img.style.left=x+"%";
  img.style.top=y+"%";
  img.onerror=()=>img.hidden=true;
  scene.append(img);
}

function renderDialogue(lines,onDone,lastLabel="계속하기"){
  const scene=background(
    state.phase==="epilogue"?"image_08.png":imageFile(state.stage)
  );

  chapter(
    scene,
    state.stage,
    state.phase==="epilogue"?"별이 올라간 자리":TITLES[state.stage]
  );

  addSceneStar(scene);
  $("screen").append(scene);
  playDialogue(scene,lines,onDone,lastLabel);
}

function playDialogue(scene,lines,onDone,lastLabel){
  const box=document.createElement("section");
  box.className="dialogue";
  box.innerHTML=`
    <div class="portrait"><img alt=""></div>
    <div class="dialogue-copy">
      <div class="speaker"></div>
      <div class="message"></div>
    </div>
    <button class="dialogue-next" hidden></button>`;
  scene.append(box);

  const portrait=box.querySelector(".portrait");
  const image=portrait.querySelector("img");
  const speaker=box.querySelector(".speaker");
  const message=box.querySelector(".message");
  const next=box.querySelector(".dialogue-next");

  let index=0;
  let complete=false;

  function show(){
    if(typingTimer) clearInterval(typingTimer);
    typingTimer=null;

    const data=lines[index];
    complete=false;
    next.hidden=true;
    message.textContent="";
    message.scrollTop=0;

    const narration=!data.name;
    box.classList.toggle("narration",narration);
    portrait.hidden=narration;
    speaker.hidden=narration;
    speaker.textContent=data.name||"";

    image.onload=()=>image.hidden=false;
    image.onerror=()=>image.hidden=true;
    image.hidden=false;

    if(data.name){
      image.src=data.name==="별"
        ? ((state.stage===6&&state.phase==="after")||state.phase==="epilogue"
            ? STAR.light:STAR.awake)
        : CHAR[data.name];
      image.alt=data.name;
    }else{
      image.removeAttribute("src");
      image.alt="";
    }

    const text=narration?`(${data.text})`:data.text;
    const chars=Array.from(text);
    let cursor=0;

    function finish(){
      if(typingTimer) clearInterval(typingTimer);
      typingTimer=null;
      message.textContent=text;
      complete=true;
      next.innerHTML=
        `${index===lines.length-1?escapeHTML(lastLabel):"다음"}<span class="arrow">›</span>`;
      next.hidden=false;
      finishTyping=null;
    }

    finishTyping=finish;

    if(reduceMotion){
      finish();
      return;
    }

    typingTimer=setInterval(()=>{
      if(cursor<chars.length){
        message.textContent+=chars[cursor++];
      }else finish();
    },25);
  }

  function advance(){
    if(!complete){
      if(finishTyping) finishTyping();
      return;
    }
    if(index<lines.length-1){
      index++;
      show();
    }else onDone();
  }

  message.onclick=()=>{
    if(!complete&&finishTyping) finishTyping();
  };
  next.onclick=advance;

  box.addEventListener("click",event=>{
    if(event.target===box||event.target===speaker) advance();
  });

  show();
}

function transitionToArrival(){
  if(transitioning) return;
  cleanup();

  const el=document.createElement("div");

  later(finish,reduceMotion?100:1600);
}

    circuitPuzzle
  ][state.stage](card);
}

/* =========================
   다이얼 공통
========================= */
function mountDials(container,chars,initial,onChange){
  let values=initial.slice();
  const tokens=values.map(()=>0);
  const elements=[];

  container.classList.add("dials");

  values.forEach((value,column)=>{
    const el=document.createElement("div");
    el.className="dial";
    el.innerHTML=`
      <button aria-label="${column+1}번째 글자 이전">▲</button>
      <div class="dial-face" tabindex="0" role="spinbutton"
           aria-label="${column+1}번째 글자"></div>
      <button aria-label="${column+1}번째 글자 다음">▼</button>`;

    const buttons=el.querySelectorAll("button");
    const face=el.querySelector(".dial-face");
    elements.push(face);

    function spin(delta){
      if(locked) return;
      values[column]=(values[column]+delta+chars.length)%chars.length;
      render();
      if(soundOn) tone(290+column*30,.025);
      if(onChange)onChange(values);
    }

    buttons[0].onclick=()=>{tokens[column]++;spin(-1)};
    buttons[1].onclick=()=>{tokens[column]++;spin(1)};

    face.onkeydown=event=>{
      if(event.key==="ArrowUp"||event.key==="ArrowDown"){
        event.preventDefault();
        tokens[column]++;
        spin(event.key==="ArrowUp"?-1:1);
      }
    };

    face.addEventListener("wheel",event=>{
      event.preventDefault();
      tokens[column]++;
      spin(event.deltaY>0?1:-1);
    },{passive:false});

    let startY=0,lastY=0,carry=0,lastDelta=0,dragging=false;

    face.onpointerdown=event=>{
      if(locked) return;
      tokens[column]++;
      dragging=true;
      startY=lastY=event.clientY;
      carry=0;
      lastDelta=0;
      face.setPointerCapture(event.pointerId);
    };

    face.onpointermove=event=>{
      if(!dragging) return;
      const delta=event.clientY-lastY;
      lastY=event.clientY;
      carry+=delta;
      lastDelta=delta;

      while(Math.abs(carry)>=22){
        const direction=carry>0?-1:1;
        spin(direction);
        carry+=carry>0?-22:22;
      }
    };

    function end(){
      if(!dragging)return;
      dragging=false;

      let speed=Math.abs(lastDelta)>5?Math.min(3,Math.abs(lastDelta)/8):0;
      const direction=lastDelta>0?-1:1;
      const token=++tokens[column];

      function momentum(){
        if(locked||tokens[column]!==token||speed<.55)return;
        spin(direction);
        speed*=.62;
        later(momentum,75);
      }
      if(Math.abs(lastY-startY)>25)momentum();
    }

    face.onpointerup=end;
    face.onpointercancel=()=>{dragging=false;tokens[column]++};
    container.append(el);
  });

  function render(){
    elements.forEach((el,i)=>{
      el.textContent=chars[values[i]];
      el.setAttribute("aria-valuetext",chars[values[i]]);
    });
  }

  render();

  return {
    word:()=>values.map(i=>chars[i]).join(""),
    stop:()=>tokens.forEach((_,i)=>tokens[i]++),
    reset:()=>{
      tokens.forEach((_,i)=>tokens[i]++);
      values=initial.slice();
      render();
    }
  };
}

/* =========================
   미션 2 · 끈 연결
========================= */
function threadPuzzle(card){
  card.innerHTML=`
    <p class="puzzle-instruction">새 끈을 표시 순서대로 이어줘.</p>
    <div class="paper-clue">1 → 4 → 2 → 3</div>
    <div class="thread-board" id="thread-board">
      <img class="thread-star" src="${STAR.sleep}" alt="잠든 별">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <polyline id="thread-line" fill="none" stroke="#bd5d7b"
                  stroke-width="1.8" stroke-linejoin="round"
                  stroke-linecap="round"></polyline>
      </svg>
    </div>
    <button class="assist" id="thread-assist">눌러서 연결하기</button>`;

  const board=$("thread-board");
  const image=board.querySelector("img");
  image.onerror=()=>image.hidden=true;

  const points=[
    {x:22,y:24},
    {x:78,y:24},
    {x:22,y:77},
    {x:78,y:77}
  ];
  const target=[0,3,1,2];
  let path=[];
  let dragging=false;
  let tapMode=false;

  points.forEach((point,index)=>{
    const node=document.createElement("div");
    node.className="thread-node";
    node.style.left=point.x+"%";
    node.style.top=point.y+"%";
    node.textContent=index+1;
    node.onclick=()=>{
      if(tapMode&&!locked) add(index);
    };
    board.append(node);
  });

  function draw(pointer){
    const list=path.map(index=>`${points[index].x},${points[index].y}`);
    if(pointer&&path.length)list.push(`${pointer.x},${pointer.y}`);
    $("thread-line").setAttribute("points",list.join(" "));
    board.querySelectorAll(".thread-node").forEach((node,index)=>{
      node.classList.toggle("done",path.includes(index));
    });
  }

  function reset(){
    path=[];
    dragging=false;
    draw();
    setStatus(tapMode?"1부터 순서대로 눌러줘.":"1에서 시작해서 끈을 이어줘.");
  }

  function add(index){
    if(path.includes(index))return;

    if(index!==target[path.length]){
      reset();
      setStatus("끈이 엉켰어. 1부터 다시 이어볼까?");
      return;
    }

    path.push(index);
    draw();

    if(path.length===target.length){
      dragging=false;
      win("튼튼하게 연결했어! 이제 트리에 걸어보자.");
    }else setStatus(`${path.length} / 4 연결`);
  }

  function position(event){
    const r=board.getBoundingClientRect();
    return {
      x:(event.clientX-r.left)/r.width*100,
      y:(event.clientY-r.top)/r.height*100
    };
  }

  function nearby(p){
    return points.findIndex(q=>Math.hypot(p.x-q.x,p.y-q.y)<10);
  }

  board.onpointerdown=event=>{
    if(tapMode||locked)return;
    const p=position(event);
    if(nearby(p)!==0)return;
    reset();
    dragging=true;
    board.setPointerCapture(event.pointerId);
    add(0);
  };

  board.onpointermove=event=>{
    if(!dragging||locked)return;
    const p=position(event);
    const hit=nearby(p);
    if(hit>=0)add(hit);
    if(dragging)draw(p);
  };

  board.onpointerup=()=>{
    if(!dragging)return;
    dragging=false;
    if(path.length<4)reset();
  };
  board.onpointercancel=reset;

  $("thread-assist").onclick=()=>{
    tapMode=!tapMode;
    board.classList.toggle("tap-mode",tapMode);
    $("thread-assist").textContent=tapMode?"드래그로 연결하기":"눌러서 연결하기";
    reset();
  };

  resetPuzzle=reset;
  reset();
}

/* =========================
   스크래치 공통
========================= */
function mountScratch(container,onReveal){
  const canvas=document.createElement("canvas");
  container.append(canvas);
  const ctx=canvas.getContext("2d",{willReadFrequently:true});

  let revealed=false,drawing=false,lastPoint=null;
  const cols=25,rows=18;
  const visited=new Set();

  function prepare(){
    const ratio=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(container.clientWidth*ratio);
    canvas.height=Math.round(container.clientHeight*ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.globalCompositeOperation="source-over";

    const w=container.clientWidth,h=container.clientHeight;
    const gradient=ctx.createLinearGradient(0,0,w,h);
    gradient.addColorStop(0,"#e2dce4");
    gradient.addColorStop(1,"#c5cadb");
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,w,h);

    ctx.strokeStyle="#ffffff60";
    ctx.lineWidth=1;
    for(let y=12;y<h;y+=23){
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(w,y-18);
      ctx.stroke();
    }

    ctx.fillStyle="#8a8295";
    ctx.font='18px "Gaegu", sans-serif';
    ctx.textAlign="center";
    ctx.fillText("손가락으로 살살 문질러줘",w/2,h/2);

    revealed=false;
    drawing=false;
    lastPoint=null;
    visited.clear();
    canvas.hidden=false;
  }

  function reveal(){
    if(revealed)return;
    revealed=true;
    drawing=false;
    canvas.hidden=true;
    onReveal();
  }

  function point(event){
    const r=canvas.getBoundingClientRect();
    return {x:event.clientX-r.left,y:event.clientY-r.top};
  }

  function mark(p){
    const w=container.clientWidth,h=container.clientHeight;
    const cellW=w/cols,cellH=h/rows;

    for(let yy=-2;yy<=2;yy++){
      for(let xx=-2;xx<=2;xx++){
        const cx=Math.floor(p.x/cellW)+xx;
        const cy=Math.floor(p.y/cellH)+yy;
        if(cx>=0&&cx<cols&&cy>=0&&cy<rows){
          const px=(cx+.5)*cellW,py=(cy+.5)*cellH;
          if(Math.hypot(px-p.x,py-p.y)<25)visited.add(cy*cols+cx);
        }
      }
    }

    if(visited.size/(cols*rows)>.47)reveal();
  }

  function scratch(p){
    if(revealed)return;
    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=46;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.beginPath();
    ctx.moveTo(lastPoint?lastPoint.x:p.x,lastPoint?lastPoint.y:p.y);
    ctx.lineTo(p.x+.01,p.y+.01);
    ctx.stroke();

    if(lastPoint){
      const distance=Math.hypot(p.x-lastPoint.x,p.y-lastPoint.y);
      const count=Math.max(1,Math.ceil(distance/10));
      for(let i=1;i<=count;i++){
        mark({
          x:lastPoint.x+(p.x-lastPoint.x)*i/count,
          y:lastPoint.y+(p.y-lastPoint.y)*i/count
        });
      }
    }else mark(p);

    lastPoint=p;
  }

  canvas.onpointerdown=event=>{
    if(locked||revealed)return;
    drawing=true;
    lastPoint=null;
    canvas.setPointerCapture(event.pointerId);
    scratch(point(event));
  };
  canvas.onpointermove=event=>{
    if(drawing)scratch(point(event));
  };
  canvas.onpointerup=canvas.onpointercancel=()=>{
    drawing=false;
    lastPoint=null;
  };

  prepare();
  return {reveal,reset:prepare};
}

function pianoPuzzle(card){

    [0,"도"],[2,"레"],[4,"미"],[5,"파"],

  ];
  const blackNotes=[

  ];

    if(note!==target[input.length]){
      busy=true;
      setStatus("그 음은 조금 달라. 첫 음부터 다시 해보자.");

      later(()=>{
        if(token!==roundToken)return;
        input=[];
        busy=false;
        render();
      },650);

      return;
    }

    input.push(note);
    render();
    setStatus(`${input.length} / ${target.length} 음 연주`);

    if(input.length===target.length){
      busy=true;
      setStatus("맞아, 이 노래야!");
      later(()=>win("별의 기억 속 노래를 연주했어.",800),700);
    }
  }

  keys.forEach(key=>{
    const note=Number(key.dataset.note);

    key.addEventListener("pointerdown",event=>{
      if(event.button!==0&&event.pointerType==="mouse")return;
      pointerSession=true;
      event.preventDefault();
      press(note,key);
    });

    key.addEventListener("click",event=>{
      if(event.detail===0&&!pointerSession)press(note,key);
      pointerSession=false;
    });

    key.addEventListener("keydown",event=>{
      if(event.key==="Enter"||event.key===" "){
        event.preventDefault();
        if(!event.repeat)press(note,key);
      }
    });
  });

  const keyboardMap={
    a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12
  };

  function computerKeyboard(event){
    if(!$("modal").hidden||!$("notebook").hidden)return;
    if(event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;
    if(["INPUT","SELECT","TEXTAREA","BUTTON"].includes(event.target.tagName))return;

    const note=keyboardMap[event.key.toLowerCase()];
    if(note===undefined)return;
    event.preventDefault();
    const key=keys.find(el=>Number(el.dataset.note)===note);
    if(key)press(note,key);
  }

  document.addEventListener("keydown",computerKeyboard);
  cleanups.push(()=>document.removeEventListener("keydown",computerKeyboard));

  resetPuzzle=()=>{
    roundToken++;
    input=[];
    busy=false;
    stopNotes();
    keys.forEach(key=>key.classList.remove("active"));
    render();
    setStatus("악보를 보고 첫 음부터 연주해 줘.");
  };

  render();
  setStatus("악보를 보고 첫 음부터 연주해 줘.");
}

/* =========================
   미션 6 · 소원 읽기
========================= */
function wishPuzzle(card){
  const wishes=[
    {
      text:"강아지랑<br>같이 살고 싶어요.",
      caption:"별이 가만히 메모를 들여다봤다. 어디선가 들어본 이야기 같았다."
    },
    {
      text:"이번 겨울에는<br>큰 눈사람을 만들고 싶어요.",
      caption:"별의 빛이 조금 밝아졌다. 오래전에도 눈 오는 날을 기다리는 목소리가 있었다."
    },
    {
      text:"내년에도 가족이랑<br>새로운 곳에 놀러 가고 싶어요.",
      caption:"새로운 이야기였다. 별은 마지막 줄까지 천천히 읽었다."
    }
  ];

  let index=0;
  let scratch=null;

  function show(){
    card.innerHTML=`
      <p class="puzzle-instruction">뿌연 화면을 닦아서<br>가지에 달린 소원을 읽어줘.</p>
      <div class="scratch-area" id="wish-scratch">
        <div class="scratch-under">
          <div class="wish-note">${wishes[index].text}</div>
        </div>
      </div>
      <button class="assist" id="wish-assist">소원 펼쳐보기</button>
      <div class="wish-caption" id="wish-caption"></div>
      <button class="primary puzzle-action" id="wish-next" hidden>
        ${index<2?"다음 소원":"다 읽었어"} <span class="arrow">›</span>
      </button>`;

    scratch=mountScratch($("wish-scratch"),()=>{
      $("wish-caption").textContent=`(${wishes[index].caption})`;
      setStatus(`${index+1} / 3 소원`);
      later(()=>{
        const button=$("wish-next");
        if(button)button.hidden=false;
      },850);
    });

    $("wish-assist").onclick=()=>scratch.reveal();
    $("wish-next").onclick=()=>{
      if(index<2){
        index++;
        show();
      }else win("세 장의 소원을 읽었어.");
    };

    setStatus(`${index+1}번째 소원을 읽어볼까?`);
  }

  resetPuzzle=()=>{index=0;show()};
  show();
}

/* =========================
   미션 7 · 조명 연결
========================= */
function circuitPuzzle(card){
  const U=1,R=2,D=4,L=8;
  const solution=[10,10,12,6,10,9,3,10,10];
  const initialTurns=[1,1,2,1,1,2,3,1,1];

  function rotate(mask){
    return ((mask<<1)&15)|((mask>>3)&1);
  }
  function turn(mask,count){
    for(let n=0;n<count;n++)mask=rotate(mask);
    return mask;
  }

  let cells=solution.map((mask,i)=>turn(mask,initialTurns[i]));
  let waveToken=0;
  let testing=false;

  card.innerHTML=`
    <p class="puzzle-instruction">조명 조각을 돌려서<br>전기가 별까지 흐르게 해줘.</p>
    <img class="final-star" id="circuit-star" src="${STAR.awake}" alt="별">
    <div class="circuit-labels"><span>시작 · 왼쪽 위</span><span>도착 · 오른쪽 아래</span></div>
    <div class="circuit-board" id="circuit-board"></div>
    <button id="circuit-check" class="primary puzzle-action">불 켜보기</button>`;

  $("circuit-star").onerror=event=>event.target.hidden=true;

  const board=$("circuit-board");

  function connected(){
    const visited=new Set();
    if(!(cells[0]&L))return visited;

    const queue=[0];
    visited.add(0);

    while(queue.length){
      const index=queue.shift();
      const row=Math.floor(index/3),col=index%3;
      const neighbors=[
        [U,index-3,D,row>0],
        [R,index+1,L,col<2],
        [D,index+3,U,row<2],
        [L,index-1,R,col>0]
      ];

      neighbors.forEach(([direction,next,opposite,valid])=>{
        if(valid&&(cells[index]&direction)&&(cells[next]&opposite)&&!visited.has(next)){
          visited.add(next);
          queue.push(next);
        }
      });
    }

    return visited;
  }

  function hasLeak(){
    for(let i=0;i<9;i++){
      const row=Math.floor(i/3),col=i%3;
      const checks=[
        [U,i-3,D,row>0,false],
        [R,i+1,L,col<2,i===8],
        [D,i+3,U,row<2,false],
        [L,i-1,R,col>0,i===0]
      ];

      for(const [direction,next,opposite,inside,allowed] of checks){
        if(!(cells[i]&direction))continue;
        if(!inside&&!allowed)return true;
        if(inside&&!(cells[next]&opposite))return true;
      }
    }
    return false;
  }

  function render(){
    board.innerHTML="";
    cells.forEach((mask,index)=>{
      const button=document.createElement("button");
      button.className="circuit-cell";
      button.setAttribute("aria-label",`${index+1}번째 조명 조각 돌리기`);
      button.innerHTML=`
        ${(mask&U)?'<span class="circuit-line up"></span>':""}
        ${(mask&R)?'<span class="circuit-line right"></span>':""}
        ${(mask&D)?'<span class="circuit-line down"></span>':""}
        ${(mask&L)?'<span class="circuit-line left"></span>':""}
        <span class="circuit-center"></span>`;

      button.onclick=()=>{
        if(locked||testing)return;
        cells[index]=rotate(cells[index]);
        render();
        preview();
        if(soundOn)tone(350,.035);
      };
      board.append(button);
    });
  }

  function preview(){
    const token=++waveToken;
    const reach=[...connected()];
    board.querySelectorAll(".circuit-cell").forEach(el=>el.classList.remove("lit"));

    reach.forEach((index,order)=>{
      later(()=>{
        if(token!==waveToken)return;
        board.children[index]?.classList.add("lit");
      },reduceMotion?0:order*90);
    });

    setStatus(`${reach.length} / 9 조각에 전기가 닿았어.`);
  }

  $("circuit-check").onclick=()=>{
    if(locked||testing)return;
    testing=true;
    $("circuit-check").disabled=true;
    preview();

    const complete=connected().size===9&&(cells[8]&R)&&!hasLeak();

    later(()=>{
      if(complete){
        locked=true;
        const star=$("circuit-star");
        star.src=STAR.light;
        star.classList.add("fly");
        setStatus("조명이 이어지자 별이 밝게 빛나기 시작했어.");
        successSound();
        later(()=>go("after"),reduceMotion?400:1700);
      }else{
        testing=false;
        $("circuit-check").disabled=false;
        fail("중간에 끊긴 곳이 있어.\n조각의 끝과 끝을 이어줘.");
      }
    },reduceMotion?100:950);
  };

  resetPuzzle=()=>{
    waveToken++;
    testing=false;
    cells=solution.map((mask,i)=>turn(mask,initialTurns[i]));
    $("circuit-check").disabled=false;
    render();
    preview();
  };

  render();
  preview();
}

/* =========================
   아웃트로
========================= */

  const card=document.createElement("section");

/* =========================
   모달·기억 노트
========================= */
function setInert(on){
  $("screen").inert=on;
  $("topbar").inert=on;
  $("debug").inert=on;
}

function openModal(
  title,
  description,
  onConfirm=null,
  confirmLabel="확인",
  onCancel=null,
  cancelLabel="취소"
){
  if(!$("notebook").hidden)return;

  lastFocus=document.activeElement;
  $("modal-title").textContent=title;
  $("modal-description").textContent=description;
  $("modal-confirm").textContent=confirmLabel;
  $("modal-cancel").textContent=cancelLabel;
  $("modal-cancel").hidden=!onCancel;

  $("modal-confirm").onclick=()=>{
    closeModal();
    if(onConfirm)onConfirm();
  };

  $("modal-cancel").onclick=()=>{
    closeModal();
    if(onCancel)onCancel();
  };

  $("modal").hidden=false;
  setInert(true);
  $("modal-confirm").focus();
}

function closeModal(){
  $("modal").hidden=true;
  setInert(false);
  if(lastFocus?.isConnected)lastFocus.focus();
}

function openNotebook(){
  if(!$("modal").hidden)return;
  lastFocus=document.activeElement;

  $("notebook-content").innerHTML=MEMORY_NAMES.map((title,index)=>{
    const found=state.earned.includes(index);
    return `
      <div class="memory-entry">
        <strong>${index+1}. ${found?escapeHTML(title):"아직 찾지 않은 기억"}</strong>
        <p>${found?escapeHTML(MEMORY_TEXTS[index]):"탐험을 계속하면 나타나요."}</p>
      </div>`;
  }).join("");

  $("notebook").hidden=false;
  setInert(true);
  $("notebook-close").focus();
}

function closeNotebook(){
  $("notebook").hidden=true;
  setInert(false);
  if(lastFocus?.isConnected)lastFocus.focus();
}

$("notebook-button").onclick=openNotebook;
$("notebook-close").onclick=closeNotebook;

document.addEventListener("keydown",event=>{
  const overlay=!$("modal").hidden
    ? $("modal")
    : !$("notebook").hidden?$("notebook"):null;

  if(!overlay)return;

  if(event.key==="Escape"){
    event.preventDefault();
    if(overlay.id==="notebook")closeNotebook();
    return;
  }

  if(event.key==="Tab"){
    const focusable=[...overlay.querySelectorAll("button:not([hidden])")];
    const first=focusable[0],last=focusable[focusable.length-1];

    if(event.shiftKey&&document.activeElement===first){
      event.preventDefault();
      last.focus();
    }else if(!event.shiftKey&&document.activeElement===last){
      event.preventDefault();
      first.focus();
    }
  }
});

function toast(text){
  $("toast").textContent=text;
  $("toast").hidden=false;
  later(()=>$("toast").hidden=true,2100);
}

/* =========================
   테스트·처음으로
========================= */
$("stage-select").innerHTML=TITLES.map((title,index)=>
  `<option value="${index}">${index+1}. ${escapeHTML(title)}</option>`
).join("");

$("jump-button").onclick=()=>{
  if(transitioning)return;
  go("puzzle",Number($("stage-select").value));
};

$("pass-button").onclick=()=>{
  if(transitioning)return;

  if(["guide","arrival","puzzle"].includes(state.phase)){
    go("after");
  }else if(state.phase==="after"){
    state.stage<6?go("guide",state.stage+1):go("epilogue");
  }else if(state.phase==="epilogue"){
    go("outro");
  }
};

$("home-button").onclick=()=>{
  openModal(
    "처음으로 돌아갈까?",
    "현재 진행 기록을 지우고 처음부터 시작해.",
    resetToIntro,
    "처음으로",
    ()=>{},
    "계속 탐험"
  );
};

/* 화면을 바꿀 때 남은 토스트도 함께 정리 */
const originalCleanup=cleanup;
cleanup=function(){
  $("toast").hidden=true;
  originalCleanup();
};

go("intro",0);
</script>
