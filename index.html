<style>
/* 선택 사항: 인터넷 연결 시 손글씨 폰트를 불러옵니다.
   불러오지 못해도 기본 폰트로 작동합니다. */
@import url("https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap");

:root{
  --paper:#fffdf2;
  --paper-line:#d9cfb633;
  --note-ink:#63364c;
}

/* 배경을 화면 전체에 배치 */
.vn-page{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#ffe9ee;
}
.vn-background{
  position:absolute;
  inset:0;
  overflow:hidden;
}
.vn-background .world{
  position:absolute;
  inset:0;
}
.vn-background>img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
.vn-fallback{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
  padding:60px 20px 190px;
  text-align:center;
  color:#a94770;
}
.vn-fallback .vn-large{
  font-size:105px;
  filter:drop-shadow(0 5px 0 #fff);
}
.vn-fallback small{
  background:#fffc;
  border:2px solid white;
  border-radius:14px;
  padding:8px 13px;
  font-size:12px;
}

/* 기존 리본 대신 작은 챕터 스티커 */
.vn-chapter{
  position:absolute;
  z-index:3;
  top:16px;
  left:14px;
  max-width:calc(100% - 28px);
  margin:0;
  padding:8px 13px;
  border:3px solid white;
  outline:1.5px solid #d875a0;
  border-radius:5px 15px 6px 14px;
  box-shadow:2px 4px #8f456526;
  background:#fffaf0ee;
  color:#a23d69;
  font-family:"Gaegu",sans-serif;
  font-size:19px;
  line-height:1.3;
  transform:rotate(-2deg);
}
.vn-chapter::before{
  content:"✦";
  margin-right:7px;
  color:#e6ab36;
}

/* 모눈 메모지 대화창 */
.vn-dialog{
  position:absolute;
  z-index:8;
  left:12px;
  right:12px;
  bottom:20px;
  height:clamp(150px,24dvh,185px);
  border:3px solid white;
  outline:1.5px solid #d7c8b8;
  border-radius:7px 12px 7px 12px;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--paper-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);
  background-size:18px 18px;
  box-shadow:0 7px 15px #62344622;
  animation:vn-dialog-in .25s ease-out both;
}
.vn-dialog::before{
  content:"";
  position:absolute;
  top:-8px;
  left:98px;
  right:15px;
  height:14px;
  background:
    radial-gradient(circle at 8px 7px,#d3bd8d 0 4px,transparent 4.6px)
    0 0/27px 14px repeat-x;
  pointer-events:none;
}

/* 캐릭터는 종이 바깥으로 돌출 */
.vn-portrait{
  position:absolute;
  z-index:2;
  left:-8px;
  bottom:31px;
  width:106px;
  height:155px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  pointer-events:none;
}
.vn-portrait::before{
  content:"";
  position:absolute;
  left:9px;
  bottom:8px;
  width:82px;
  height:91px;
  border:4px solid white;
  border-radius:16px 9px 18px 8px;
  background:#f8d8e7;
  transform:rotate(-9deg);
  box-shadow:2px 4px #88536a22;
}
.vn-portrait img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
  filter:drop-shadow(0 3px 1px #693c4c22);
}
.vn-portrait>span{
  position:relative;
  z-index:1;
  font-size:59px;
  padding-bottom:20px;
}

.vn-copy{
  position:absolute;
  inset:0;
  padding:11px 12px 9px 99px;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.vn-name{
  flex:none;
  align-self:flex-start;
  padding:2px 8px;
  background:#fce7f3;
  color:#b03569;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
}
.vn-text{
  flex:1;
  min-height:0;
  overflow-y:auto;
  margin:0;
  white-space:pre-wrap;
  word-break:keep-all;
  font-size:13px;
  line-height:1.7;
  color:var(--note-ink);
}
.vn-next{
  flex:none;
  align-self:flex-end;
  min-height:28px;
  border:0;
  background:transparent;
  padding:3px 5px;
  color:#a83d6b;
  font-size:12px;
  font-weight:bold;
}
.vn-next::after{
  content:"⌄";
  display:inline-block;
  margin-left:6px;
  color:#a7b74c;
  font-size:22px;
  vertical-align:middle;
  animation:vn-arrow .8s ease-in-out infinite;
}

/* 지문은 캐릭터 대사와 구분 */
.vn-dialog.is-narration .vn-portrait{
  display:none;
}
.vn-dialog.is-narration .vn-copy{
  padding-left:17px;
}
.vn-dialog.is-narration .vn-text{
  color:#707781;
  font-style:italic;
}
.vn-dialog.is-narration .vn-name{
  background:#eef0e5;
  color:#7a8361;
}
.vn-dialog.is-narration::before{
  left:16px;
}

/* 장소 안내도 배경 위에 표시 */
.vn-route-note{
  position:absolute;
  z-index:3;
  top:74px;
  left:16px;
  right:16px;
  padding:11px 13px;
  border:3px solid white;
  border-radius:5px 13px 7px 12px;
  background:#fffdf2ee;
  box-shadow:2px 4px #7443541a;
  color:#785865;
  font-size:12px;
  line-height:1.7;
  transform:rotate(1deg);
}
.vn-route-note strong{
  color:#bb4679;
}

/* 도입부 준비 메모 */
.vn-memo-screen{
  position:absolute;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:27px;
  background:
    radial-gradient(circle at 12% 15%,#f9a8d455,transparent 28%),
    radial-gradient(circle at 86% 82%,#a7f3d055,transparent 30%),
    #fff7e7;
}
.vn-memo-screen::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(#d4c7a52b 1px,transparent 1px),
    linear-gradient(90deg,#d4c7a52b 1px,transparent 1px);
  background-size:25px 25px;
}
.vn-memo-doodle{
  position:absolute;
  color:#e9b858;
  font-family:"Gaegu",sans-serif;
  font-size:58px;
  opacity:.7;
  pointer-events:none;
}
.vn-memo{
  position:relative;
  width:100%;
  padding:30px 20px 22px;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(
      transparent 0 31px,
      #d3c5aa44 32px,
      transparent 33px
    );
  border:3px solid white;
  border-radius:3px 12px 4px 9px;
  box-shadow:5px 10px 0 #dca4b326,0 15px 30px #79525c18;
  transform:rotate(-3deg);
  animation:vn-memo-in .55s cubic-bezier(.2,.8,.25,1) both;
}
.vn-memo::before,
.vn-memo::after{
  content:"";
  position:absolute;
  top:-13px;
  width:72px;
  height:25px;
  background:#f4d5b4bb;
  border:1px solid #ffffff77;
  transform:rotate(-12deg);
}
.vn-memo::before{left:13px}
.vn-memo::after{right:10px;transform:rotate(14deg)}
.vn-memo h1{
  margin:0 0 20px;
  font-family:"Gaegu",sans-serif;
  font-size:29px;
  color:#b74676;
}
.vn-memo ul{
  margin:0;
  padding:0;
  list-style:none;
  font-family:"Gaegu",sans-serif;
  font-size:23px;
  line-height:1.8;
  color:#795264;
}
.vn-memo li{
  opacity:0;
  animation:vn-list-in .35s both;
}
.vn-memo li:nth-child(1){animation-delay:.35s}
.vn-memo li:nth-child(2){animation-delay:.55s}
.vn-memo li:nth-child(3){animation-delay:.75s}
.vn-memo .scribble{
  margin:18px 0;
  font-family:"Gaegu",sans-serif;
  font-size:23px;
  color:#df7d9c;
  transform:rotate(-3deg);
}
.vn-memo .primary{
  width:100%;
  margin-top:10px;
}

/* 챕터 전환 */
.vn-transition{
  position:absolute;
  inset:0;
  z-index:35;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  background:#e6f5fa;
}
.vn-transition::before,
.vn-transition::after{
  content:"";
  position:absolute;
  width:160%;
  height:50%;
  left:-30%;
  border-radius:50%;
  background:#fff;
  transform:rotate(-23deg);
}
.vn-transition::before{
  top:-18%;
  animation:vn-cloud-a 2s ease-in-out both;
}
.vn-transition::after{
  bottom:-18%;
  background:#fff9;
  animation:vn-cloud-b 2s ease-in-out both;
}
.vn-transition-label{
  position:relative;
  z-index:2;
  color:#8cab75;
  font-size:12px;
  letter-spacing:2px;
}
.vn-transition h1{
  position:relative;
  z-index:2;
  margin:0 22px;
  padding:13px 22px;
  border:3px solid white;
  outline:2px solid #b8c892;
  border-radius:28% 18% 24% 14%;
  background:#e7edc9;
  color:#775367;
  text-align:center;
  font-family:"Gaegu",sans-serif;
  font-size:29px;
  line-height:1.4;
  box-shadow:0 5px #a7b47b33;
}
.vn-travel-row{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  width:100%;
  animation:vn-travel 1.9s ease-in-out both;
}
.vn-travel-avatar{
  position:relative;
  width:116px;
  height:146px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:vn-step .42s ease-in-out infinite;
}
.vn-travel-avatar img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
}
.vn-travel-avatar span{font-size:65px}
.vn-travel-star{
  font-size:36px;
  animation:vn-star-float .8s ease-in-out infinite;
}
.vn-transition-skip{
  position:absolute;
  z-index:3;
  bottom:20px;
  right:15px;
  padding:7px 12px;
  border:2px solid white;
  border-radius:18px;
  background:#fff9;
  color:#8c7583;
  font-size:11px;
}

/* 기억 노트 */
.vn-notebook{
  position:absolute;
  inset:0;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:#67445a88;
  backdrop-filter:blur(3px);
}
.vn-notebook-paper{
  position:relative;
  width:100%;
  max-height:90%;
  overflow:auto;
  padding:20px 16px;
  background:var(--paper);
  background-image:
    linear-gradient(var(--paper-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);
  background-size:20px 20px;
  border:4px solid white;
  border-radius:6px 17px 6px 15px;
  box-shadow:0 9px #b65e8533;
}
.vn-notebook-paper h1{
  margin:0 0 5px;
  font-family:"Gaegu",sans-serif;
  font-size:29px;
  color:#b24576;
}
.vn-notebook-paper>p{
  margin:0 0 16px;
  font-size:11px;
  line-height:1.6;
  color:#8f7580;
}
.vn-memory-item{
  margin:0 0 12px;
  padding:11px 12px;
  border:2px solid white;
  outline:1px solid #e7bfce;
  border-radius:4px 11px 5px 9px;
  background:#fff5f8;
  transform:rotate(-1deg);
}
.vn-memory-item:nth-child(even){
  background:#f2f7e7;
  transform:rotate(1deg);
}
.vn-memory-item strong{
  display:block;
  margin-bottom:5px;
  color:#a24771;
  font-family:"Gaegu",sans-serif;
  font-size:20px;
}
.vn-memory-item p{
  margin:0;
  font-size:12px;
  line-height:1.7;
  color:#755e68;
}
.vn-memory-item.is-locked{
  opacity:.45;
  background:#eeeae4;
}
.vn-toast{
  position:absolute;
  z-index:25;
  top:17px;
  left:50%;
  width:max-content;
  max-width:90%;
  transform:translateX(-50%);
  padding:9px 14px;
  background:#fffde8;
  border:3px solid white;
  outline:1px solid #e8c36c;
  border-radius:18px;
  box-shadow:0 4px #966c2722;
  color:#aa7b32;
  text-align:center;
  font-size:12px;
  animation:vn-toast-in .35s ease-out both;
}

/* 기존 퍼즐의 조작 영역과 버튼 반응 보완 */
.play-world .ribbon{
  font-family:"Gaegu",sans-serif;
  font-size:19px;
}
.play-world .primary{
  transition:transform .12s,filter .12s;
}
.play-world .primary:hover:not(:disabled){
  filter:brightness(1.05);
}
.play-world .round-btn{
  transition:transform .12s;
}
.play-world .round-btn:active{
  transform:scale(.96);
}

@keyframes vn-dialog-in{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes vn-arrow{
  50%{transform:translateY(3px)}
}
@keyframes vn-memo-in{
  from{opacity:0;transform:translateY(45px) rotate(-7deg)}
  to{opacity:1;transform:translateY(0) rotate(-3deg)}
}
@keyframes vn-list-in{
  from{opacity:0;transform:translateX(-8px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes vn-cloud-a{
  from{transform:translateX(-15%) rotate(-23deg)}
  to{transform:translateX(15%) rotate(-23deg)}
}
@keyframes vn-cloud-b{
  from{transform:translateX(15%) rotate(-23deg)}
  to{transform:translateX(-15%) rotate(-23deg)}
}
@keyframes vn-travel{
  from{transform:translateX(-35px)}
  to{transform:translateX(35px)}
}
@keyframes vn-step{
  50%{transform:translateY(-5px) rotate(2deg)}
}
@keyframes vn-star-float{
  50%{transform:translateY(-12px) rotate(7deg)}
}
@keyframes vn-toast-in{
  from{opacity:0;margin-top:-10px}
  to{opacity:1;margin-top:0}
}
@media(max-height:650px){
  .vn-dialog{
    bottom:12px;
    height:145px;
  }
  .vn-portrait{
    width:96px;
    height:137px;
    bottom:34px;
  }
  .vn-copy{padding-left:89px}
  .vn-memo{padding:24px 17px 18px}
  .vn-memo h1{font-size:25px;margin-bottom:13px}
  .vn-memo ul{font-size:21px}
  .vn-memo .scribble{font-size:20px;margin:12px 0}
}
@media(max-width:360px){
  .vn-text{font-size:12px}
  .vn-copy{padding-right:9px}
}
@media(prefers-reduced-motion:reduce){
  .vn-memo li{opacity:1}
}
</style>

<script>
/*
========================================================
장면 연출 추가 패치

기준:
직전에 제공한 SAVE_KEY="seoul-star-scene-v6" 버전.

유지:
- 일곱 문제
- 합성 배경음악
- 인트로 타이틀 좌표
- 인트로 투명 시작 버튼 좌표
- 테스트 메뉴

추가:
- 전체 이미지 위 대화창
- 대화창 밖으로 나온 캐릭터
- 준비 메모
- 미션 사이 이동 전환
- 기억 조각 수집 노트

새 이미지 없이 작동합니다.
========================================================
*/

(()=>{
  const baseNavigate = navigate;
  const baseRenderPuzzle = renderPuzzle;

  const NOTE_SAVE_KEY = SAVE_KEY+"-memories";
  const memoryNames = [
    "상자에서 찾은 별",
    "잠에서 깨어난 별",
    "창밖의 서울",
    "침대맡의 자리",
    "매일 들려오던 노래",
    "소망나무의 이야기",
    "별의 새로운 자리"
  ];
  const memoryTexts = [
    "장식 상자 속에 끈이 끊어진 별 하나가 들어 있었다.",
    "새 끈을 달아 트리에 걸었더니 별이 깨어났다.",
    "별은 물 위로 길게 비치던 서울의 불빛을 기억했다.",
    "크리스마스가 지나도 별을 침대맡에 두던 아이가 있었다.",
    "아이는 잠들기 전에 노래와 하루 이야기를 들려주었다.",
    "소망나무에는 별이 오래전 듣던 이야기와 닮은 소원이 가득했다.",
    "읽고 싶은 이야기가 많아진 별은 조금 더 높은 곳으로 떠올랐다."
  ];
  const transitionLines = [
    "장식 상자를 찾아서!",
    "이번엔 트리를 꾸며볼까?",
    "서울을 한눈에!",
    "책 사이를 뒤적뒤적",
    "기억 속 멜로디를 찾아서",
    "소원이 주렁주렁!",
    "다시 트리로 출발!"
  ];

  let earned = new Set();
  let preparing = false;
  let moving = false;
  let notebook = null;
  let notebookFocus = null;

  try{
    const data = JSON.parse(localStorage.getItem(NOTE_SAVE_KEY));
    if(Array.isArray(data)){
      earned = new Set(data.filter(n=>Number.isInteger(n)&&n>=0&&n<7));
    }
  }catch(e){}

  /*
  기존 진행 저장과 기억 노트 저장이 다를 경우,
  이전에 완료한 미션까지만 복원합니다.
  */
  if(resumePoint){
    for(let i=0;i<resumePoint.stage;i++) earned.add(i);

    if(["after","epilogue","outro"].includes(resumePoint.phase)){
      earned.add(resumePoint.stage);
    }
  }

  function saveMemories(){
    try{
      localStorage.setItem(NOTE_SAVE_KEY,JSON.stringify([...earned]));
    }catch(e){}
  }

  function resetMemories(){
    earned.clear();
    saveMemories();
    updateNotebookButton();
  }

  function updateNotebookButton(){
    const button=document.getElementById("memory-note-button");
    if(button){
      button.textContent=`▤ ${earned.size}/7`;
      button.setAttribute("aria-label",`기억 노트 열기. 기억 ${earned.size}개`);
    }
  }

  /* 상단에 작은 기억 노트 버튼 추가 */
  const noteButton=document.createElement("button");
  noteButton.id="memory-note-button";
  noteButton.className="tool";
  noteButton.onclick=openNotebook;
  document.querySelector(".tools").insertBefore(noteButton,$("home"));
  updateNotebookButton();

  function background(file,label,stage){
    const type=WORLDS[stage]||"tree";
    const emoji=["📦","⭐","🌆","📚","🎵","🌳","🌟"][stage]||"⭐";

    return `
      <div class="vn-background">
        <div class="world ${type}">
          ${decorativeWorld(type)}
        </div>
        <div class="vn-fallback">
          <span class="vn-large">${emoji}</span>
          <small>${esc(label)}</small>
        </div>
        <img src="${esc(file)}"
             alt="${esc(label)}"
             onerror="this.hidden=true">
      </div>`;
  }

  function dialogueMarkup(){
    return `
      <div class="vn-dialog" id="vn-dialog">
        <div class="vn-portrait">
          <span id="vn-avatar-fallback"></span>
          <img id="vn-avatar" alt="" onerror="this.hidden=true">
        </div>
        <div class="vn-copy">
          <div class="vn-name" id="vn-name"></div>
          <div class="vn-text" id="vn-text"></div>
          <button class="vn-next" id="vn-next" hidden>다음</button>
        </div>
      </div>`;
  }

  /* 전체 배경 위에 대화창을 띄우도록 교체 */
  renderDialogue=function(lines,done,title,image){
    let index=0;

    $("screen").innerHTML=`
      <section class="vn-page">
        ${background(image,title,state.stage)}
        <h1 class="vn-chapter">${esc(title)}</h1>
        ${dialogueMarkup()}
      </section>`;

    function show(){
      const line=lines[index];
      const character=CHAR[line.name];
      const narration=line.kind==="note";

      $("vn-dialog").classList.toggle("is-narration",narration);
      $("vn-name").textContent=narration?"이야기":line.name;

      $("vn-avatar").hidden=true;
      $("vn-avatar-fallback").textContent=character?.emoji||"";

      if(character){
        $("vn-avatar").src=character.file;
        $("vn-avatar").alt=line.name;
        $("vn-avatar").hidden=false;
      }

      $("vn-next").textContent=
        index===lines.length-1
          ? state.phase==="before"
            ? "어디로 갈까?"
            : "계속하기"
          : "다음";

      typeText(
        $("vn-text"),
        narration?`(${line.text})`:line.text,
        $("vn-next")
      );
    }

    $("vn-text").onclick=()=>finishTyping?.();

    $("vn-next").onclick=()=>{
      if(finishTyping){
        finishTyping();
        return;
      }

      if(index<lines.length-1){
        index++;
        show();
      }else{
        done();
      }
    };

    show();
  };

  /* 장소 안내도 사진 위 대화창으로 교체 */
  renderGuide=function(){
    const route=ROUTES[state.stage];

    $("screen").innerHTML=`
      <section class="vn-page">
        ${background(
          `route_0${state.stage+1}.png`,
          route.place,
          state.stage
        )}
        <h1 class="vn-chapter">${esc(route.place)}</h1>

        <div class="vn-route-note">
          <strong>이쪽으로 가볼까?</strong><br>
          ${esc(route.info)}
        </div>

        ${dialogueMarkup()}
      </section>`;

    $("vn-name").textContent="해치";
    $("vn-avatar-fallback").textContent=CHAR["해치"].emoji;
    $("vn-avatar").src=CHAR["해치"].file;
    $("vn-avatar").alt="해치";

    $("vn-next").textContent="도착했어! 시작";
    $("vn-next").onclick=()=>navigate("puzzle");
    $("vn-text").onclick=()=>finishTyping?.();

    typeText(
      $("vn-text"),
      route.line,
      $("vn-next")
    );
  };

  /* 퍼즐은 기존 조작과 판정을 유지 */
  renderPuzzle=function(){
    baseRenderPuzzle();

    const ribbon=$("screen").querySelector(".ribbon");
    if(ribbon){
      ribbon.style.fontFamily='"Gaegu",sans-serif';
    }
  };

  /* 도입부 메모 */
  function showPreparation(done){
    cleanScreen();
    setChrome(false);
    $("pass").disabled=true;
    preparing=true;

    $("screen").innerHTML=`
      <section class="vn-memo-screen">
        <span class="vn-memo-doodle"
              style="left:4%;top:7%;transform:rotate(-17deg)">☆</span>
        <span class="vn-memo-doodle"
              style="right:4%;bottom:8%;color:#a7c9ba">♫</span>

        <div class="vn-memo">
          <h1>해치의 크리스마스 준비!</h1>
          <ul>
            <li>□ 장식 상자 찾기</li>
            <li>□ 트리 예쁘게 꾸미기</li>
            <li>□ 다 같이 간식 먹기!</li>
          </ul>

          <p class="scribble">
            별 장식은 어디 뒀더라……?<br>
            분명 여기 있었는데!
          </p>

          <button class="primary" id="vn-memo-start">
            상자부터 찾으러 가자!
          </button>
        </div>
      </section>`;

    $("vn-memo-start").onclick=()=>{
      if(!preparing) return;
      preparing=false;
      done();
    };

    cleanups.push(()=>{preparing=false});
  }

  /* 챕터 사이 짧은 이동 전환 */
  function showTransition(stage,done,epilogue=false){
    cleanScreen();
    moving=true;
    $("pass").disabled=true;

    const character=CHAR["해치"];
    const title=epilogue
      ? "별은 어디까지 올라갈까?"
      : transitionLines[stage];

    $("screen").innerHTML=`
      <section class="vn-transition">
        <div class="vn-transition-label">
          ${epilogue?"작은 이야기의 끝":"다음 이야기"}
        </div>

        <h1>${esc(title)}</h1>

        <div class="vn-travel-row">
          <div class="vn-travel-avatar">
            <span>${character.emoji}</span>
            <img src="${character.file}" alt="이동하는 해치"
                 onerror="this.hidden=true">
          </div>
          <div class="vn-travel-star">⭐</div>
        </div>

        <button class="vn-transition-skip" id="vn-transition-skip">
          건너뛰기 ›
        </button>
      </section>`;

    let completed=false;

    function finish(){
      if(completed) return;
      completed=true;
      moving=false;
      done();
    }

    $("vn-transition-skip").onclick=finish;

    later(finish,reduced()?350:1900);

    cleanups.push(()=>{
      completed=true;
      moving=false;
    });
  }

  /* 기억 획득 표시 */
  function memoryToast(index){
    const toast=document.createElement("button");
    toast.className="vn-toast";
    toast.textContent=`✦ 기억 노트에 「${memoryNames[index]}」 추가!`;
    toast.onclick=openNotebook;
    $("screen").append(toast);

    later(()=>{
      if(toast.isConnected) toast.remove();
    },2300);
  }

  /* 화면 이동에 메모·전환·기억 수집 연결 */
  navigate=function(phase,stage=state.stage){
    if(preparing||moving) return;

    const from={...state};

    if(phase==="intro"){
      resetMemories();
      baseNavigate(phase,stage);
      return;
    }

    if(
      phase==="before" &&
      stage===0 &&
      from.phase==="intro"
    ){
      resetMemories();

      showPreparation(()=>{
        baseNavigate("before",0);
      });
      return;
    }

    if(
      from.phase==="after" &&
      (
        (phase==="before" && stage>from.stage) ||
        phase==="epilogue"
      )
    ){
      showTransition(
        stage,
        ()=>baseNavigate(phase,stage),
        phase==="epilogue"
      );
      return;
    }

    const newMemory=phase==="after"&&!earned.has(stage);

    if(phase==="after"){
      earned.add(stage);
      saveMemories();
      updateNotebookButton();
    }

    baseNavigate(phase,stage);

    if(newMemory){
      memoryToast(stage);
    }
  };

  /* 기억 노트: 기존 모달과 별도로 열고 닫기 */
  function openNotebook(){
    if(notebook || !$("modal").hidden || preparing || moving) return;

    notebookFocus=document.activeElement;
    notebook=document.createElement("section");
    notebook.className="vn-notebook";
    notebook.setAttribute("role","dialog");
    notebook.setAttribute("aria-modal","true");
    notebook.setAttribute("aria-labelledby","vn-notebook-title");

    notebook.innerHTML=`
      <div class="vn-notebook-paper">
        <h1 id="vn-notebook-title">별의 기억 노트</h1>
        <p>함께 찾은 이야기가 한 장씩 모이고 있어요. ${earned.size}/7</p>

        ${memoryNames.map((name,index)=>{
          const unlocked=earned.has(index);

          return `
            <article class="vn-memory-item ${unlocked?"":"is-locked"}">
              <strong>
                ${unlocked?"✦":"○"} ${unlocked?esc(name):"아직 찾지 못한 기억"}
              </strong>
              <p>
                ${unlocked
                  ? esc(memoryTexts[index])
                  : `${index+1}번째 미션에서 만나볼 수 있어요.`}
              </p>
            </article>`;
        }).join("")}

        <button class="primary" id="vn-notebook-close" style="width:100%">
          탐험으로 돌아가기
        </button>
      </div>`;

    $("app").append(notebook);
    $("screen").inert=true;
    $("topbar").inert=true;
    $("debug").inert=true;

    $("vn-notebook-close").onclick=closeNotebook;

    notebook.onclick=e=>{
      if(e.target===notebook) closeNotebook();
    };

    $("vn-notebook-close").focus();
  }

  function closeNotebook(){
    if(!notebook) return;

    notebook.remove();
    notebook=null;

    $("screen").inert=false;
    $("topbar").inert=false;
    $("debug").inert=false;

    if(notebookFocus?.isConnected) notebookFocus.focus();
  }

  document.addEventListener("keydown",e=>{
    if(!notebook) return;

    if(e.key==="Escape"){
      e.preventDefault();
      closeNotebook();
    }
    if(e.key==="Tab"){
      e.preventDefault();
      $("vn-notebook-close").focus();
    }
  });

})();
</script>
