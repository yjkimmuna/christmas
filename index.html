<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>해치 크리스마스: 우리의 첫 겨울</title>
  <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-bg: #fff1f5;
      --card-white: #ffffff;
      --soft-pink: #fce7f3;
      --pink-primary: #f472b6;
      --pink-deep: #db2777;
      --crimson-red: #dc2626;
      --pine-green: #15803d;
      --pine-dark: #14532d;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --border-pink: #fbcfe8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: 'DungGeunMo', monospace, sans-serif !important;
      letter-spacing: 1.5px;
    }

    body {
      background-color: #fce7f3;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow: hidden;
      padding-top: 0;
    }

    #app {
      position: relative;
      width: 100vw;
      max-width: 440px;
      aspect-ratio: 1 / 1.8;
      max-height: 98vh;
      background: var(--pink-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 4px solid var(--pink-deep);
      box-shadow: 4px 4px 0px #831843, 8px 8px 0px rgba(219, 39, 119, 0.3);
      border-radius: 12px;
    }

    .screen {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      flex-direction: column;
      background: var(--pink-bg);
      overflow: hidden;
    }
    .screen.active {
      display: flex;
    }

    /* 1. 인트로 화면 */
    #screen-intro {
      background: #000;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    .intro-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 1;
    }

    .intro-header-box {
      position: absolute;
      top: 15%;
      left: 10%;
      right: 10%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .intro-badge {
      background: var(--pine-green);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1.5px solid var(--pine-dark);
    }

    .intro-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.3;
      text-shadow: 3px 3px 0px var(--pink-deep), 6px 6px 0px #831843;
      letter-spacing: 2.5px;
    }

    .intro-transparent-btn {
      position: absolute;
      bottom: 12%;
      left: 18%;
      right: 18%;
      height: 65px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 20;
    }

    /* 2. 난이도 및 캐릭터 선택 화면 (여백 문제 해결) */
    #screen-setup {
      justify-content: flex-start;
      align-items: center;
      padding: 12px 14px;
      text-align: center;
      gap: 8px;
      overflow-y: auto;
    }

    /* 3. 게임 플레이 화면 공통 */
    #screen-game {
      flex-direction: column;
      background: #fff1f5;
    }

    header {
      padding: 8px 14px;
      background: #ffffff;
      border-bottom: 3px solid var(--pink-deep);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .badge {
      background: var(--pine-green);
      color: #fff;
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 2px solid var(--pine-dark);
      letter-spacing: 1px;
    }
    .pink-tag {
      background: var(--soft-pink);
      color: var(--pink-deep);
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 2px solid var(--pink-primary);
      font-weight: bold;
    }
    .reset-btn {
      background: #f3f4f6;
      border: 2px solid #9ca3af;
      color: var(--text-muted);
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .content {
      flex: 1;
      padding: 10px 12px 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .story-page-box {
      background: #ffffff;
      border: 3px solid var(--pink-deep);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 4px 4px 0px rgba(219, 39, 119, 0.2);
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .quest-title-bar {
      width: 100%;
      background: var(--pine-green);
      color: #ffffff;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      border-bottom: 3px dashed #86efac;
      flex-shrink: 0;
    }

    .space-image-area {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 260px;
      background: #2b1117;
      border-bottom: 3px solid var(--pink-deep);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .space-image-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 채팅 영역 정렬 및 여백 수정 */
    .layout-chat-box {
      display: flex;
      width: 100%;
      height: 115px;
      background: #ffffff;
      border-bottom: 3px dashed var(--pink-primary);
      flex-shrink: 0;
      cursor: pointer;
    }

    .layout-profile-area {
      width: 28%;
      background: #fdf2f8;
      border-right: 3px solid var(--pink-deep);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      overflow: hidden;
    }
    .layout-avatar-fill {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .layout-avatar-fill img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .layout-msg-area {
      width: 72%;
      background: #fff1f5;
      color: var(--text-dark);
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      overflow-y: auto;
      word-break: break-all;
    }
    .layout-msg-sender {
      font-size: 12px;
      font-weight: bold;
      color: var(--pink-deep);
      margin-bottom: 4px;
    }
    .layout-msg-content {
      flex: 1;
      display: flex;
      align-items: center;
      width: 100%;
      position: relative;
    }
    .next-indicator {
      position: absolute;
      right: 2px;
      bottom: 2px;
      font-size: 14px;
      color: var(--pink-deep);
      animation: blinkIndicator 0.8s infinite alternate;
      display: none;
    }
    @keyframes blinkIndicator {
      0% { opacity: 0.2; transform: translateX(0); }
      100% { opacity: 1; transform: translateX(3px); }
    }

    .sub-page-box {
      background: #ffffff;
      border: 3px solid var(--pink-deep);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 4px 4px 0px rgba(219, 39, 119, 0.2);
      overflow: hidden;
      flex-shrink: 0;
      width: 100%;
    }

    .quest-inner-content {
      width: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .action-btn {
      width: 100%; padding: 12px; background: var(--crimson-red); color: #ffffff;
      border: 3px solid #7f1d1d; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 0px #7f1d1d;
      flex-shrink: 0;
    }
    .action-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #7f1d1d; }

    details {
      width: 100%; background: #f0fdf4; border: 2px solid var(--pine-green);
      padding: 10px 12px; border-radius: 6px; font-size: 13px; color: var(--pine-dark); text-align: left;
    }
    summary { cursor: pointer; font-weight: bold; color: var(--pine-green); }

    .cheat-btn {
      width: 100%;
      padding: 8px;
      background: #fef08a;
      color: #854d0e;
      border: 2px dashed #ca8a04;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .cheat-btn:hover { background: #fde047; }

    /* 1번 미션 레이아웃 */
    .wire-top-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 6px;
    }
    .wire-top-node {
      background: #fff;
      border: 2px solid var(--pine-dark);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .wire-top-node.selected { background: var(--soft-pink); border-color: var(--crimson-red); }

    .wire-bottom-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .wire-bottom-node {
      background: #fff;
      border: 2px solid var(--pine-dark);
      border-radius: 6px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .dial-container { display: flex; gap: 6px; justify-content: center; width: 100%; }
    .dial-column { display: flex; flex-direction: column; align-items: center; background: #fff; border: 2px solid var(--pink-deep); border-radius: 6px; padding: 4px; }
    .dial-arrow { width: 36px; height: 26px; background: #fff; border: 1.5px solid var(--pink-deep); border-radius: 4px; font-size: 11px; font-weight: bold; color: var(--pink-deep); cursor: pointer; }
    .dial-drum { display: flex; flex-direction: column; align-items: center; margin: 3px 0; }
    .sub-letter { font-size: 12px; font-weight: bold; color: #9ca3af; height: 16px; opacity: 0.6; }
    .main-letter { width: 40px; height: 44px; background: var(--pink-deep); color: #fff; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; margin: 2px 0; }

    .swipe-card { width: 100%; background: #fff5f8; border: 2px solid var(--pink-primary); border-radius: 8px; padding: 18px; font-size: 16px; font-weight: bold; min-height: 85px; display: flex; align-items: center; justify-content: center; text-align: center; }

    /* 미션 3 참/거짓 버튼 크기 조절 */
    .ox-btn-container {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }
    .ox-btn {
      flex: 1;
      max-width: 140px;
      padding: 14px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      border: 3px solid #7f1d1d;
      background: var(--crimson-red);
      box-shadow: 0 4px 0px #7f1d1d;
    }
    .ox-btn.true-btn {
      background: var(--pine-green);
      border-color: var(--pine-dark);
      box-shadow: 0 4px 0px var(--pine-dark);
    }
    .ox-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #7f1d1d; }

    /* 4번 전등 스위치 화면 */
    .switch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 300px; margin: 0 auto; }
