<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1f5">
<title>해치 크리스마스 — 오래된 별의 자리</title>
<style>
:root{
  --bg:#fff1f5;--white:#fff;--soft:#fce7f3;
  --pink:#f472b6;--deep:#db2777;--red:#dc2626;
  --green:#15803d;--dark-green:#14532d;
  --text:#1f2937;--muted:#6b7280;--border:#fbcfe8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"DungGeunMo","Courier New",monospace,sans-serif;
  display:flex;justify-content:center;min-height:100vh;min-height:100dvh;
}
button,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,select:focus-visible{
  outline:3px solid #0369a1;outline-offset:3px;
}
[hidden]{display:none!important}
#app{
  width:min(100%,440px);height:min(100dvh,726px);
  height:min(100svh,726px);
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  border:4px solid var(--deep);border-radius:0 0 12px 12px;
  box-shadow:4px 4px #831843,8px 8px #db277733;
  background:var(--bg);
}
@supports(height:100dvh){
  #app{height:min(100dvh,726px)}
}
.topbar{
  flex:none;min-height:44px;padding:6px 9px;background:white;
  border-bottom:3px solid var(--deep);
  display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.badge{
  display:inline-block;background:var(--green);color:white;
  border:2px solid var(--dark-green);border-radius:4px;
  padding:4px 6px;font-size:11px;font-weight:bold;white-space:nowrap;
}
.tools{display:flex;gap:5px}
.small-btn{
  border:2px solid var(--pink);border-radius:5px;background:#fff5f8;
  color:var(--deep);padding:5px 6px;font-size:10px;font-weight:bold;
}
.screen{
  flex:1;min-height:0;display:flex;flex-direction:column;
  padding:10px;gap:8px;overflow:hidden;
}
.card{
  min-height:0;flex:1;display:flex;flex-direction:column;
  background:white;border:3px solid var(--deep);border-radius:8px;
  overflow:hidden;box-shadow:3px 3px #db277733;
}
.chapter{
  flex:none;background:var(--green);color:white;
  padding:9px 10px;text-align:center;font-size:14px;line-height:1.45;
  border-bottom:3px dashed #86efac;
}
.scene{
  flex:1;min-height:0;position:relative;background:#fff7ed;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.scene>img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;
}
.fallback{
  padding:18px;text-align:center;line-height:1.8;color:#9d174d;
}
.scene-emoji{font-size:clamp(50px,16vw,90px);display:block}
.scene-label{font-size:13px;font-weight:bold}
.scene-caption{font-size:11px;color:var(--muted);margin-top:8px}
.dialogue{
  flex:none;display:grid;grid-template-columns:3fr 7fr;
  min-height:140px;height:clamp(140px,25dvh,180px);
  border-top:3px solid var(--deep);
}
.portrait{
  min-width:0;background:#fdf2f8;border-right:3px solid var(--deep);
  position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.portrait img{
  position:absolute;width:100%;height:100%;object-fit:contain;z-index:1;
}
.portrait span{font-size:42px}
.chat{
  min-width:0;min-height:0;padding:9px 10px;background:var(--bg);
  display:flex;flex-direction:column;gap:5px;
}
.sender{font-size:12px;font-weight:bold;color:var(--deep)}
.message{
  flex:1;min-height:0;overflow-y:auto;font-size:13px;
  line-height:1.65;word-break:keep-all;white-space:pre-wrap;
}
.message.narration{color:#64748b;font-style:italic}
.next-btn{
  flex:none;align-self:flex-end;border:0;border-radius:4px;
  background:#ffe4e6;color:var(--deep);
  font-size:12px;font-weight:bold;padding:5px 8px;min-height:30px;
}
.testbar{
  flex:none;padding:5px 7px;display:flex;align-items:center;gap:5px;
  background:#fef9c3;border:1px dashed #ca8a04;border-radius:5px;
}
.testbar label{font-size:10px;color:#854d0e}
.testbar select{min-width:0;flex:1;font-size:11px;padding:3px}
.testbar button{
  font-size:10px;padding:5px;border:1px solid #ca8a04;
  background:white;color:#854d0e;border-radius:3px;
}
.action{
  width:100%;padding:11px 8px;color:white;font-weight:bold;font-size:15px;
  border:3px solid #7f1d1d;background:var(--red);
  border-radius:6px;box-shadow:0 4px #7f1d1d;min-height:44px;
}
.action:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px #7f1d1d}
.secondary{background:var(--green);border-color:var(--dark-green);box-shadow:0 4px var(--dark-green)}
.outline{
  padding:9px;background:white;border:2px solid var(--pink);
  border-radius:6px;color:var(--deep);font-size:12px;min-height:38px;
}
.cover{
  padding:0;position:relative;background:#fff7ed;
  justify-content:flex-end;text-align:center;
}
.cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-fallback{
  position:absolute;inset:0;background:linear-gradient(#ffe4e6,#fff7ed);
  display:flex;align-items:center;justify-content:center;
}
.cover-fallback span{font-size:110px}
.cover-panel{
  position:relative;z-index:2;padding:22px 16px 24px;
  background:linear-gradient(transparent,#fff1f5 22%);
}
.cover h1{
  color:var(--deep);font-size:27px;line-height:1.5;
  text-shadow:2px 2px white;margin:14px 0 8px;
}
.cover p{font-size:13px;line-height:1.7;margin:8px 0 16px}
.route-info{
  flex:none;padding:10px;background:#fdf2f8;
  border-top:2px dashed var(--pink);font-size:12px;line-height:1.7;
}
.route-info strong{display:block;color:var(--deep)}
.puzzle-content{
  flex:1;min-height:0;overflow-y:auto;padding:13px;
  display:flex;flex-direction:column;gap:13px;align-items:center;
}
.instructions{
  width:100%;font-size:13px;line-height:1.7;text-align:center;
  color:var(--deep);font-weight:bold;
}
.clue{
  width:100%;padding:11px;border:2px dashed var(--pink);
  background:#fff5f8;border-radius:6px;font-size:13px;line-height:1.7;
  text-align:center;
}
.status{
  width:100%;text-align:center;min-height:22px;
  font-size:12px;font-weight:bold;color:var(--green);line-height:1.5;
}
.hints{
  flex:none;border-top:2px dashed var(--pink);padding:8px;
  display:flex;align-items:center;gap:8px;background:#f0fdf4;
}
.hints p{flex:1;font-size:11px;line-height:1.5;color:var(--dark-green)}
.grid4{
  width:100%;max-width:300px;display:grid;
  grid-template-columns:repeat(4,1fr);gap:7px;
}
.cell{
  aspect-ratio:1;border:2px solid var(--dark-green);
  border-radius:7px;background:#fff;font-size:25px;min-width:0;
  display:flex;align-items:center;justify-content:center;
}
.cell.filled{background:var(--soft);border-color:var(--deep)}
.pool{display:flex;justify-content:center;gap:9px;width:100%}
.token{
  padding:9px 15px;border:2px solid var(--deep);border-radius:6px;
  font-size:24px;background:white;
}
.token.selected{background:#fce7f3;box-shadow:0 0 0 2px var(--pink)}
.stitch{
  position:relative;width:100%;max-width:300px;aspect-ratio:1;
  background:#fff7ed;border:2px solid var(--pink);border-radius:12px;
}
.stitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stitch-node{
  position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);
  border:3px solid var(--deep);border-radius:50%;background:white;
  font-size:25px;color:var(--deep);
}
.stitch-node.selected{background:#fef08a}
.options{width:100%;display:flex;flex-direction:column;gap:9px}
.option{
  padding:13px 8px;min-height:46px;background:#fff5f8;
  border:2px solid var(--pink);border-radius:6px;font-size:14px;
}
.option.selected{background:#fce7f3;border-color:var(--deep);box-shadow:0 0 0 1px var(--deep)}
.skyline{
  width:100%;height:110px;background:#eff6ff;display:flex;
  align-items:flex-end;justify-content:center;gap:7px;
  border-bottom:5px solid #7dd3fc;padding:10px 6px 0;border-radius:7px;
}
.building{
  flex:1;max-width:66px;background:#bfdbfe;border:2px solid #3b82f6;
  display:flex;justify-content:center;align-items:center;font-size:24px;
  border-radius:4px 4px 0 0;
}
.dials{display:flex;width:100%;justify-content:center;gap:7px}
.dial{
  flex:1;max-width:65px;border:2px solid var(--deep);
  padding:5px;border-radius:6px;background:#fff5f8;text-align:center;
}
.dial button{
  width:100%;min-height:36px;border:1px solid var(--pink);
  border-radius:4px;background:white;color:var(--deep);font-size:15px;
}
.dial-value{
  margin:7px 0;padding:12px 0;background:var(--deep);color:white;
  border-radius:4px;font-size:24px;font-weight:bold;
}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.key{
  min-height:125px;border:2px solid var(--deep);border-radius:6px;
  background:white;box-shadow:0 4px var(--pink);color:var(--deep);
  font-size:18px;
}
.key.active{background:#fef08a;transform:translateY(3px)}
.wishes{
  position:relative;width:100%;height:220px;border:3px solid var(--pink);
  border-radius:8px;overflow:hidden;background:#fff7ed;
}
.wish-under{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:12px;
}
.wish-note{
  padding:8px 10px;background:#fff;border:1px solid #fbcfe8;
  border-radius:5px;font-size:12px;transform:rotate(-2deg);
}
.wish-note:nth-child(2){transform:rotate(2deg);background:#f0fdf4}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.circuit{
  width:100%;max-width:285px;display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;padding:6px;background:#fdf2f8;border:2px solid var(--pink);border-radius:8px;
}
.pipe{
  aspect-ratio:1;border:2px solid #94a3b8;background:#f8fafc;
  border-radius:7px;padding:5px;min-width:0;
}
.pipe svg{width:100%;height:100%;display:block}
.pipe.lit{background:#fef9c3;border-color:#ca8a04}
.circuit-label{font-size:12px;color:var(--deep);font-weight:bold}
.modal{
  position:absolute;inset:0;z-index:30;background:#0009;
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(3px);
}
.modal-card{
  width:100%;max-height:90%;overflow:auto;background:white;
  border:3px solid var(--deep);border-radius:12px;padding:22px 17px;
  text-align:center;box-shadow:5px 5px #db277766;
}
.modal h2{color:var(--deep);font-size:19px;margin:8px 0}
.modal p{font-size:13px;line-height:1.8;margin-bottom:18px;white-space:pre-wrap}
@keyframes shake{
  25%{transform:translateX(-4px)}75%{transform:translateX(4px)}
}
.shake{animation:shake .24s linear}
@media(max-width:360px){
  .screen{padding:7px}
  .puzzle-content{padding:10px}
  .message{font-size:12px}
  .dialogue{min-height:145px}
  .chapter{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <span class="badge" id="progress">해치 크리스마스</span>
    <div class="tools">
      <button class="small-btn" id="bgm-button" aria-pressed="false">♫ 음악 OFF</button>
      <button class="small-btn" id="sfx-button" aria-pressed="false">효과음 OFF</button>
      <button class="small-btn" id="home-button">처음으로</button>
    </div>
  </header>

  <main id="screen" class="screen"></main>

  <!-- 테스트가 끝나면 JavaScript의 TEST_MODE를 false로 변경하세요. -->
  <div id="testbar" class="testbar">
    <label for="jump">테스트</label>
    <select id="jump" aria-label="문제 바로 이동"></select>
    <button id="jump-button">이동</button>
    <button id="pass-button">문제 패스</button>
  </div>

  <div id="modal" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="modal-title" hidden>
    <div class="modal-card">
      <div id="modal-icon" style="font-size:38px">✨</div>
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <button class="action" id="modal-button">확인</button>
    </div>
  </div>
</div>

<script>
"use strict";

/*
이미지 파일 안내 — HTML과 같은 폴더에 넣으세요.
없어도 대체 화면으로 테스트할 수 있습니다.

intro.gif       : 인트로
outro.gif       : 선물 수령 안내 배경
image_01.png    : 창고와 장식 상자
image_02.png    : 대형 트리와 오래된 별
image_03.png    : 내친구서울 1관
image_04.png    : 서울책방
image_05.png    : 공연장
image_06.png    : 소망나무
image_07.png    : 마지막 크리스마스 공간
image_08.png    : 에필로그

route_01.png ~ route_07.png : 장소 안내 사진
실제 현장 사진과 이동 설명은 ROUTES에서 교체하세요.

haechi.gif : 해치
ju.png     : 주작 — GIF 사용 시 아래 파일명을 바꾸세요.
baekho.png : 백호
cheongryong.png : 청룡
hyeonmu.png : 현무
star.png : 별

퍼즐 단서는 현재 화면 내 테스트용입니다.
현장 단서로 교체할 때 CLUES, HINTS, 문제별 정답을 함께 수정하세요.
*/

const TEST_MODE = true;
const SAVE_KEY = "seoul-gallery-star-v3";
const $ = id => document.getElementById(id);

const CHARACTERS = {
  "해치": {file:"haechi.gif", emoji:"🩷"},
  "주작": {file:"ju.png", emoji:"🔴"},
  "백호": {file:"baekho.png", emoji:"🐯"},
  "청룡": {file:"cheongryong.png", emoji:"🔵"},
  "현무": {file:"hyeonmu.png", emoji:"🟢"},
  "별": {file:"star.png", emoji:"⭐"}
};

const say = (name,text) => ({name,text});
const note = text => ({name:"",text,kind:"note"});

const TITLES = [
  "장식 상자를 찾아라",
  "오래된 별의 잠",
  "별이 바라보던 서울",
  "침대맡의 작은 빛",
  "별이 듣던 이야기",
  "지금도 이어지는 소원",
  "별의 새로운 자리"
];

const ROUTES = [
  {
    place:"장식 상자 체험 지점",
    text:"운영자가 지정한 장식 상자 체험 지점으로 이동해 주세요.",
    line:"우선 장식 상자가 있는 곳으로 가자. 도착하면 같이 상자를 찾아보는 거야."
  },
  {
    place:"대형 트리",
    text:"크리스마스 대형 트리가 있는 공간으로 이동해 주세요.",
    line:"상자에서 찾은 별을 트리에 걸어보자. 끊어진 끈부터 고쳐줘야겠어."
  },
  {
    place:"내친구서울 1관",
    text:"내친구서울 1관의 서울 전경을 볼 수 있는 지점으로 이동해 주세요.",
    line:"서울을 한눈에 볼 수 있는 곳으로 가보자. 별이 기억하는 풍경을 찾을지도 몰라."
  },
  {
    place:"서울책방",
    text:"서울책방의 지정 체험 지점으로 이동해 주세요.",
    line:"이번에는 서울책방으로 가보자. 책을 떠올린 별에게 다른 기억도 돌아올지 몰라."
  },
  {
    place:"공연장",
    text:"공연장 관람 구역의 지정 체험 지점으로 이동해 주세요. 공연 중에는 안내에 따라 주세요.",
    line:"별이 기억하는 소리를 찾아보자. 공연장에 도착하면 작은 멜로디를 들려줄게."
  },
  {
    place:"소망나무",
    text:"소망나무 앞으로 이동해 주세요. 시민들의 소망 종이는 떼지 않고 살펴봐 주세요.",
    line:"소원을 적어 두는 나무가 있어. 별이 좋아하던 이야기와 닮았을 것 같아."
  },
  {
    place:"대형 트리 옆 크리스마스 공간",
    text:"대형 트리 옆 크리스마스 체험 지점으로 돌아와 주세요.",
    line:"처음 별이 깨어난 곳으로 돌아가자. 이번에는 별도 어디로 가고 싶은지 알 것 같대."
  }
];

const BEFORE = [
  [
    say("해치","안녕! 서울갤러리에 온 걸 환영해. 지금 크리스마스 트리를 꾸미는 중이야."),
    say("해치","그런데 장식 상자가 너무 많아서 별 장식을 못 찾겠어. 나랑 같이 찾아줄래?")
  ],
  [
    say("해치","낡았지만 아직 반짝이네. 그런데 끈이 끊어져서 트리에 걸 수가 없어."),
    say("주작","그대로 두면 또 상자 속에 들어가겠어. 새 끈을 달아주자. 내가 붙잡고 있을게."),
    say("해치","좋아. 끈이 엉키지 않도록 구멍을 차례대로 이어줘!")
  ],
  [
    say("해치","네가 있던 곳을 찾고 싶은 거지? 기억나는 풍경이 있을까?"),
    say("별","창문이 있었어. 밤이면 물 건너 불빛이 보였던 것 같아."),
    say("청룡","서울 풍경이라면 함께 찾아볼 수 있지. 높은 곳에서 보는 것처럼 넓게 살펴보자."),
    say("해치","기억이 전부 돌아오지 않아도 괜찮아. 닮은 풍경부터 하나씩 찾아보자.")
  ],
  [
    say("해치","물 건너 불빛 말고 또 떠오르는 게 있어?"),
    say("별","창가 가까이에 책이 있었어. 누군가 책을 덮고 나를 바라보곤 했지."),
    say("백호","그럼 책 속 그림을 살펴보자. 익숙한 걸 보면 다른 기억도 떠오를 수 있어."),
    say("해치","잠긴 그림 상자가 있네. 그림이 알려주는 순서대로 다이얼을 맞춰보자.")
  ],

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function picture(file,label,emoji="⭐",extra=""){
  return `
    <div class="scene">
      <div class="fallback">
        <span class="scene-emoji">${emoji}</span>
        <div class="scene-label">${escapeHTML(label)}</div>
        ${extra ? `<div class="scene-caption">${escapeHTML(extra)}</div>` : ""}
      </div>
      <img src="${escapeHTML(file)}" alt="${escapeHTML(label)}"
           onerror="this.hidden=true">
    </div>`;
}

function save(){
  if(!saveAvailable) return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
  catch(e){saveAvailable=false}
}
function readSave(){
  try{
    const value=JSON.parse(localStorage.getItem(SAVE_KEY));
    const phases=["intro","before","guide","puzzle","after","epilogue","outro"];
    if(value && Number.isInteger(value.stage) &&
       value.stage>=0 && value.stage<7 && phases.includes(value.phase)){
      return value;
    }
  }catch(e){}
  return null;
}

function clearScreen(){
  clearInterval(typingTimer);
  typingTimer=null;
  finishTyping=null;
  if(onScreenCleanup) onScreenCleanup();
  onScreenCleanup=null;
  $("screen").className="screen";
  $("screen").onclick=null;
  $("screen").replaceChildren();
  stopMelody();
}

function navigate(phase,stage=state.stage){
  clearScreen();
  transitionLocked=false;
  state={phase,stage};
  save();
  $("progress").textContent=
    phase==="intro" ? "해치 크리스마스" :
    phase==="outro" ? "탐험 완료!" :
    phase==="epilogue" ? "에필로그" : `미션 ${stage+1}/7`;
  $("jump").value=stage;
  $("pass-button").disabled=!["before","guide","puzzle"].includes(phase);

  if(phase==="intro") renderIntro();
  if(phase==="before"){
    renderDialogue(BEFORE[stage],()=>{
      navigate("guide");
    },TITLES[stage],`image_0${stage+1}.png`,stage===0?"📦":"⭐");
  }
  if(phase==="guide") renderGuide();
  if(phase==="puzzle") renderPuzzle();
  if(phase==="after"){
    renderDialogue(AFTER[stage],()=>{
      if(stage===6) navigate("epilogue");
      else navigate("before",stage+1);
    },"작은 기억 하나",`image_0${stage+1}.png`,"✨");
  }
  if(phase==="epilogue"){
    renderDialogue(EPILOGUE,()=>navigate("outro"),
      "오래된 별의 새로운 자리","image_08.png","🌟");
  }
  if(phase==="outro") renderOutro();
}

function renderDialogue(lines,done,title,image,emoji){
  dialogue=lines;dialogueIndex=0;dialogueDone=done;
  $("screen").innerHTML=`
    <section class="card">
      <h1 class="chapter">${escapeHTML(title)}</h1>
      ${picture(image,title,emoji)}
      <div class="dialogue">
        <div class="portrait">
          <span id="avatar-fallback"></span>
          <img id="avatar" alt="" onerror="this.hidden=true">
        </div>
        <div class="chat">
          <div class="sender" id="sender"></div>
          <div class="message" id="message"></div>
          <button class="next-btn" id="next" hidden>다음 ▶</button>
        </div>
      </div>
    </section>`;
  $("next").onclick=advanceDialogue;
  $("message").onclick=()=>{if(finishTyping) finishTyping()};
  showLine();
}

function showLine(){
  clearInterval(typingTimer);
  const line=dialogue[dialogueIndex];
  const character=CHARACTERS[line.name];
  const text=line.kind==="note" ? `(${line.text})` : line.text;
  $("sender").textContent=line.kind==="note"?"이야기":line.name;
  $("message").classList.toggle("narration",line.kind==="note");
  $("message").textContent="";
  $("message").scrollTop=0;
  $("next").hidden=true;
  $("avatar").hidden=true;
  $("avatar-fallback").textContent=character?.emoji || "✨";
  if(character){
    $("avatar").src=character.file;
    $("avatar").alt=line.name;
    $("avatar").hidden=false;
  }
  $("next").textContent=
    dialogueIndex===dialogue.length-1 ?
      (state.phase==="before"?"장소 안내 보기 ▶":
       state.phase==="epilogue"?"탐험 마무리 ▶":"계속하기 ▶") : "다음 ▶";

  const letters=Array.from(text);
  let index=0;
  finishTyping=()=>{
    clearInterval(typingTimer);typingTimer=null;
    $("message").textContent=text;
    $("next").hidden=false;
    finishTyping=null;
  };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    finishTyping();return;
  }
  typingTimer=setInterval(()=>{
    $("message").textContent+=letters[index++];
    if(index%3===0) effect(750,.018,.009);
    if(index>=letters.length) finishTyping?.();
  },28);
}

function advanceDialogue(){
  if(finishTyping){finishTyping();return}
  if(dialogueIndex<dialogue.length-1){
    dialogueIndex++;showLine();
  }else dialogueDone?.();
}

function puzzleBoxes(){
  $("puzzle").innerHTML=`
    <p class="instructions">상자에 붙은 메모를 보고<br>별 장식이 든 상자를 찾아주세요.</p>
    <div class="clue">“위에서 두 번째 줄,<br>왼쪽에서 세 번째 상자에 있어!”</div>
    <div class="grid4" id="boxes"></div>
    <p class="status" id="status">줄과 칸을 천천히 세어보세요.</p>`;
  for(let i=0;i<16;i++){
    const button=document.createElement("button");
    button.className="cell";button.textContent="📦";
    button.setAttribute("aria-label",`${Math.floor(i/4)+1}행 ${i%4+1}열 상자`);
    button.onclick=()=>{
      if(transitionLocked) return;
      if(i===6){
        button.textContent="⭐";button.classList.add("filled");
        solve("장식 상자 안에서 낡은 별을 찾았어요.");
      }else{
        button.textContent="🎀";button.disabled=true;
        status("여기에는 다른 장식이 있네. 메모의 위치를 다시 살펴보자.");
      }
    };
    $("boxes").append(button);
  }
}

function puzzleDial(){
  const chars=["별","나","라","무","달","빛","꿈","집"];
  const values=[4,5,6,7];
  const target=["별","나","라","무"];

    <div class="dials" id="dials"></div>
    <button class="action" id="unlock">그림 상자 열기</button>
    <p class="status" id="status">▲ ▼ 버튼이나 다이얼 위아래 밀기로 조작하세요.</p>`;
  values.forEach((_,i)=>{
    const column=document.createElement("div");
    column.className="dial";
    column.innerHTML=`
      <button aria-label="${i+1}번째 다이얼 이전">▲</button>
      <div class="dial-value" id="value-${i}"></div>
      <button aria-label="${i+1}번째 다이얼 다음">▼</button>`;
    const update=delta=>{
      if(transitionLocked) return;
      values[i]=(values[i]+delta+chars.length)%chars.length;
      $(`value-${i}`).textContent=chars[values[i]];
      effect(320,.025,.02);
    };
    column.children[0].onclick=()=>update(-1);
    column.children[2].onclick=()=>update(1);
    let startY=null;
    const drum=column.children[1];
    drum.style.touchAction="none";
    drum.onpointerdown=e=>{startY=e.clientY;drum.setPointerCapture(e.pointerId)};
    drum.onpointerup=e=>{
      if(startY!==null && Math.abs(e.clientY-startY)>15){
        update(e.clientY<startY?1:-1);
      }
      startY=null;
    };
    drum.onpointercancel=()=>{startY=null};
    $("dials").append(column);update(0);
  });
  $("unlock").onclick=()=>{
    const answer=values.map(v=>chars[v]);
    answer.every((v,i)=>v===target[i]) ?
      solve("그림 상자에서 침대맡의 기억을 찾았어요.") :
      fail("그림 이름의 첫 글자와 다이얼 순서를 확인해 보세요.");
  };
}

/* 5. 듣고 따라 치는 네 음 멜로디 */
function puzzleMusic(){
  const names=["도","레","미","솔"];
  const frequencies=[261.63,293.66,329.63,392];
  const target=[2,3,0,2];
  let input=[],listening=false,sequenceVersion=0;
  $("puzzle").innerHTML=`
    <p class="instructions">멜로디를 듣고 같은 순서로 연주해 주세요.<br>소리와 함께 건반도 빛납니다.</p>
    <button class="action secondary" id="listen">♫ 멜로디 듣기 / 다시 듣기</button>
    <div class="keys" id="keys"></div>
    <p class="status" id="status">먼저 멜로디 듣기를 눌러주세요.</p>
    <button class="outline" id="music-reset">입력 지우기</button>`;
  names.forEach((name,i)=>{
    const b=document.createElement("button");
    b.className="key";b.id=`key-${i}`;b.textContent=name;
    b.onclick=()=>{
      if(listening||transitionLocked) return;
      unlockAudio();
      tone(frequencies[i],.28,"triangle",.12,true);
      flashKey(i,180);
      input.push(i);
      status(`입력 ${input.length}/4 · ${input.map(n=>names[n]).join(" → ")}`);
      if(i!==target[input.length-1]){
        input=[];fail("방금 들은 순서와 달라요. 다시 듣고 천천히 연주해 보세요.");
        status("입력 0/4 · 다시 도전해 보세요.");
      }else if(input.length===target.length){
        solve("기억 속 멜로디를 연주했어요.");
      }
    };
    $("keys").append(b);
  });
  $("listen").onclick=async()=>{
    if(listening) return;
    unlockAudio();input=[];listening=true;
    const version=++sequenceVersion;
    $("listen").disabled=true;
    target.forEach((value,index)=>{
      const timer=setTimeout(()=>{
        if(version!==sequenceVersion || state.phase!=="puzzle") return;
        tone(frequencies[value],.32,"triangle",.12,true);
        flashKey(value,300);
        status(`듣는 중 ${index+1}/4 · ${names[value]}`);
      },index*600);
      melodyTimers.push(timer);
    });
    melodyTimers.push(setTimeout(()=>{
      if(version!==sequenceVersion) return;
      listening=false;
      if($("listen")) $("listen").disabled=false;
      status("이제 같은 순서로 연주해 주세요. 입력 0/4");
    },target.length*600));
  };
  $("music-reset").onclick=()=>{
    if(listening) return;
    input=[];status("입력 0/4");
  };
  onScreenCleanup=()=>{sequenceVersion++;listening=false};
}
function flashKey(index,duration){
  const b=$(`key-${index}`);if(!b) return;
  b.classList.add("active");
  melodyTimers.push(setTimeout(()=>b.classList.remove("active"),duration));
}

function puzzleScratch(){
  let percent=0;
  $("puzzle").innerHTML=`
    <p class="instructions">손가락으로 회색 부분을 문질러<br>소원 세 개를 읽어주세요.</p>
    <div class="wishes">

        <div class="wish-note">“우리 가족이 건강했으면 좋겠어요.”</div>
        <div class="wish-note">“내년에는 용기를 내보고 싶어요.”</div>
      </div>
      <canvas id="scratch" aria-label="문질러 소원을 확인하는 영역"></canvas>
    </div>
    <p class="status" id="status">가려진 소원 드러내기 0%</p>
    <button class="outline" id="scratch-accessible">문지르기 대신 소원 전체 읽기</button>
    <div id="wish-answer" class="options" hidden>
      <p class="instructions">별이 이 소원들을 보며 느낀 마음은?</p>
      <button class="option" id="wish-correct">서로의 소원을 응원하는 마음</button>
      <button class="option" id="wish-wrong">누구의 소원이 더 큰지 겨루는 마음</button>
    </div>`;

  const canvas=$("scratch"),ctx=canvas.getContext("2d");
  const rect=canvas.getBoundingClientRect();
  canvas.width=Math.max(1,Math.round(rect.width));
  canvas.height=Math.max(1,Math.round(rect.height));
  ctx.fillStyle="#b8a7b2";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#fff";ctx.font="bold 16px sans-serif";ctx.textAlign="center";
  ctx.fillText("여기를 살살 문질러 주세요",canvas.width/2,canvas.height/2);
  ctx.font="26px sans-serif";
  ctx.fillText("✦  ✦  ✦",canvas.width/2,canvas.height/2+40);

  let drawing=false,last=null,moves=0;
  const reveal=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    canvas.hidden=true;percent=100;
    status("소원 세 개를 읽고 아래 질문에 답해 주세요.");
    $("wish-answer").hidden=false;
    $("scratch-accessible").hidden=true;
  };
  const position=e=>{
    const r=canvas.getBoundingClientRect();
    return {
      x:(e.clientX-r.left)*canvas.width/r.width,
      y:(e.clientY-r.top)*canvas.height/r.height
    };
  };
  const estimate=()=>{
    const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let total=0,erased=0;
    for(let i=3;i<data.length;i+=64){
      total++;if(data[i]<50) erased++;
    }
    percent=Math.round(erased/total*100);
    status(`가려진 소원 드러내기 ${percent}%`);
    if(percent>=48) reveal();
  };
  const erase=e=>{
    if(!drawing) return;
    const p=position(e);
    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=42;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();
    ctx.moveTo(last?.x??p.x,last?.y??p.y);
    ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke();
    last=p;
    if(++moves%6===0) estimate();
  };
  canvas.onpointerdown=e=>{
    drawing=true;last=null;canvas.setPointerCapture(e.pointerId);erase(e);
  };
  canvas.onpointermove=erase;
  canvas.onpointerup=()=>{drawing=false;last=null;estimate()};
  canvas.onpointercancel=()=>{drawing=false;last=null};
  $("scratch-accessible").onclick=reveal;
  $("wish-correct").onclick=()=>solve("서로 다른 소원 속에서 닮은 마음을 찾았어요.");
  $("wish-wrong").onclick=()=>fail("어느 소원이 더 큰지 정할 필요는 없어요. 모두에게 소중한 마음이랍니다.");
}

/* 7. 회전 전선 퍼즐 — 하나의 길로 아홉 칸 연결
비트: 위1 / 오른쪽2 / 아래4 / 왼쪽8
정답 경로: 0→1→2→5→4→3→6→7→8
*/
function puzzleCircuit(){
  const solution=[10,10,12,6,10,9,3,10,10];
  const turns=[1,1,2,1,1,2,3,1,1];
  let masks=solution.map((m,i)=>{
    for(let n=0;n<turns[i];n++) m=rotateMask(m);
    return m;
  });
  $("puzzle").innerHTML=`
    <p class="instructions">칸을 눌러 전선을 돌려주세요.<br>아홉 칸을 모두 지나 별까지 빛을 이어요.</p>
    <p class="circuit-label">입구: 첫 번째 줄 왼쪽 ➜</p>
    <div class="circuit" id="circuit"></div>
    <p class="circuit-label">➜ 출구: 마지막 줄 오른쪽 ⭐</p>
    <p class="status" id="status">불이 들어오는 길을 확인해 보세요.</p>
    <button class="action" id="circuit-check">빛 이어주기</button>
    <button class="outline" id="circuit-reset">전선 초기화</button>`;
  function render(){
    const lit=connectedCells(masks);
    $("circuit").innerHTML="";
    masks.forEach((mask,index)=>{
      const b=document.createElement("button");
      b.className="pipe"+(lit.has(index)?" lit":"");
      const labels=[];
      const lines=[];
      [[1,50,0,"위"],[2,100,50,"오른쪽"],
       [4,50,100,"아래"],[8,0,50,"왼쪽"]].forEach(([bit,x,y,label])=>{
        if(mask&bit){
          lines.push(`<path d="M50 50 L${x} ${y}"/>`);labels.push(label);
        }
      });
      b.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="${lit.has(index)?"#ca8a04":"#64748b"}"
           stroke-width="13" stroke-linecap="round">${lines.join("")}</g>
        <circle cx="50" cy="50" r="10" fill="${lit.has(index)?"#facc15":"#94a3b8"}"/>
      </svg>`;
      b.setAttribute("aria-label",`${index+1}번 전선: ${labels.join(", ")}. 누르면 회전`);
      b.onclick=()=>{
        if(transitionLocked) return;
        masks[index]=rotateMask(masks[index]);render();
      };
      $("circuit").append(b);
    });
    status(`빛이 닿은 칸 ${lit.size}/9`);
  }
  $("circuit-check").onclick=()=>{
    if(circuitComplete(masks)){
      $("circuit").querySelectorAll(".pipe").forEach(b=>b.classList.add("lit"));
      solve("아홉 칸의 빛이 모두 이어졌어요. 별이 환하게 빛납니다.");
    }else fail("입구부터 출구까지 끊어진 곳 없이 아홉 칸을 모두 이어주세요.");
  };
  $("circuit-reset").onclick=()=>{
    masks=solution.map((m,i)=>{
      for(let n=0;n<turns[i];n++) m=rotateMask(m);
      return m;
    });
    render();
  };
  render();
}
function rotateMask(mask){return ((mask<<1)&15)|((mask>>3)&1)}
function connectedCells(masks){
  const visited=new Set();
  if(!(masks[0]&8)) return visited;
  const queue=[0];
  while(queue.length){
    const index=queue.shift();
    if(visited.has(index)) continue;
    visited.add(index);
    const row=Math.floor(index/3),col=index%3;
    [[1,-3,4,row>0],[2,1,8,col<2],
     [4,3,1,row<2],[8,-1,2,col>0]].forEach(([bit,delta,opposite,valid])=>{
      if(valid && (masks[index]&bit) && (masks[index+delta]&opposite)){
        if(!visited.has(index+delta)) queue.push(index+delta);
      }
    });
  }
  return visited;
}
function circuitComplete(masks){
  const visited=connectedCells(masks);
  if(visited.size!==9 || !(masks[8]&2)) return false;
  for(let index=0;index<9;index++){
    const row=Math.floor(index/3),col=index%3;
    for(const [bit,delta,opposite,valid] of [
      [1,-3,4,row>0],[2,1,8,col<2],
      [4,3,1,row<2],[8,-1,2,col>0]
    ]){
      if(!(masks[index]&bit)) continue;
      if(!valid){
        if(!((index===0&&bit===8)||(index===8&&bit===2))) return false;
      }else if(!(masks[index+delta]&opposite)) return false;
    }
  }
  return true;
}

function confirmDialog(title,text,action){

/* 음향 — 외부 음악 파일 없이 작동 */
let audio=null,bgm=false,sfx=false,bgmTimer=null,bgmIndex=0;
let melodyTimers=[],voices=new Set();

function unlockAudio(){
  try{
    const Constructor=window.AudioContext||window.webkitAudioContext;
    if(!Constructor) return false;
    if(!audio) audio=new Constructor();
    if(audio.state==="suspended") audio.resume().catch(()=>{});
    return true;
  }catch(e){return false}
}
function tone(frequency,duration=.2,type="triangle",volume=.05,force=false){
  if(!force&&!sfx) return;
  if(!unlockAudio()) return;
  try{
    const oscillator=audio.createOscillator();
    const gain=audio.createGain();
    const t=audio.currentTime;
    oscillator.type=type;oscillator.frequency.value=frequency;
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(Math.max(volume,.001),t+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    oscillator.connect(gain);gain.connect(audio.destination);
    voices.add(oscillator);
    oscillator.onended=()=>{
      oscillator.disconnect();gain.disconnect();voices.delete(oscillator);
    };
    oscillator.start(t);oscillator.stop(t+duration+.02);
  }catch(e){}
}
function effect(frequency,duration,volume){tone(frequency,duration,"sine",volume)}
function stopMelody(){
  melodyTimers.forEach(clearTimeout);melodyTimers=[];
}
function stopVoices(){
  voices.forEach(v=>{try{v.stop()}catch(e){}});
  voices.clear();
}
const bgmNotes=[329.63,329.63,329.63,0,329.63,329.63,329.63,0,
                329.63,392,261.63,293.66,329.63,0,0,0];
function updateBGM(){
  clearInterval(bgmTimer);bgmTimer=null;
  $("bgm-button").textContent=bgm?"♫ 음악 ON":"♫ 음악 OFF";
  $("bgm-button").setAttribute("aria-pressed",String(bgm));
  if(bgm&&!document.hidden){
    bgmTimer=setInterval(()=>{
      // 소리 퍼즐에서는 배경음악을 잠시 쉬게 합니다.
      if(state.phase==="puzzle"&&state.stage===4) return;
      const f=bgmNotes[bgmIndex++%bgmNotes.length];
      if(f) tone(f,.22,"triangle",.025,true);
    },380);
  }
}
$("bgm-button").onclick=()=>{
  if(!unlockAudio()){
    openModal("음악 안내","이 환경에서는 오디오가 지원되지 않습니다.",()=>{});
    return;
  }
  bgm=!bgm;updateBGM();
};
$("sfx-button").onclick=()=>{
  sfx=!sfx;unlockAudio();
  $("sfx-button").textContent=sfx?"효과음 ON":"효과음 OFF";
  $("sfx-button").setAttribute("aria-pressed",String(sfx));
};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) stopVoices();
  updateBGM();
});

/* 테스트 메뉴와 재시작 */
$("testbar").hidden=!TEST_MODE;
TITLES.forEach((title,index)=>{
  const option=document.createElement("option");
  option.value=index;option.textContent=`${index+1}. ${title}`;
  $("jump").append(option);
});
$("jump-button").onclick=()=>{
  if(!TEST_MODE) return;
  navigate("puzzle",Number($("jump").value));
};
$("pass-button").onclick=()=>{
  if(!TEST_MODE || transitionLocked) return;
  navigate("after");
};
$("home-button").onclick=()=>{
  confirmDialog("처음으로 돌아갈까요?",
    "진행 중인 미션을 초기화하고 인트로로 돌아갑니다.",()=>{
      stopVoices();resumePoint=null;navigate("intro",0);
    });
};

/* 시작 시 저장된 진행을 보관하고 인트로 표시 */
let resumePoint=readSave();
clearScreen();
$("progress").textContent="해치 크리스마스";
$("pass-button").disabled=true;
renderIntro();
</script>
</body>
</html>
