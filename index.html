<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>해치 크리스마스: 인트로 테스트</title>
  <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-bg: #fff1f5;
      --pink-primary: #f472b6;
      --pink-deep: #db2777;
      --crimson-red: #dc2626;
      --pine-green: #15803d;
      --pine-dark: #14532d;
      --text-dark: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'DungGeunMo', monospace, sans-serif !important;
    }

    body {
      background-color: #fce7f3;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      background: var(--pink-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 4px solid var(--pink-deep);
      box-shadow: 4px 4px 0px #831843, 8px 8px 0px rgba(219, 39, 119, 0.3);
    }

    /* 화면 전환용 클래스 */
    .screen {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
    }
    .screen.active {
      display: flex;
    }

    /* 1. 인트로 화면 스타일 */
    #screen-intro {
      background: #000;
      z-index: 10;
    }

    .intro-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .intro-header-box {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .intro-badge {
      background: var(--pine-green);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1.5px solid var(--pine-dark);
    }

    .intro-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.3;
      text-shadow: 3px 3px 0px var(--pink-deep), 6px 6px 0px #831843;
    }

    .intro-start-btn {
      position: relative;
      z-index: 10;
      width: 80%;
      max-width: 280px;
      padding: 16px;
      background: var(--crimson-red);
      color: #ffffff;
      border: 3px solid #7f1d1d;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0px #7f1d1d;
      margin-bottom: 20px;
    }
    .intro-start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0px #7f1d1d;
    }

    /* 2. 난이도 조절 화면 스타일 */
    #screen-setup {
      background: var(--pink-bg);
      z-index: 5;
      justify-content: center;
      gap: 20px;
    }

    .diff-card {
      width: 100%;
      background: #ffffff;
      border: 3px solid var(--pink-deep);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 5px 5px 0px rgba(219, 39, 119, 0.2);
    }

    .diff-btn {
      width: 100%;
      padding: 14px;
      background: #fff5f8;
      border: 2px solid var(--pink-primary);
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .diff-btn:hover {
      background: var(--soft-pink);
      border-color: var(--pink-deep);
    }
  </style>
</head>
<body>

<div id="app">
  <!-- 1. 인트로 화면 -->
  <div id="screen-intro" class="screen active">
    <!-- 인트로 GIF 배경 (이미지가 없어도 버튼이 보이도록 에러 처리 포함) -->
    <img src="intro.gif" alt="인트로 배경" class="intro-bg-img" onerror="this.style.display='none';">
    
    <div class="intro-header-box">
      <span class="intro-badge">SEOUL GALLERY WINTER EVENT</span>
      <h1 class="intro-title">해치 크리스마스:<br>소망 숲 모험</h1>
    </div>

    <button class="intro-start-btn" onclick="goToDifficulty()">
      <span>모험 시작하기 ✨</span>
    </button>
  </div>

  <!-- 2. 난이도 및 캐릭터 선택 화면 -->
  <div id="screen-setup" class="screen">
    <h1 style="font-size: 20px; color: var(--pink-deep);">함께할 수호대를 골라주세요!</h1>
    
    <div class="diff-card">
      <div style="font-size: 16px; font-weight: bold; color: var(--pink-deep);">🎯 난이도 선택</div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="diff-btn" onclick="alert('난이도가 선택되었습니다! (게임 시작 준비 완료)')">
          <span>해치 & 주작</span>
          <span style="color: var(--pine-green);">★</span>
        </button>
      </div>
    </div>

    <button class="action-btn" onclick="goToIntro()" style="padding: 10px; background: #6b7280; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%;">◀ 인트로로 돌아가기</button>
  </div>
</div>

<script>
  // 화면 전환을 처리하는 단 하나의 명확한 함수
  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => {
      s.classList.remove('active');
    });
    const target = document.getElementById(screenId);
    if (target) {
      target.classList.add('active');
    }
  }

  // 모험 시작하기 버튼 클릭 시 호출
  function goToDifficulty() {
    console.log("모험 시작하기 버튼 클릭됨!"); // F12 콘솔에서 확인용
    switchScreen('screen-setup');
  }

  // 인트로로 돌아가기 버튼 클릭 시 호출
  function goToIntro() {
    switchScreen('screen-intro');
  }
</script>

</body>
</html>
