<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>해치 크리스마스 관리자</title>
<style>
:root{
  --bg:#fff4f7;
  --paper:#fff;
  --ink:#543d48;
  --muted:#8d7883;
  --line:#ead5de;
  --pink:#c95780;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--ink);
  background:var(--bg);
  font:15px/1.5 system-ui,-apple-system,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:3px solid #aac2e1;
  outline-offset:2px;
}
header{
  padding:23px max(20px,calc((100vw - 1120px)/2));
  background:#fff;
  border-bottom:1px solid var(--line);
}
h1{font-size:23px;margin:0 0 7px}
h2{font-size:19px;margin:0 0 15px}
p{margin:6px 0}
main{max-width:1160px;margin:auto;padding:20px}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  margin-bottom:17px;
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button,.file-button{
  display:inline-block;
  padding:9px 14px;
  border:1px solid #d6adbd;
  border-radius:9px;
  background:#fff;
  color:var(--ink);
}
.primary{background:var(--pink);border-color:var(--pink);color:white}
.danger{color:#b34259}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:#806570;margin:10px 0 5px}
input,textarea,select{
  width:100%;
  padding:10px;
  border:1px solid #d9c3cd;
  border-radius:8px;
  background:#fff;
  color:var(--ink);
}
textarea{resize:vertical;min-height:90px}
input[type=checkbox]{width:auto}
input[type=file]{padding:7px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}
.tabs button.active{background:#f4d7e3;border-color:#c77999}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:17px}
.side button{
  display:block;
  width:100%;
  text-align:left;
  margin:0 0 7px;
}
.side button.active{background:#f8e2eb;border-color:#ca829e}
.side small{display:block;color:var(--muted);margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{min-width:0}
.line-card{
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  margin:12px 0;
  background:#fffafd;
}
.line-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.line-actions{display:flex;gap:5px}
.line-actions button{font-size:12px;padding:5px 9px}
.speaker-row{display:flex;gap:12px;align-items:center}
.speaker-row select{max-width:170px}
.notice{
  border:1px solid #e7c995;
  background:#fff8e9;
  border-radius:9px;
  padding:12px 14px;
  font-size:13px;
}
#status{
  white-space:pre-line;
  padding:11px 14px;
  border-radius:9px;
  background:#f5e7ee;
  margin-top:12px;
}
#status.error{color:#a02f43;background:#ffe8ed}
.badge{
  font-size:12px;
  background:#f7e1eb;
  border-radius:20px;
  padding:4px 9px;
}
.footer-actions{
  position:sticky;
  bottom:0;
  padding:14px;
  background:#fffdfdf5;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 -4px 20px #6743530a;
  z-index:10;
}
.asset-row{
  display:grid;
  grid-template-columns:140px minmax(0,1fr);
  gap:12px;
  align-items:center;
  border-bottom:1px solid #f0e4e9;
  padding:11px 0;
}
.asset-row label{margin:0}
.asset-row input{margin:0}
.preview-note{margin:14px 0;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .side{display:flex;overflow:auto;gap:6px;padding-bottom:5px}
  .side button{min-width:145px;margin:0}
  .grid{grid-template-columns:1fr}
  main{padding:12px}
  .card{padding:15px}
  .asset-row{grid-template-columns:1fr;gap:5px}
}
</style>
</head>
<body>

<header>
  <h1>해치 크리스마스 관리자</h1>
  <p class="muted">게임 파일 불러오기 → 내용 수정 → 수정된 index.html 다운로드 → 기존 파일 교체</p>
</header>

<main>
  <section class="card">
    <h2>1. 게임 파일 불러오기</h2>
    <div class="row">
      <input id="game-file" type="file" accept=".html,.htm"
             aria-label="현재 index.html 선택" style="max-width:390px">
      <button id="load-nearby">같은 폴더의 index.html 불러오기</button>
    </div>
    <p class="muted">
      PC에서 파일을 직접 열었다면 파일 선택을 사용하세요.
      같은 폴더 불러오기는 웹사이트 주소로 접속했을 때 사용할 수 있습니다.
    </p>
    <div id="status" role="status">현재 사용 중인 index.html을 선택해 주세요.</div>
  </section>

  <section id="editor" hidden>
    <div class="row spread">
      <div class="row">
        <span class="badge" id="filename"></span>
        <span class="muted" id="dirty-label">불러오기 완료</span>
      </div>
      <div class="row">
        <button id="export-settings">설정 백업 다운로드</button>
        <button id="import-settings">설정 백업 불러오기</button>
        <input id="settings-file" type="file" accept=".json" hidden>
      </div>
    </div>

    <nav class="tabs" aria-label="편집 메뉴">
      <button data-tab="story" class="active">대사·지문</button>
      <button data-tab="guide">제목·이동 안내</button>
      <button data-tab="hint">힌트</button>
      <button data-tab="answer">정답</button>
      <button data-tab="asset">이미지·음악</button>
      <button data-tab="ending">기억 앨범·운영 설정</button>
    </nav>

    <div class="layout">
      <aside id="sidebar" class="side"></aside>
      <section id="panel" class="card"></section>
    </div>

    <section class="footer-actions row spread">
      <span class="muted">변경 사항은 다운로드한 파일에 반영됩니다.</span>
      <button id="download-game" class="primary">수정된 index.html 다운로드</button>
    </section>
  </section>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);
const clone=value=>JSON.parse(JSON.stringify(value));
const DEFAULT_STAR={
  awake:"star_01.png",
  sleep:"star_02.png",
  light:"star_03.png"
};
const DEFAULT_CHAR={
  "해치":"haechi.gif",
  "주작":"ju.gif",
  "청룡":"cheongryong.png",
  "백호":"baekho.png",
  "현무":"hyeonmu.png"
};
const DEFAULT_INTRO=[
  {name:"해치",text:"안녕! 잘 왔어. 지금 트리를 꾸미는 중이야."},
  {name:"해치",text:"장식 상자부터 가지러 가자. 나랑 같이 가줄래?"}
];

let source="";
let config=null;
let originalConfig=null;
let loadedName="index.html";
let dirty=false;
let tab="story";
let selectedStage=0;
let storySection="arrival";
let pendingRead=false;

function status(text,error=false){
  $("status").textContent=text;
  $("status").classList.toggle("error",error);
}
function changed(){
  dirty=true;
  $("dirty-label").textContent="저장하지 않은 변경 사항";
}
function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/*
  JavaScript의 문자열·배열·객체·say()/note()만 읽는 제한된 파서.
  eval 또는 게임 스크립트 실행은 사용하지 않음.
*/
class LiteralReader{
  constructor(text,position=0,refs={}){
    this.text=text;
    this.i=position;
    this.refs=refs;
  }
  skip(){
    for(;;){
      while(/\s/.test(this.text[this.i]||"")&&this.i<this.text.length)this.i++;
      if(this.text.slice(this.i,this.i+2)==="//"){
        const end=this.text.indexOf("\n",this.i+2);
        this.i=end<0?this.text.length:end+1;
      }else if(this.text.slice(this.i,this.i+2)==="/*"){
        const end=this.text.indexOf("*/",this.i+2);
        if(end<0)throw Error("닫히지 않은 주석");
        this.i=end+2;
      }else break;
    }
  }
  expect(char){
    this.skip();
    if(this.text[this.i]!==char)throw Error(`문자 ${char} 확인 필요`);
    this.i++;
  }
  string(){
    const quote=this.text[this.i++];
    let out="";
    while(this.i<this.text.length){
      const c=this.text[this.i++];
      if(c===quote)return out;
      if(c!=="\\"){out+=c;continue}
      const e=this.text[this.i++];
      const simple={n:"\n",r:"\r",t:"\t",b:"\b",f:"\f",v:"\v","0":"\0"};
      if(Object.prototype.hasOwnProperty.call(simple,e))out+=simple[e];
      else if(e==="u"){
        if(this.text[this.i]==="{"){
          const end=this.text.indexOf("}",this.i);
          out+=String.fromCodePoint(parseInt(this.text.slice(this.i+1,end),16));
          this.i=end+1;
        }else{
          out+=String.fromCharCode(parseInt(this.text.slice(this.i,this.i+4),16));
          this.i+=4;
        }
      }else if(e==="x"){
        out+=String.fromCharCode(parseInt(this.text.slice(this.i,this.i+2),16));
        this.i+=2;
      }else if(e==="\n"){
        /* 継続行 */
      }else out+=e;
    }
    throw Error("닫히지 않은 문자열");
  }
  identifier(){
    this.skip();
    const match=/^[A-Za-z_$가-힣][\w$가-힣]*/.exec(this.text.slice(this.i));
    if(!match)throw Error("이름을 읽지 못했습니다.");
    this.i+=match[0].length;
    return match[0];
  }
  value(){
    this.skip();
    const c=this.text[this.i];
    if(c==='"'||c==="'")return this.string();

    if(c==="["){
      this.i++;
      const values=[];
      for(;;){
        this.skip();
        if(this.text[this.i]==="]"){this.i++;return values}
        values.push(this.value());
        this.skip();
        if(this.text[this.i]===","){this.i++;continue}
        this.expect("]");
        return values;
      }
    }

    if(c==="{"){
      this.i++;
      const object={};
      for(;;){
        this.skip();
        if(this.text[this.i]==="}"){this.i++;return object}
        const key=this.text[this.i]==='"'||this.text[this.i]==="'"
          ?this.string():this.identifier();
        if(["__proto__","prototype","constructor"].includes(key)){
          throw Error("지원하지 않는 속성");
        }
        this.expect(":");
        object[key]=this.value();
        this.skip();
        if(this.text[this.i]===","){this.i++;continue}
        this.expect("}");
        return object;
      }
    }

    const number=/^-?\d+(?:\.\d+)?/.exec(this.text.slice(this.i));
    if(number){
      this.i+=number[0].length;
      return Number(number[0]);
    }

    const name=this.identifier();
    if(name==="null")return null;
    if(name==="true")return true;
    if(name==="false")return false;

    this.skip();
    if(this.text[this.i]==="("){
      this.i++;
      const args=[];
      this.skip();
      if(this.text[this.i]!==")"){
        for(;;){
          args.push(this.value());
          this.skip();
          if(this.text[this.i]!==",")break;
          this.i++;
        }
      }
      this.expect(")");
      if(name==="say"&&args.length===2){
        return {name:args[0],text:args[1]};
      }
      if(name==="note"&&args.length===1){
        return {name:null,text:args[0]};
      }
      throw Error(`未対応`.replace("未対応","지원하지 않는 함수")+": "+name);
    }

    let result=this.refs[name];
    while(this.text[this.i]==="."){
      this.i++;
      const prop=this.identifier();
      if(["__proto__","prototype","constructor"].includes(prop)){
        throw Error("지원하지 않는 속성");
      }
      result=result?.[prop];
      this.skip();
    }

    if(result===undefined)throw Error("지원하지 않는 참조: "+name);
    return result;
  }
}

function readConst(text,name,refs={},optional=false){
  const regex=new RegExp("\\b(?:const|let|var)\\s+"+name+"\\s*=");
  const match=regex.exec(text);
  if(!match){
    if(optional)return undefined;
    throw Error(name+" 항목을 찾지 못했습니다.");
  }
  return new LiteralReader(text,match.index+match[0].length,refs).value();
}

function readArrayOverrides(text,name,value,refs={}){
  const result=clone(value);
  const regex=new RegExp("\\b"+name+"\\s*\\[\\s*(\\d+)\\s*\\]\\s*=\\s*(?=\\[)","g");
  let match;
  while((match=regex.exec(text))){
    result[Number(match[1])]=
      new LiteralReader(text,match.index+match[0].length,refs).value();
  }
  return result;
}

function removeAdminBlocks(text){
  return text
    .replace(/<script\b[^>]*id=["']gallery-admin-config["'][^>]*>[\s\S]*?<\/script\s*>/gi,"")
    .replace(/<!-- GALLERY_ADMIN_START -->[\s\S]*?<!-- GALLERY_ADMIN_END -->/g,"");
}

const LOCK_PATTERN=/dials\.word\(\)\s*===\s*("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/;
const PIANO_PATTERN=/const\s+target\s*=\s*(\[\s*\d+(?:\s*,\s*\d+){10}\s*\])/;
const BOOK_PATTERN=/const\s+answer\s*=\s*(\[\s*["'][\s\S]*?\])/;
const WISH_PATTERN=/const\s+answerTurns\s*=\s*(\[[^\]]*\])/;

function readMatched(text,regex,fallback){
  const match=regex.exec(text);
  if(!match)return fallback;
  return new LiteralReader(match[1]).value();
}

function readGame(text){
  if(!/<\/body\s*>/i.test(text))throw Error("완전한 HTML 파일을 선택해 주세요.");

  const metadata=/<script\b[^>]*id=["']gallery-admin-config["'][^>]*>([\s\S]*?)<\/script\s*>/i.exec(text);

  if(metadata){
    const data=JSON.parse(metadata[1]);
    validate(data);
    return data;
  }

  const clean=removeAdminBlocks(text);
  const stars=readConst(clean,"STAR",{},true)||DEFAULT_STAR;
  const chars=readConst(clean,"CHAR",{STAR:stars},true)||DEFAULT_CHAR;

  const arrival=readArrayOverrides(
    clean,"ARRIVAL",readConst(clean,"ARRIVAL")
  );
  const after=readArrayOverrides(
    clean,"AFTER",readConst(clean,"AFTER")
  );
  const hints=readArrayOverrides(
    clean,"HINTS",readConst(clean,"HINTS")
  );

  const data={
    version:1,
    intro:clone(DEFAULT_INTRO),
    arrival,
    after,
    epilogue:readConst(clean,"EPILOGUE"),
    titles:readConst(clean,"TITLES"),
    places:readConst(clean,"PLACES"),
    guides:readConst(clean,"GUIDE_LINES"),
    hints,
    memoryNames:readConst(clean,"MEMORY_NAMES"),
    memoryTexts:readConst(clean,"MEMORY_TEXTS"),
    assets:{
      characters:Object.fromEntries(
        Object.entries(chars).filter(([name])=>name!=="별")
      ),
      star:stars,
      backgrounds:Array.from({length:8},(_,i)=>
        `image_${String(i+1).padStart(2,"0")}.png`),
      routes:Array.from({length:7},(_,i)=>
        `route_${String(i+1).padStart(2,"0")}.png`),
      intro:"intro.gif",
      outro:"outro.gif",
      bgm:"bgm.mp3"
    },
    answers:{
      lock:readMatched(clean,LOCK_PATTERN,"HAPPY♥"),
      piano:readMatched(clean,PIANO_PATTERN,[4,4,4,4,4,4,4,7,0,2,4]),
      books:readMatched(clean,BOOK_PATTERN,["river","moon","night","window"]),
      wishes:readMatched(clean,WISH_PATTERN,[0,1,3])
    },
    testMode:/\bconst\s+TEST_MODE\s*=\s*true/.test(clean)
  };

  validate(data);
  return data;
}

function validate(data){
  if(!data||data.version!==1)throw Error("지원하는 설정 파일이 아닙니다.");

  for(const key of ["arrival","after","titles","places","guides","hints","memoryNames","memoryTexts"]){
    if(!Array.isArray(data[key])||data[key].length!==7){
      throw Error(key+" 항목은 7개가 필요합니다.");
    }
  }

  for(const group of [data.intro,data.epilogue,...data.arrival,...data.after]){
    if(!Array.isArray(group)||group.length===0)throw Error("빈 대화 구간이 있습니다.");
    for(const line of group){
      if(!line||typeof line.text!=="string"||
        !(line.name===null||typeof line.name==="string")){
        throw Error("대화 항목을 확인해 주세요.");
      }
    }
  }

  for(const list of data.hints){
    if(!Array.isArray(list)||!list.length||list.some(v=>typeof v!=="string")){
      throw Error("미션별 힌트가 최소 한 개 필요합니다.");
    }
  }

  for(const key of ["titles","places","guides","memoryNames","memoryTexts"]){
    if(data[key].some(v=>typeof v!=="string"))throw Error(key+" 내용을 확인해 주세요.");
  }

  if(!data.assets?.characters||!data.assets?.star||
    data.assets?.backgrounds?.length!==8||data.assets?.routes?.length!==7){
    throw Error("이미지 설정을 확인해 주세요.");
  }

  const paths=[
    ...Object.values(data.assets.characters),
    ...Object.values(data.assets.star),
    ...data.assets.backgrounds,...data.assets.routes,
    data.assets.intro,data.assets.outro,data.assets.bgm
  ];

  for(const path of paths){
    if(typeof path!=="string"||!path.trim())throw Error("비어 있는 파일명이 있습니다.");
    if(/^(?:javascript|data|vbscript):/i.test(path.trim())){
      throw Error("파일명 또는 https 이미지 주소를 사용해 주세요.");
    }
  }

  if(!/^[A-Z♥]{6}$/.test(data.answers?.lock||"")){
    throw Error("자물쇠 정답은 영문 대문자 또는 ♥로 구성된 6글자여야 합니다.");
  }

  if(!Array.isArray(data.answers.piano)||data.answers.piano.length!==11||
    data.answers.piano.some(n=>!Number.isInteger(n)||n<0||n>12)){
    throw Error("현재 피아노 문제의 정답은 11개 음표로 입력해 주세요.");
  }

  const allowed=["river","night","window","moon"];
  if(!Array.isArray(data.answers.books)||
    data.answers.books.length!==4||
    new Set(data.answers.books).size!==4||
    data.answers.books.some(id=>!allowed.includes(id))){
    throw Error("책 네 권을 중복 없이 선택해 주세요.");
  }

  if(!Array.isArray(data.answers.wishes)||data.answers.wishes.length!==3||
    data.answers.wishes.some(n=>![0,1,2,3].includes(n))){
    throw Error("소원 조각 방향을 확인해 주세요.");
  }
}

async function loadText(text,name){
  if(dirty&&!confirm("현재 수정 내용을 버리고 다른 파일을 불러올까요?"))return;

  const parsed=readGame(text);
  source=text;
  config=parsed;
  originalConfig=clone(parsed);
  loadedName=name;
  dirty=false;
  selectedStage=0;
  $("editor").hidden=false;
  $("filename").textContent=name;
  $("dirty-label").textContent="불러오기 완료";
  status("불러왔습니다. 내용을 수정한 후 index.html을 다운로드하세요.");
  render();
}

$("game-file").onchange=async event=>{
  const file=event.target.files[0];
  if(!file)return;
  try{await loadText(await file.text(),file.name)}
  catch(error){status("불러오기 실패: "+error.message,true)}
  event.target.value="";
};

$("load-nearby").onclick=async()=>{
  if(pendingRead)return;
  pendingRead=true;
  try{
    if(location.protocol==="file:"){
      throw Error("PC에서 직접 열었을 때는 위의 파일 선택을 사용해 주세요.");
    }
    const response=await fetch("./index.html",{cache:"no-store"});
    if(!response.ok)throw Error("index.html을 찾지 못했습니다.");
    await loadText(await response.text(),"index.html");
  }catch(error){
    status(error.message,true);
  }finally{pendingRead=false}
};

document.querySelectorAll("[data-tab]").forEach(button=>{

function field(parent,label,value,onChange,type="input"){
  const wrap=document.createElement("div");
  wrap.className="field";
  const id="field-"+cryptoRandom();
  const caption=document.createElement("label");
  caption.htmlFor=id;
  caption.textContent=label;
  const input=document.createElement(type==="textarea"?"textarea":"input");
  input.id=id;
  input.value=value??"";
  input.oninput=()=>{
    onChange(input.value);
    changed();
  };
  wrap.append(caption,input);
  parent.append(wrap);
  return input;
}

function cryptoRandom(){
  return Math.random().toString(36).slice(2);
}

function stageButtons(){
  const sidebar=$("sidebar");
  sidebar.innerHTML="";
  config.titles.forEach((title,index)=>{
    const button=document.createElement("button");
    button.classList.toggle("active",selectedStage===index);
    button.innerHTML=`${index+1}번 미션<small>${escapeHTML(title)}</small>`;

function render(){
  if(!config)return;
  document.querySelectorAll("[data-tab]").forEach(button=>{
    button.classList.toggle("active",button.dataset.tab===tab);
  });

  $("panel").innerHTML="";
  $("sidebar").hidden=!["story","guide","hint"].includes(tab);
  $("sidebar").parentElement.style.gridTemplateColumns=
    $("sidebar").hidden?"1fr":"";
  if(!$("sidebar").hidden)stageButtons();

  if(tab==="story")renderStory();
  if(tab==="guide")renderGuideEditor();
  if(tab==="hint")renderHints();
  if(tab==="answer")renderAnswers();
  if(tab==="asset")renderAssets();

  heading("대사·지문 편집","대사 순서를 바꾸거나 추가·삭제할 수 있습니다.");
  const selector=document.createElement("select");
  selector.innerHTML=`

    <option value="after">선택한 미션: 해결 후 대화</option>
    <option value="intro">공통: 처음 도입 대화</option>
    <option value="epilogue">공통: 에필로그</option>`;
  selector.value=storySection;
  selector.onchange=()=>{
    storySection=selector.value;
    renderStory();
  };
  $("panel").append(selector);

  const lines=currentLines();
  const names=[...new Set(["해치","주작","청룡","백호","현무","별",
    ...lines.map(line=>line.name).filter(Boolean)])];

  lines.forEach((line,index)=>{
    const box=document.createElement("div");
    box.className="line-card";

    const head=document.createElement("div");
    head.className="line-head";
    head.innerHTML=`<strong>${index+1}번째 메시지</strong>`;

    const actions=document.createElement("div");
    actions.className="line-actions";

    [
      ["↑",-1,index===0],
      ["↓",1,index===lines.length-1],
      ["삭제",0,lines.length===1]
    ].forEach(([label,delta,disabled])=>{
      const button=document.createElement("button");
      button.textContent=label;
      button.disabled=disabled;
      button.onclick=()=>{
        if(delta){
          [lines[index],lines[index+delta]]=[lines[index+delta],lines[index]];
        }else lines.splice(index,1);
        changed();
        renderStory();
      };
      actions.append(button);
    });

    head.append(actions);
    box.append(head);

    const label=document.createElement("label");
    label.textContent="화자";
    const select=document.createElement("select");
    select.innerHTML=
      `<option value="">지문 — 이름 없이 표시</option>`+
      names.map(name=>`<option>${escapeHTML(name)}</option>`).join("");
    select.value=line.name||"";
    select.onchange=()=>{
      line.name=select.value||null;
      changed();
    };
    box.append(label,select);

    field(box,"내용",line.text,value=>line.text=value,"textarea");
    $("panel").append(box);
  });

  const add=document.createElement("button");
  add.textContent="메시지 추가";
  add.onclick=()=>{
    lines.push({name:"해치",text:"새 대사를 입력하세요."});
    changed();
    renderStory();
  };
  $("panel").append(add);
}

/* 다운로드하는 게임에 설정을 적용하는 함수 */
function applyGameConfig(C){
  function replaceArray(target,values){
    target.splice(0,target.length,...values);
  }

  replaceArray(ARRIVAL,C.arrival);
  replaceArray(AFTER,C.after);
  replaceArray(EPILOGUE,C.epilogue);
  replaceArray(TITLES,C.titles);
  replaceArray(PLACES,C.places);
  replaceArray(GUIDE_LINES,C.guides);
  replaceArray(HINTS,C.hints);
  replaceArray(MEMORY_NAMES,C.memoryNames);
  replaceArray(MEMORY_TEXTS,C.memoryTexts);

  Object.assign(STAR,C.assets.star);
  Object.assign(CHAR,C.assets.characters);
  CHAR["별"]=STAR.awake;

  const files={
    "intro.gif":C.assets.intro,
    "outro.gif":C.assets.outro,
    "bgm.mp3":C.assets.bgm
  };
  C.assets.backgrounds.forEach((path,i)=>{
    files["image_"+String(i+1).padStart(2,"0")+".png"]=path;
  });
  C.assets.routes.forEach((path,i)=>{
    files["route_"+String(i+1).padStart(2,"0")+".png"]=path;
  });

  const previousBackground=background;
  background=function(file,fallback){
    return previousBackground(files[file]||file,files[fallback]||fallback);
  };

  const previousIntro=renderIntro;
  renderIntro=function(){
    previousIntro();
    const image=document.querySelector(".intro-image");
    if(image&&C.assets.intro!=="intro.gif")image.src=C.assets.intro;
  };

  const previousGuide=renderGuide;
  renderGuide=function(){
    if(state.stage===0){
      renderDialogue(C.intro,transitionToArrival,"장식 상子".replace("相子","相子").replace("상子","상자")+" 찾으러 가기");
    }else previousGuide();
  };

  const notes=["도","도♯","레","레♯","미","파","파♯","솔","솔♯","라","라♯","시","높은 도"];
  const bookTitles={
    river:"한강 산책",
    moon:"달빛 동화",
    night:"서울의 밤",
    window:"작은 창문"
  };
  const directions=["위쪽","오른쪽","아래쪽","왼쪽"];

  const previousPiano=pianoPuzzle;
  pianoPuzzle=function(card){
    previousPiano(card);
    const line=card.querySelector(".test-score p");
    if(line)line.textContent=C.answers.piano.map(n=>notes[n]).join(" ");
  };

  const previousBook=bookPuzzle;
  bookPuzzle=function(card){
    previousBook(card);
    const clue=card.querySelector(".field-clue");
    if(clue){
      clue.textContent="테스트용 현장 단서 · 왼쪽부터\n"+
        C.answers.books.map(id=>bookTitles[id]).join(" → ");
      clue.style.whiteSpace="pre-line";
    }
  };

  const previousWish=wishPuzzle;
  wishPuzzle=function(card){
    previousWish(card);
    const clue=card.querySelector(".field-clue");
    if(clue){
      clue.textContent="테스트용 현장 단서\n"+
        ["강아지","눈사람","가족"].map((name,i)=>
          name+": "+directions[C.answers.wishes[i]]).join(" / ");
      clue.style.whiteSpace="pre-line";
    }
  };

  const audio=document.getElementById("bgm");
  if(audio&&audio.getAttribute("src")!==C.assets.bgm){
    audio.src=C.assets.bgm;
    audio.load();
  }

  const select=document.getElementById("stage-select");
  if(select){
    select.replaceChildren();
    C.titles.forEach((title,index)=>{
      const option=document.createElement("option");
      option.value=String(index);
      option.textContent=(index+1)+". "+title;
      select.append(option);
    });
  }

  go("intro",0);
}

/* 正答の変更対象があることを確認してから書き換える */
function buildGame(){
  validate(config);
  let output=removeAdminBlocks(source);

  const required=[
    ["1번 자물쇠",LOCK_PATTERN],
    ["5번 피아노",PIANO_PATTERN],
    ["4번 책장",BOOK_PATTERN],
    ["6번 소원 조각",WISH_PATTERN]
  ];
  for(const [name,pattern] of required){
    if(!pattern.test(output)){
      throw Error(
        name+"의 정답 코드를 찾지 못했습니다.\n"+
        "이 관리자 페이지는 마지막 전체 코드에 ①②③ 수정 블록을 추가한 버전용입니다."
      );
    }
  }

  output=output.replace(
    LOCK_PATTERN,
    ()=>"dials.word()==="+JSON.stringify(config.answers.lock)
  );
  output=output.replace(
    PIANO_PATTERN,
    ()=>"const target="+JSON.stringify(config.answers.piano)
  );
  output=output.replace(
    BOOK_PATTERN,
    ()=>"const answer="+JSON.stringify(config.answers.books)
  );
  output=output.replace(
    WISH_PATTERN,
    ()=>"const answerTurns="+JSON.stringify(config.answers.wishes)
  );

  if(!/\bconst\s+TEST_MODE\s*=\s*(?:true|false)\s*;/.test(output)){
    throw Error("TEST_MODE 설정을 찾지 못했습니다.");
  }
  output=output.replace(
    /\bconst\s+TEST_MODE\s*=\s*(?:true|false)\s*;/,
    ()=>"const TEST_MODE = "+Boolean(config.testMode)+";"
  );

  /*
    이전 진행 저장과 충돌하지 않도록 설정마다 저장 키를 분리.
    관리자 출력 파일을 반복 편집해도 키 문자열이 계속 늘어나지 않음.
  */
  let hash=2166136261;
  const settingsText=JSON.stringify(config);
  for(let i=0;i<settingsText.length;i++){
    hash=Math.imul(hash^settingsText.charCodeAt(i),16777619);
  }
  const saveKey="seoul-star-admin-"+(hash>>>0).toString(36);
  output=output.replace(
    /\bconst\s+SAVE_KEY\s*=\s*["'][^"']*["']\s*;/,
    ()=>"const SAVE_KEY = "+JSON.stringify(saveKey)+";"
  );

  /* HTML 안의 닫는 태그가 입력 내용에 포함되어도 안전하게 보관 */
  const safeJSON=JSON.stringify(config).replace(/</g,"\\u003c");

  const metadata=
    '<script type="application/json" id="gallery-admin-config">'+
    safeJSON+
    '<'+'/script>';

  const runtime=
    '<!-- GALLERY_ADMIN_START -->\n'+
    '<script>\n'+
    '('+applyGameConfig.toString()+')('+
      'JSON.parse(document.getElementById("gallery-admin-config").textContent)'+
    ');\n'+
    '<'+'/script>\n'+
    '<!-- GALLERY_ADMIN_END -->';

  output=output.replace(/<\/body\s*>/i,()=>metadata+"\n"+runtime+"\n</body>");
  return output;
}

function download(filename,text,type){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}

    download("index.html",output,"text/html;charset=utf-8");

    $("dirty-label").textContent="ダウンロード済み".replace("ダウンロード済み","다운로드 완료");

$("settings-file").onchange=async event=>{
  const file=event.target.files[0];
  if(!file)return;

  try{
    const data=JSON.parse(await file.text());
    validate(data);
    if(dirty&&!confirm("현재 수정 내용을 백업 설정으로 바꿀까요?"))return;
    config=clone(data);
    changed();
    render();
    status("백업 설정을 적용했습니다. 수정된 index.html을 다운로드하세요.");
  }catch(error){
    status("백업 불러오기 실패: "+error.message,true);
  }finally{
    event.target.value="";
  }
};

window.addEventListener("beforeunload",event=>{
  if(!dirty)return;
  event.preventDefault();
  event.returnValue="";
});
</script>
</body>
</html>
